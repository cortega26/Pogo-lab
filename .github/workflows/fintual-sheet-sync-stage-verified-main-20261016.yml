name: G8 stage immutable Chrome-free Sheet projector (no service change)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/fintual-sheet-sync-stage-verified-main-20261016.yml]
permissions:
  contents: read
jobs:
  stage-readonly-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live HTTPX safety and stage main-exact Sheets-only source
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 150s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-active fintual-browser.service || true)" = inactive
            test "$(systemctl is-enabled fintual-browser.service)" = disabled
            test "$(systemctl is-active fintual-sheet-sync.service || true)" = inactive
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = disabled
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = /opt/fintual-httpx-releases/e922e0d153f32c8319bc4ec8b9165f39c7dfeac8
