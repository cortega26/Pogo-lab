303d"],["src/fintual_executor/session_ipc.py","36ee9dd0fda5bad160877cfc087df30243183aa1"],["src/fintual_executor/shadow_http.py","a14a314ca7a13be7a60b55d2f1d49e224956058a"],["src/fintual_executor/shadow_isolated_chrome.py","08ab8219ff1de8580a46a9d5021b0e3df01ca5f7"],["src/fintual_executor/shadow_lifecycle.py","0b5d1466c89f466c8f4ccee0837bea02783c5c6a"],["src/fintual_executor/shadow_longrun.py","a1e0397d54e504ade5e1fc928f2bb9a9465ff0b2"],["src/fintual_executor/shadow_probe.py","a88d2b84d0241495d07d32cabedaaf986e312cbe"],["src/fintual_executor/sheet_sync.py","3b714464f669f179c84ef2a3d24b4bb6ebbe02ed"],["src/fintual_executor/state.py","4ec8e5cf8c77700dd3bd2d8ca90d27f809bc0a26"],["src/fintual_executor/transient_auth.py","d79a1fc35a73b7c87f4688d489531d37ab92d0cd"]])
            SOURCE = "from __future__ import annotations\n\nimport json\nimport os\nimport time\nfrom dataclasses import dataclass\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib import Path\nfrom typing import Any\nfrom urllib.error import HTTPError, URLError\nfrom urllib.request import Request, urlopen\n\nfrom .client import (\n    FintualClient,\n    get_buy_state,\n    get_wallet_cash_interests,\n    get_wallet_dividends,\n)\nfrom .google_sheets import GoogleSheetConfig, GoogleSheetsProjector\nfrom .state import StateStore\n\nURL_ENV = \"FINTUAL_SHEET_WEBHOOK_URL\"\nTOKEN_ENV = \"FINTUAL_SHEET_WEBHOOK_TOKEN\"\nSPREADSHEET_ENV = \"FINTUAL_SHEET_SPREADSHEET_ID\"\nCREDENTIALS_ENV = \"GOOGLE_APPLICATION_CREDENTIALS\"\nDEFAULT_TIMEOUT_SECONDS = 5.0\n_PROJECTORS: dict[tuple[str, str], GoogleSheetsProjector] = {}\nDEFAULT_CASH_EVENT_LOOKBACK_DAYS = 14\nDEFAULT_CASH_EVENT_POLL_SECONDS = 300\n\n\nclass SheetSyncError(RuntimeError):\n    pass\n\n\n@dataclass(frozen=True)\nclass SheetSyncSettings:\n    url: str = \"\"\n    token: str = \"\"\n    timeout_seconds: float = DEFAULT_TIMEOUT_SECONDS\n    spreadsheet_id: str = \"\"\n    credentials_file: str = \"\"\n\n\ndef settings_from_env() -> SheetSyncSettings | None:\n    spreadsheet_id = os.environ.get(SPREADSHEET_ENV, \"\").strip()\n    credentials_file = os.environ.get(CREDENTIALS_ENV, \"\").strip()\n    if spreadsheet_id or credentials_file:\n        if not spreadsheet_id or not credentials_file:\n            raise SheetSyncError(\n                f\"{SPREADSHEET_ENV} and {CREDENTIALS_ENV} must be configured together\"\n            )\n        return SheetSyncSettings(\n            spreadsheet_id=spreadsheet_id,\n            credentials_file=credentials_file,\n        )\n\n    url = os.environ.get(URL_ENV, \"\").strip()\n    token = os.environ.get(TOKEN_ENV, \"\").strip()\n    if not url and not token:\n        return None\n    if not url or not token:\n        raise SheetSyncError(f\"{URL_ENV} and {TOKEN_ENV} must be configured together\")\n    if not url.startswith(\"https://\"):\n        raise SheetSyncError(f\"{URL_ENV} must use HTTPS\")\n    return SheetSyncSettings(url=url, token=token)\n\n\ndef _payload(row: Any, token: str) -> dict[str, str]:\n    return {\n        \"token\": token,\n        \"event_type\": \"fill\",\n        \"fintual_operation_id\": str(row[\"fintual_operation_id\"]),\n        \"intent_id\": str(row[\"intent_id\"] or \"\"),\n        \"symbol\": str(row[\"symbol\"]),\n        \"side\": str(row[\"side\"]),\n        \"asset_order_id\": str(row[\"asset_order_id\"]),\n        \"average_price\": str(row[\"average_price\"]),\n        \"shares\": str(row[\"shares\"]),\n        \"capital_usd\": str(row[\"capital_usd\"]),\n        \"charged_commission_usd\": str(row[\"charged_commission_usd\"]),\n        \"fulfilled_at\": str(row[\"fulfilled_at\"]),\n    }\n\n\ndef _projector(settings: SheetSyncSettings) -> GoogleSheetsProjector:\n    key = (settings.spreadsheet_id, settings.credentials_file)\n    projector = _PROJECTORS.get(key)\n    if projector is None:\n        projector = GoogleSheetsProjector.from_service_account(\n            GoogleSheetConfig(\n                spreadsheet_id=settings.spreadsheet_id,\n                credentials_file=Path(settings.credentials_file),\n            )\n        )\n        _PROJECTORS[key] = projector\n    return projector\n\n\ndef _post(settings: SheetSyncSettings, payload: dict[str, str]) -> dict[str, Any]:\n    if settings.spreadsheet_id:\n        direct_payload = dict(payload)\n        direct_payload.pop(\"token\", None)\n        return _projector(settings).send(direct_payload)\n\n    body = json.dumps(payload, sort_keys=True).encode(\"utf-8\")\n    request = Request(\n        settings.url,\n        data=body,\n        headers={\"Content-Type\": \"application/json; charset=utf-8\"},\n        method=\"POST\",\n    )\n    try:\n        with urlopen(request, timeout=settings.timeout_seconds) as response:\n            raw = response.read()\n    except (HTTPError, URLError, TimeoutError, OSError) as exc:\n        raise SheetSyncError(f\"webhook transport failed: {type(exc).__name__}: {exc}\") from exc\n\n    try:\n        result = json.loads(raw.decode(\"utf-8\"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise SheetSyncError(\"webhook returned invalid JSON\") from exc\n    if result.get(\"ok\") is not True:\n        raise SheetSyncError(f\"webhook rejected event: {result.get('error') or 'unknown error'}\")\n    return result\n\n\ndef drain_sheet_sync_outbox(\n    store: StateStore,\n    settings: SheetSyncSettings | None = None,\n    *,\n    limit: int = 25,\n) -> list[tuple[str, str]]:\n    active = settings if settings is not None else settings_from_env()\n    if active is None:\n        return []\n\n    results: list[tuple[str, str]] = []\n    for row in store.pending_sheet_syncs(limit=limit):\n        operation_id = str(row[\"fintual_operation_id\"])\n        payload = _payload(row, active.token)\n        try:\n            response = _post(active, payload)\n        except Exception as exc:\n            error = f\"{type(exc).__name__}: {exc}\"\n            store.mark_sheet_sync_failure(operation_id, error)\n            store.audit(\n                \"SHEET_SYNC_FAILED\",\n                {\"fintual_operation_id\": operation_id, \"error\": error},\n                intent_id=str(row[\"intent_id\"] or \"\") or None,\n            )\n            results.append((operation_id, \"FAILED\"))\n            break\n\n        if str(response.get(\"fintual_operation_id\")) != operation_id:\n            error = \"webhook acknowledgement operation id mismatch\"\n            store.mark_sheet_sync_failure(operation_id, error)\n            store.audit(\n                \"SHEET_SYNC_FAILED\",\n                {\"fintual_operation_id\": operation_id, \"error\": error},\n                intent_id=str(row[\"intent_id\"] or \"\") or None,\n            )\n            results.append((operation_id, \"FAILED\"))\n            break\n\n        status = str(response.get(\"status\") or \"synced\").upper()\n        store.mark_sheet_sync_success(operation_id)\n        store.audit(\n            \"SHEET_SYNCED\",\n            {\"fintual_operation_id\": operation_id, \"remote_status\": status},\n            intent_id=str(row[\"intent_id\"] or \"\") or None,\n        )\n        results.append((operation_id, status))\n    return results\n\n\ndef _event_is_recent(created_at: str, cutoff: datetime) -> bool:\n    observed = datetime.fromisoformat(created_at).astimezone(timezone.utc)\n    return observed >= cutoff\n\n\ndef sync_broker_cash_events(\n    store: StateStore,\n    settings: SheetSyncSettings,\n    *,\n    lookback_days: int = DEFAULT_CASH_EVENT_LOOKBACK_DAYS,\n    now: datetime | None = None,\n) -> list[tuple[str, str]]:\n    current = (now or datetime.now(timezone.utc)).astimezone(timezone.utc)\n    cutoff = current - timedelta(days=lookback_days)\n    client = FintualClient(execution_enabled=False).connect()\n    try:\n        dividends = get_wallet_dividends(client)\n        interests = get_wallet_cash_interests(client)\n        buy_state = get_buy_state(client)\n    finally:\n        client.close()\n\n    events: list[tuple[datetime, dict[str, str]]] = []\n    for row in interests:\n        created_at = str(row[\"createdAt\"])\n        if not _event_is_recent(created_at, cutoff):\n            continue\n        event_id = f\"fintual-cash-interest:{row['id']}\"\n        events.append(\n            (\n                datetime.fromisoformat(created_at).astimezone(timezone.utc),\n                {\n                    \"token\": settings.token,\n                    \"event_type\": \"cash_interest\",\n                    \"source_id\": event_id,\n                    \"created_at\": created_at,\n                    \"amount_usd\": str(row[\"amount\"]),\n                },\n            )\n        )\n\n    for row in dividends:\n        created_at = str(row[\"createdAt\"])\n        if not _event_is_recent(created_at, cutoff):\n            continue\n        gross = row[\"grossCapital\"]\n        net = row[\"netCapital\"]\n        tax = row[\"taxCapital\"]\n        event_id = f\"fintual-dividend:{row['id']}\"\n        events.append(\n            (\n                datetime.fromisoformat(created_at).astimezone(timezone.utc),\n                {\n                    \"token\": settings.token,\n                    \"event_type\": \"dividend\",\n                    \"source_id\": event_id,\n                    \"created_at\": created_at,\n                    \"symbol\": str(row[\"asset\"][\"symbol\"]),\n                    \"gross_usd\": str(gross[\"amount\"]),\n                    \"net_usd\": str(net[\"amount\"]),\n                    \"tax_usd\": str(tax[\"amount\"]),\n                },\n            )\n        )\n\n    results: list[tuple[str, str]] = []\n    for _, payload in sorted(events, key=lambda item: item[0]):\n        response = _post(settings, payload)\n        source_id = payload[\"source_id\"]\n        if str(response.get(\"source_id\")) != source_id:\n            raise SheetSyncError(f\"webhook acknowledgement source id mismatch: {source_id}\")\n        status = str(response.get(\"status\") or \"synced\").upper()\n        results.append((source_id, status))\n        if status != \"DUPLICATE\":\n            store.audit(\n                \"SHEET_CASH_EVENT_SYNCED\",\n                {\"source_id\": source_id, \"event_type\": payload[\"event_type\"], \"remote_status\": status},\n            )\n\n    balance = buy_state[\"stocksWallet\"][\"investableAmount\"]\n    checkpoint = {\n        \"token\": settings.token,\n        \"event_type\": \"cash_checkpoint\",\n        \"observed_at\": current.isoformat(),\n        \"balance_usd\": str(balance[\"amount\"]),\n    }\n    response = _post(settings, checkpoint)\n    if response.get(\"event_type\") != \"cash_checkpoint\":\n        raise SheetSyncError(\"webhook checkpoint acknowledgement mismatch\")\n    delta = str(response.get(\"reconciliation_delta\") or \"0\")\n    status = str(response.get(\"status\") or \"synced\").upper()\n    if status != \"MATCHED\" or delta not in {\"0\", \"0.0\", \"0.00\"}:\n        store.audit(\n            \"SHEET_CASH_CHECKPOINT_MISMATCH\",\n            {\n                \"balance_usd\": checkpoint[\"balance_usd\"],\n                \"reconciliation_delta\": delta,\n                \"remote_status\": status,\n            },\n        )\n    results.append((\"cash_checkpoint\", status))\n    return results\n\n\ndef run_worker(\n    state_path: str,\n    interval_seconds: int = 30,\n    cash_event_poll_seconds: int = DEFAULT_CASH_EVENT_POLL_SECONDS,\n    *,\n    fills_only: bool = False,\n) -> None:\n    settings = settings_from_env()\n    if settings is None:\n        raise SheetSyncError(\n            \"Google Sheet sync credentials are required for the sync worker\"\n        )\n    store = StateStore(Path(state_path))\n    last_cash_event_poll = 0.0\n    while True:\n        # This explicit mode must not create, attach to, or authenticate a\n        # browser while the financial HTTPX executor owns the profile.\n        # Keep the downstream Google Sheets fill outbox independent of CDP.\n        fill_results = drain_sheet_sync_outbox(store, settings)\n        if not fills_only:\n            now_monotonic = time.monotonic()\n            if now_monotonic - last_cash_event_poll >= cash_event_poll_seconds:\n                try:\n                    sync_broker_cash_events(store, settings)\n                except Exception as exc:\n                    store.audit(\n                        \"SHEET_CASH_EVENT_SYNC_FAILED\",\n                        {\"error\": f\"{type(exc).__name__}: {exc}\"},\n                    )\n                last_cash_event_poll = now_monotonic\n        if settings.spreadsheet_id:\n            try:\n                status = \"DEGRADED_CASH_SYNC\" if fills_only else \"RUNNING\"\n                if any(result == \"FAILED\" for _, result in fill_results):\n                    status = \"DEGRADED_FILLS_AND_CASH_SYNC\" if fills_only else \"DEGRADED_FILL_SYNC\"\n                _projector(settings).update_runtime_status(\n                    store.sheet_sync_pending_count(), state=status\n                )\n            except Exception as exc:\n                store.audit(\n                    \"SHEET_SYNC_STATUS_UPDATE_FAILED\",\n                    {\"error\": f\"{type(exc).__name__}: {exc}\"},\n                )\n        time.sleep(interval_seconds)\n\n\ndef main() -> int:\n    import argparse\n\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--state\", default=\"state.sqlite3\")\n    parser.add_argument(\"--interval\", type=int, default=30)\n    parser.add_argument(\n        \"--cash-event-poll\",\n        type=int,\n        default=DEFAULT_CASH_EVENT_POLL_SECONDS,\n    )\n    parser.add_argument(\n        \"--fills-only\",\n        action=\"store_true\",\n        help=\"Project already-confirmed fills to Sheets; never connect to Fintual/CDP\",\n    )\n    args = parser.parse_args()\n    if args.interval <= 0:\n        parser.error(\"--interval must be positive\")\n    if args.cash_event_poll <= 0:\n        parser.error(\"--cash-event-poll must be positive\")\n    try:\n        run_worker(\n            args.state, args.interval, args.cash_event_poll,\n            fills_only=args.fills_only,\n        )\n    except KeyboardInterrupt:\n        return 0\n    except Exception as exc:\n        print(\n            json.dumps(\n                {\"ok\": False, \"state\": \"SHEET_SYNC_WORKER_ERROR\", \"error\": str(exc)},\n                ensure_ascii=False,\n            ),\n            flush=True,\n        )\n        return 1\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
            UNIT = "[Unit]\nDescription=Fintual Google Sheets confirmed-fill projector (CDP-free, cash sync paused)\nAfter=fintual-executor.service network-online.target\nWants=network-online.target\n\n[Service]\nType=simple\nUser=fintual\nGroup=fintual\nWorkingDirectory=/opt/fintual-sheet-sync-current\nEnvironment=PYTHONPATH=/opt/fintual-sheet-sync-current/src\nEnvironment=PYTHONDONTWRITEBYTECODE=1\nEnvironmentFile=/etc/fintual-executor/sheet-sync.env\nExecStart=/opt/fintual-sheet-sync-venv/bin/python -m fintual_executor.sheet_sync \\\n  --state /var/lib/fintual-executor/state.sqlite3 \\\n  --interval 30 \\\n  --cash-event-poll 300 \\\n  --fills-only\nRestart=always\nRestartSec=30\nUMask=0077\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\nProtectHome=read-only\nReadOnlyPaths=/etc/fintual-executor/sheet-sync.env /etc/fintual-executor/google-sheet-sync.json\nReadWritePaths=/var/lib/fintual-executor\n\n[Install]\nWantedBy=multi-user.target\n"
            root = Path("/opt/fintual-sheet-sync-releases")
            base = Path("/opt/fintual-httpx-releases") / BASE
            target = root / MAIN
            alias = Path("/opt/fintual-sheet-sync-current")
            assert base.is_dir() and (base/"src/fintual_executor/google_sheets.py").is_file(), "MISSING_FROZEN_BASE"
            assert root.exists() is False or (root.is_dir() and root.stat().st_uid == 0 and not root.is_symlink()), "UNSAFE_RELEASE_ROOT"
            root.mkdir(mode=0o755, exist_ok=True)
            temp=None
            try:
                if not target.exists():
                    temp=Path(tempfile.mkdtemp(prefix=".stage-"+MAIN[:12]+"-",dir=root))
                    shutil.copytree(base/"src", temp/"src", symlinks=False)
                    dest=temp/"src/fintual_executor/sheet_sync.py"
                    assert dest.is_file() and not dest.is_symlink()
                    dest.write_text(SOURCE,encoding="utf-8")
                    (temp/"deploy/oracle").mkdir(parents=True)
                    (temp/"deploy/oracle/fintual-sheet-sync.service").write_text(UNIT,encoding="utf-8")
                    os.chmod(temp,0o755)
                    os.rename(temp,target)
                    temp=None
                assert target.is_dir() and not target.is_symlink() and target.stat().st_uid == 0, "BAD_RELEASE_TARGET"
                files={str(p.relative_to(target)):p for p in (target/"src").rglob("*.py")}
                assert set(files)==set(EXPECTED),"DIFFERENT_PACKAGE_FILE_SET"
                for name, expected_sha in EXPECTED.items():
                    raw=files[name].read_bytes()
                    actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
                    assert actual==expected_sha,"SOURCE_GIT_BLOB_MISMATCH:"+name
                stored=(target/"deploy/oracle/fintual-sheet-sync.service").read_text(encoding="utf-8")
                assert stored==UNIT and "--fills-only" in stored, "UNIT_MISMATCH"
                assert "Requires=fintual-browser.service" not in stored and "After=fintual-browser.service" not in stored, "LEGACY_BROWSER_DEPENDENCY"
                assert "/opt/fintual-sheet-sync-current/src" in stored, "SHEET_ALIAS_ABSENT"
                assert "/opt/fintual-executor/src" not in stored, "LEGACY_CODE_REFERENCED"
                if alias.is_symlink():
                    assert alias.resolve()==target, "ALIAS_ALREADY_POINTS_ELSEWHERE"
                else:
                    assert not alias.exists(), "ALIAS_NON_SYMLINK"
                    alias.symlink_to(target)
                print("G8_SHEET_STAGED_MAIN_SHA="+MAIN,flush=True)
                print("G8_SHEET_SOURCE_BLOBS_VERIFIED="+str(len(files)),flush=True)
                print("G8_SHEET_FILLS_ONLY_NO_CDP_UNIT=PASS",flush=True)
                print("G8_SHEET_ALIAS_STAGED=TRUE",flush=True)
            finally:
                if temp is not None and temp.exists():
                    shutil.rmtree(temp)
            
