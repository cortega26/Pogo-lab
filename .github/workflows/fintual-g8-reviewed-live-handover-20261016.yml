name: Fintual G8 single-writer HTTPX production handover with autonomous restore
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-reviewed-live-handover-20261016.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check orders, backup, switch one service, verify Chrome stopped, rollback if unhealthy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 240s
          script: |
            set -euo pipefail
            SOURCE=e922e0d153f32c8319bc4ec8b9165f39c7dfeac8
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            ROOT=/opt/fintual-httpx-releases/$SOURCE
            ALIAS=/opt/fintual-httpx-current
            FINANCIAL=/var/lib/fintual-executor/state.sqlite3
            UNITS=/var/lib/fintual-g8-unit-prestage
            UNITFILE=/etc/systemd/system/fintual-executor.service
            ACK=/etc/fintual-executor/httpx-order.env
            BACKUPS=/var/lib/fintual-g8-backups
            assert_old() {
              test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
              for s in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
                test "$(timeout 8s systemctl is-active "$s")" = active
              done
              test "$(systemctl is-enabled fintual-executor.service)" = enabled
              test "$(systemctl is-enabled fintual-browser.service)" = enabled
            }
            assert_old
            test ! -e "$ACK"
            if test -L "$ALIAS"; then
              test "$(sudo -n readlink "$ALIAS")" = "$ROOT"
            else
              test ! -e "$ALIAS"
            fi
            sudo -n test -f "$ROOT/HTTPX_RUNTIME_READY.json"
            sudo -n cmp -s "$UNITFILE" "$UNITS/original-fintual-executor.service"
            sudo -n env SOURCE="$SOURCE" ROOT="$ROOT" /usr/bin/python3 - <<'PY'
            import json,os,hashlib
            from pathlib import Path
            sha=os.environ["SOURCE"]
            root=Path(os.environ["ROOT"])
            ready=json.loads((root/"HTTPX_RUNTIME_READY.json").read_text())
            assert ready["source_sha"]==sha and ready["runtime_imports_verified"]
            assert not ready["orders_enabled"] and not ready["services_modified"]
            unit=(root/"deploy/oracle/fintual-httpx-order.service.example").read_bytes()
            assert b"EnvironmentFile=/etc/fintual-executor/httpx-order.env" in unit
            assert b"Requires=fintual-browser.service" not in unit
            assert b"Requires=fintual-xvfb.service" in unit
            assert b"[Install]" in unit
            print("G8_EXACT_RELEASE_AND_REBOOT_SAFE_UNIT=PASS",flush=True)
            PY
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$ROOT/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 55s "$ROOT/.venv/bin/python" -u - <<'PY'
            import sqlite3
            from pathlib import Path
            from fintual_executor.client import get_pending
            from fintual_executor.order_session import HttpOrderSessionOwner
            path=Path("/var/lib/fintual-executor/state.sqlite3")
            con=sqlite3.connect(path.as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                con.execute("PRAGMA query_only=ON")
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                states="('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')"
                assert con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN "+states).fetchone()[0]==0
            finally:con.close()
            with HttpOrderSessionOwner(requested_execution=False,config_execution_enabled=False) as owner:
                owner.bootstrap_once()
                pending=get_pending(owner.borrow(armed=False))
                assert pending["stocksPendingAssetMarketBuys"]==[]
                assert pending["stocksPendingAssetMarketSells"]==[]
            print("G8_BROKER_AND_FINANCIAL_LEDGER_NO_OUTSTANDING_ORDERS=PASS",flush=True)
            PY
            # Fully independent root-owned rollback, with fresh-ledger check.
            sudo -n env UNITS="$UNITS" UNITFILE="$UNITFILE" ACK="$ACK" ALIAS="$ALIAS" /usr/bin/python3 - <<'PY'
            import os,stat
            from pathlib import Path
            root=Path(os.environ["UNITS"])
            assert root.is_dir() and root.stat().st_uid==0 and stat.S_IMODE(root.stat().st_mode)==0o700
            rollback=root/"g8-restore-original.sh"
            script='''#!/bin/bash
            set -euo pipefail
            OLD=/var/lib/fintual-g8-unit-prestage/original-fintual-executor.service
            CURRENT=/etc/systemd/system/fintual-executor.service
            DB=/var/lib/fintual-executor/state.sqlite3
            N=$(/usr/bin/python3 - <<'DBPY'
            import sqlite3
            from pathlib import Path
            p=Path("/var/lib/fintual-executor/state.sqlite3")
            c=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                c.execute("PRAGMA query_only=ON")
                states="('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')"
                print(c.execute("SELECT COUNT(*) FROM order_intents WHERE state IN "+states).fetchone()[0])
            finally:c.close()
            DBPY
            )
            if test "$N" != 0; then
              echo G8_AUTOROLLBACK_BLOCKED_OUTSTANDING_FINANCIAL_INTENTS="$N"
              exit 11
            fi
            systemctl stop fintual-executor.service || true
            install -o root -g root -m 0644 "$OLD" "$CURRENT"
            rm -f /etc/fintual-executor/httpx-order.env
            systemctl daemon-reload
            systemctl enable --now fintual-browser.service
            systemctl enable --now fintual-executor.service
            test "$(systemctl is-active fintual-browser.service)" = active
            test "$(systemctl is-active fintual-executor.service)" = active
            echo G8_ORIGINAL_EXECUTOR_RESTORED_WITH_CURRENT_LEDGER=TRUE
            '''
            # An immutable, reviewable restore script. Never replace if changed.
            body=script.encode()
            if rollback.exists():
                assert rollback.read_bytes()==body
            else:
                fd=os.open(rollback,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o700)
                with os.fdopen(fd,"wb") as handle:handle.write(body)
            assert stat.S_IMODE(rollback.stat().st_mode)==0o700
            print("G8_INDEPENDENT_ROLLBACK_SCRIPT_PREPARED=TRUE",flush=True)
            PY
            ROLLBACK="$UNITS/g8-restore-original.sh"
            TOKEN="fintual-g8-rollback-$$"
            COMMITTED=0
            restore() {
              if test "$COMMITTED" -ne 1; then
                echo G8_STAGE_FAILED_ATTEMPT_ROLLBACK=TRUE
                sudo -n timeout 45s "$ROLLBACK" || true
              fi
              sudo -n systemctl stop "$TOKEN.timer" >/dev/null 2>&1 || true
            }
            trap restore EXIT
            sudo -n systemd-run --quiet --on-active=165s --unit="$TOKEN" "$ROLLBACK"
            echo G8_AUTO_RESTORE_ARMED=TRUE
            sudo -n timeout 20s systemctl stop fintual-executor.service
            test "$(timeout 8s systemctl is-active fintual-executor.service)" = inactive
            sudo -n env FINANCIAL="$FINANCIAL" /usr/bin/python3 - <<'PY'
            import os,sqlite3
            from pathlib import Path
            con=sqlite3.connect(Path(os.environ["FINANCIAL"]).as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                con.execute("PRAGMA query_only=ON")
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                assert con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')").fetchone()[0]==0
            finally:con.close()
            print("G8_SINGLE_WRITER_QUIESCED_WITHOUT_OUTSTANDING_INTENTS=TRUE",flush=True)
            PY
            # A post-stop WAL-aware point captures the actual current state.
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$ROOT/src" timeout 35s "$ROOT/.venv/bin/python" \
              -m fintual_executor.g8_ledger_backup \
              --source "$FINANCIAL" --backup-root "$BACKUPS"
            sudo -n timeout 25s systemctl disable --now fintual-browser.service
            test "$(timeout 8s systemctl is-active fintual-browser.service)" = inactive
            test "$(systemctl is-enabled fintual-browser.service)" = disabled
            if ! test -L "$ALIAS"; then
              sudo -n ln -s "$ROOT" "$ALIAS"
            fi
            test "$(sudo -n readlink "$ALIAS")" = "$ROOT"
            sudo -n install -o root -g root -m 0600 \
              "$ROOT/deploy/oracle/fintual-httpx-order.env.example" "$ACK"
            sudo -n install -o root -g root -m 0644 \
              "$ROOT/deploy/oracle/fintual-httpx-order.service.example" "$UNITFILE"
            sudo -n systemctl daemon-reload
            sudo -n timeout 15s systemctl enable fintual-executor.service
            echo G8_HTTPX_INPLACE_UNIT_AND_ALIAS_INSTALLED=TRUE
            sudo -n timeout 45s systemctl start fintual-executor.service
            # The HTTPX runner must close Chrome before entering the market
            # stream; active status alone is not sufficient.
            sleep 12
            test "$(timeout 8s systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-enabled fintual-browser.service)" = disabled
            test "$(timeout 8s systemctl is-active fintual-browser.service)" = inactive
            sudo -n env FINANCIAL="$FINANCIAL" ROOT="$ROOT" ALIAS="$ALIAS" /usr/bin/python3 - <<'PY'
            import os,sqlite3,stat,subprocess
            from pathlib import Path
            root=Path(os.environ["ROOT"]);alias=Path(os.environ["ALIAS"])
            assert alias.is_symlink() and alias.resolve()==root
            proc=Path("/proc")
            for pid in proc.iterdir():
                if not pid.name.isdigit():continue
                try:raw=(pid/"cmdline").read_bytes()
                except (PermissionError,OSError):continue
                parts=raw.split(bytes([0]))
                if parts and (b"chrome" in parts[0].lower() or b"chromium" in parts[0].lower()):
                    assert b"--user-data-dir=/var/lib/fintual-browser/profile" not in raw, "Resident Fintual Chrome still alive"
            profile=Path("/var/lib/fintual-browser/profile")
            assert not os.path.lexists(profile/"SingletonLock"),"Live browser profile lock remains"
            db=Path(os.environ["FINANCIAL"])
            con=sqlite3.connect(db.as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                con.execute("PRAGMA query_only=ON")
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                states="('UNKNOWN','SUBMITTING')"
                count=con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN "+states).fetchone()[0]
                assert count==0,"Unknown financial order after HTTPX startup"
            finally:con.close()
            print("G8_RESIDENT_CHROME_PROCESS_AND_PROFILE_LOCK_ABSENT=TRUE",flush=True)
            print("G8_FINANCIAL_LEDGER_INTEGRITY_AND_UNKNOWN_FENCE=PASS",flush=True)
            PY
            echo G8_NEW_EXECUTOR_SERVICE_ACTIVE_AND_REBOOT_ENABLED=TRUE
            COMMITTED=1
            sudo -n systemctl stop "$TOKEN.timer" >/dev/null 2>&1 || true
            trap - EXIT
            echo G8_PRODUCTION_PROMOTED_HTTPX_CHROME_RETIRED=TRUE
