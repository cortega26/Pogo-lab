name: G8 final reboot recovery point (no service interruption)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-final-vm-reboot-backup-20261017.yml]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create root-private WAL-consistent financial backup and preboot identity
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 150s
          script: |
            set -euo pipefail
            ROOT=/var/lib/fintual-executor/g8-reboot-cert-20261017
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            test "$(systemctl is-enabled fintual-browser.service || :)" = disabled
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = /opt/fintual-httpx-releases/81e3fb22788582806c991d4fc2e89b9e54e7219a
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = /opt/fintual-sheet-sync-releases/b9d82a7668ea1ff67e9623499b0df6f778b50d1b
            sudo -n install -d -o root -g root -m 0700 "$ROOT"
            sudo -n /usr/bin/python3 - "$ROOT" <<'PY'
            import os,sys,json,stat,hashlib,sqlite3
            from pathlib import Path
            from datetime import datetime,timezone
            from zoneinfo import ZoneInfo
            root=Path(sys.argv[1])
            assert root.stat().st_uid==0 and stat.S_IMODE(root.stat().st_mode)==0o700
            assert datetime.now(ZoneInfo('America/New_York')).weekday() in (5,6),'No reboot backup on market weekday'
            boot_id=Path('/proc/sys/kernel/random/boot_id').read_text().strip()
            marker=root/'before_boot_id.txt'
            if marker.exists():
                assert marker.read_text().strip()==boot_id,'Stale boot marker: do not overwrite'
            else:
                fd=os.open(marker,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                with os.fdopen(fd,'w') as f:f.write(boot_id+'\n')
            for name in ('fintual-executor.service','fintual-sheet-sync.service'):
                src=Path('/etc/systemd/system')/name
                dest=root/name
                data=src.read_bytes()
                if dest.exists():
                    assert dest.read_bytes()==data,'Protected unit has changed'
                else:
                    fd=os.open(dest,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                    with os.fdopen(fd,'wb') as f:f.write(data)
            db=Path('/var/lib/fintual-executor/state.sqlite3')
            with sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=10) as con:
                con.execute('PRAGMA query_only=ON')
                assert con.execute('PRAGMA integrity_check').fetchone()==('ok',)
                states=('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')
                assert con.execute('SELECT COUNT(*) FROM order_intents WHERE state IN (?,?,?,?,?)',states).fetchone()[0]==0
            print('G8_REBOOT_BACKUP_UNIT_FINGERPRINTS=PASS',flush=True)
            print('G8_REBOOT_BACKUP_BOOT_ID='+boot_id,flush=True)
            PY
            sudo -n env PYTHONPATH=/opt/fintual-httpx-current/src \
              /opt/fintual-httpx-current/.venv/bin/python \
              -m fintual_executor.g8_ledger_backup \
              --source /var/lib/fintual-executor/state.sqlite3 \
              --backup-root "$ROOT" \
              | /usr/bin/python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='G8_ONLINE_RECOVERY_POINT_VERIFIED' and d['sqlite_integrity']=='ok' and d['snapshot_open_intents']==0 and d['snapshot_uncertain_submissions']==0; print('G8_REBOOT_FRESH_WAL_BACKUP=PASS'); print('G8_REBOOT_BACKUP_SNAPSHOT_FILLS='+str(d['snapshot_fills']))"
            echo G8_REBOOT_BACKUP_READY=PASS
