name: Fintual G5 exact failure cause sanitized journal forensic
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g5-failure-forensics-20261016.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read latest G5 failure phase and timing only, no cookies or credentials
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 115s
          script: |
            set -euo pipefail
            /usr/bin/python3 - <<'PY'
            import datetime as dt,json,subprocess
            from collections import Counter
            unit="fintual-g5-shadow-20261014.service"
            proc=subprocess.run(["journalctl","-u",unit,"--since=2026-10-15 14:00:00 UTC","--no-pager","-o","json"],capture_output=True,text=True,timeout=55)
            assert proc.returncode==0, "G5_JOURNAL_UNREADABLE"
            entries=[]
            for line in proc.stdout.splitlines():
                try:
                    row=json.loads(line); data=json.loads(row.get("MESSAGE",""))
                    if not isinstance(data,dict) or data.get("phase") not in {"BOOTSTRAP","HTTP_READS","AUTH_REQUIRED","END"}:
                        continue
                    timestamp=dt.datetime.fromtimestamp(int(row["__REALTIME_TIMESTAMP"])/1000000,dt.timezone.utc)
                    entries.append((timestamp,data))
                except (TypeError,ValueError,KeyError,OverflowError):
                    continue
            boots=[(t,row) for t,row in entries if row["phase"]=="BOOTSTRAP"]
            assert boots, "G5_NO_BOOTSTRAP_JOURNAL"
            entries=[(t,row) for t,row in entries if t>=boots[-1][0]]
            good=[(t,r) for t,r in entries if r["phase"]=="HTTP_READS" and r.get("ok") is True]
            fails=[(t,r) for t,r in entries if r.get("ok") is False]
            ends=[(t,r) for t,r in entries if r["phase"]=="END"]
            print("G5_BOOT_UTC="+boots[-1][0].isoformat(),flush=True)
            print("G5_OK_SAMPLES="+str(len(good)),flush=True)
            if good:
                print("G5_FIRST_OK_UTC="+good[0][0].isoformat(),flush=True)
                print("G5_LAST_OK_UTC="+good[-1][0].isoformat(),flush=True)
                print("G5_LAST_OK_ELAPSED_SECONDS="+str(good[-1][1].get("elapsed_seconds")),flush=True)
            for index,(t,r) in enumerate(fails[-3:],1):
                print("G5_FAILURE_"+str(index)+"_UTC="+t.isoformat(),flush=True)
                print("G5_FAILURE_"+str(index)+"_PHASE="+str(r.get("phase")),flush=True)
                print("G5_FAILURE_"+str(index)+"_CHECKPOINT="+str(r.get("checkpoint")),flush=True)
                print("G5_FAILURE_"+str(index)+"_ERROR_TYPE="+str(r.get("error_type","NOT_AVAILABLE")),flush=True)
                print("G5_FAILURE_"+str(index)+"_KIND="+str(r.get("failure_kind",r.get("reason","NOT_AVAILABLE"))),flush=True)
                print("G5_FAILURE_"+str(index)+"_LEASE_STATE="+str(r.get("state","NOT_AVAILABLE")),flush=True)
            if ends:
                t,r=ends[-1]
                print("G5_END_UTC="+t.isoformat(),flush=True)
                print("G5_END_OK="+str(r.get("ok")),flush=True)
                print("G5_END_ELAPSED="+str(r.get("elapsed_seconds")),flush=True)
            a=subprocess.run(["systemctl","is-active",unit],capture_output=True,text=True,timeout=8)
            print("G5_SERVICE_STATUS="+a.stdout.strip(),flush=True)
            for name in ("fintual-executor.service","fintual-browser.service","fintual-xvfb.service"):
                a=subprocess.run(["systemctl","is-active",name],capture_output=True,text=True,timeout=8)
                print("PRODUCTION_"+name.split(".")[0].upper().replace("-","_")+"="+a.stdout.strip(),flush=True)
            PY
