name: G8 diagnose missing Sheet Python runtime prerequisites
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/fintual-sheet-sync-runtime-preflight-diagnostics-20261016.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect dependencies only without printing credentials
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 80s
          script: |
            set -euo pipefail
            echo G8_SHEET_STAGED_ALIAS="$(sudo -n readlink -f /opt/fintual-sheet-sync-current || true)"
            for unit in fintual-executor.service fintual-browser.service fintual-sheet-sync.service; do
              echo G8_SERVICE_STATE_"$unit"="$(systemctl is-active "$unit" || true)"
              echo G8_SERVICE_ENABLED_"$unit"="$(systemctl is-enabled "$unit" || true)"
            done
            for exe in \
              /home/fintual/.uv-bootstrap/bin/uv \
              /home/fintual/.local/bin/uv \
              /opt/fintual-sheet-sync-venv/bin/python \
              /opt/fintual-httpx-current/.venv/bin/python \
              /opt/fintual-executor/.venv/bin/python; do
              if test -x "$exe"; then
                echo G8_DEPENDENCY_EXISTS_"$exe"=YES
                case "$exe" in
                  */bin/python) echo G8_PYTHON_VERSION_"$exe"="$("$exe" -V 2>&1)" ;;
                  */bin/uv) echo G8_UV_VERSION_"$exe"="$("$exe" --version 2>&1)" ;;
                esac
              else
                echo G8_DEPENDENCY_EXISTS_"$exe"=NO
              fi
            done
            echo G8_RUNTIME_DIAGNOSTICS_NO_SERVICE_CHANGES=TRUE
