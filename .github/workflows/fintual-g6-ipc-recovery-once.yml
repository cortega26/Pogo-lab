name: Fintual G5 isolated restart feasibility read-only
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-ipc-recovery-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify isolated shadow service template without reading secrets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 4m
          script: |
            /usr/bin/python3 - <<'PY'
            import os,re,subprocess
            name='fintual-g5-shadow-20261014.service'
            for field in ('LoadState','ActiveState','SubState','Result','ExecMainStatus','FragmentPath','User'):
                p=subprocess.run(['systemctl','show',name,'--property='+field,'--value'],capture_output=True,text=True,timeout=10)
                val=p.stdout.strip()
                if field=='FragmentPath': val='PRESENT' if val and os.path.exists(val) else 'MISSING'
                if field=='User': val='DEDICATED' if val not in ('','root') else 'ROOT_OR_DEFAULT'
                print('G5_'+field.upper()+'='+val)
            p=subprocess.run(['systemctl','show',name,'--property=ExecStart','--value'],capture_output=True,text=True,timeout=10)
            line=p.stdout.strip()
            print('G5_COMMAND_REFERENCES_SHADOW_LONGRUN='+str('shadow_longrun' in line).upper())
            for param in ('duration-seconds','interval-seconds','min-checkpoints'):
                m=re.search('--'+param+r'[= ]+([0-9]+)',line)
                print('G5_'+param.upper().replace('-','_')+'='+(m.group(1) if m else 'UNKNOWN'))
            print('G5_RESTART_ALLOWED_BY_SERVICE='+str(os.path.exists('/etc/systemd/system/'+name)).upper())
            print('PROD_REPO_EXISTS='+str(os.path.isdir('/opt/fintual-executor')).upper())
            PY
