name: G8 inspect standard venv and package manager capability
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/fintual-sheet-sync-python-venv-capability-20261016.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe existing Python stdlib and package installers read-only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 80s
          script: |
            set -euo pipefail
            PY=/opt/fintual-httpx-current/.venv/bin/python
            test -x "$PY"
            "$PY" - <<'PY'
            import importlib.util
            import importlib.metadata as meta
            import sys
            for k in ("venv","ensurepip","pip","googleapiclient","google.auth","playwright","websockets"):
                try:
                    mod=importlib.util.find_spec(k)
                    print("G8_RUNTIME_MODULE_"+k.replace(".","_")+"="+("PRESENT" if mod is not None else "MISSING"),flush=True)
                except ModuleNotFoundError:
                    print("G8_RUNTIME_MODULE_"+k.replace(".","_")+"=MISSING",flush=True)
            print("G8_RUNTIME_PYTHON="+sys.version.split()[0],flush=True)
            PY
            for name in uv pip3 curl; do
              echo G8_RUNTIME_BIN_"$name"="$(command -v "$name" || echo UNAVAILABLE)"
            done
            echo G8_SHEET_VENV_CAPABILITIES_READONLY=PASS
