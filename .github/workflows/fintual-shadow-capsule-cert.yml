name: Fintual shadow — ephemeral capsule certificate

on:
  push:
    branches:
      - ops/fintual-http-shadow-g0-20261013

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Create temporary certificate only inside OCI tmpfs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            TARGET=/dev/shm/fintual-shadow-oci-20261013
            sudo install -d -m 0700 -o root -g root "$TARGET"
            if ! sudo test -s "$TARGET/key.pem"; then
              sudo openssl req -x509 -newkey rsa:3072 -sha256 -nodes -days 1                 -keyout "$TARGET/key.pem" -out "$TARGET/cert.pem"                 -subj '/CN=fintual-shadow-oci-20261013' >/dev/null 2>&1
              sudo chmod 0600 "$TARGET/key.pem"
              sudo chmod 0644 "$TARGET/cert.pem"
            fi
            echo 'BEGIN_PUBLIC_SHADOW_CERT'
            sudo cat "$TARGET/cert.pem"
            echo 'END_PUBLIC_SHADOW_CERT'
            echo 'No trading service changed.'
