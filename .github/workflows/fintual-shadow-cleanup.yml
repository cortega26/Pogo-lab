name: Fintual shadow — destroy ephemeral capsule key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only dedicated tmpfs shadow key and staging paths
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service)" = active
            sudo rm -rf -- /dev/shm/fintual-shadow-oci-20261013 /dev/shm/fintual-shadow-oci-run-20261013
            sudo test ! -e /dev/shm/fintual-shadow-oci-20261013/key.pem
            sudo test ! -e /dev/shm/fintual-shadow-oci-run-20261013
            test "$(sudo -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            test -z "$(sudo -u fintual git -C /opt/fintual-executor status --porcelain --untracked-files=no)"
            echo 'GATE CLEANUP SUCCESS: shadow key and sources gone, financial runtime unchanged'
