name: Deploy

on:
  workflow_dispatch:
  # Se dispara automáticamente cuando el workflow CI termina en main — no en
  # push directo, para no desplegar un commit cuyo CI todavía está corriendo
  # o falló. El `if` del job filtra por `conclusion == 'success'`.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serializa despliegues: si dos runs de CI en main terminan cerca uno del
# otro, esto encola el segundo en vez de dejar dos SSH concurrentes mutando
# /opt/pogo-lab (git reset, migraciones, collectstatic, restart) a la vez.
# cancel-in-progress=false porque cancelar un deploy a mitad de una
# migración deja el servidor en peor estado que esperar.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-oci:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1
        env:
          # SHA validado por el run de CI que disparó este deploy. En
          # workflow_dispatch (manual) no hay workflow_run — se usa
          # 'origin/main' para desplegar la punta actual.
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'origin/main' }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DEPLOY_REF
          script: |
            set -euo pipefail
            export PATH="/home/ubuntu/.local/bin:$PATH"
            cd /opt/pogo-lab
            git fetch origin main
            git stash --include-untracked || true
            git checkout main
            # Se resetea al SHA que realmente pasó CI (DEPLOY_REF), no a
            # origin/main a secas: si un segundo push llegó a main mientras
            # este run de CI corría, origin/main ya no sería el commit que
            # este workflow validó.
            git reset --hard "$DEPLOY_REF"
            git stash drop 2>/dev/null || true
            uv sync --frozen --no-dev
            uv run python manage.py check --deploy
            uv run python manage.py migrate --noinput
            uv run python manage.py createcachetable
            uv run python manage.py collectstatic --noinput
            sudo systemctl restart pogo-lab.service
            curl --fail --silent --show-error --retry 5 \
              --retry-connrefused \
              --header "Host: pogo-lab.tooltician.com" \
              --header "X-Forwarded-Proto: https" \
              http://127.0.0.1:8000/healthcheck.json
            echo "Despliegue completado en $(date -Iseconds)"

# Setup inicial en OCI (una sola vez):
# 1. Crear una VM ARM Ampere A1 dentro del límite Always Free vigente
#    (2 OCPU, 12 GB). Una configuración de 4 OCPU / 24 GB excede ese límite
#    y puede facturarse bajo PAYG:
#    https://cloud.oracle.com/compute/instances
# 2. Instalar Python 3.13, uv, PostgreSQL y nginx en la VM.
# 3. Clonar el repo: git clone <repo-url> /opt/pogo-lab
# 4. Crear .env y configurar el servicio systemd `pogo-lab.service`.
# 5. Configurar secretos en GitHub (Settings > Secrets and variables > Actions):
#    - OCI_HOST: IP pública de la VM
#    - OCI_USER: usuario SSH (ubuntu en Oracle Linux)
#    - OCI_SSH_KEY: clave privada SSH (~/.ssh/id_rsa sin passphrase o deploy key)
# 6. Habilitar `pogo-lab.service` y verificar `/healthcheck.json` localmente.
# 7. Configurar DNS (A record) apuntando al dominio.
# 8. Ejecutar `sudo ./bin/install-backup-timer.sh`.
# 9. Opcional: configurar firewall de OCI (puertos 80/443 abiertos).
