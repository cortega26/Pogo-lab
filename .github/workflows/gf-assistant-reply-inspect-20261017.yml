name: GF Assistant reply inspection (read-only sanitized)
on:
  push:
    branches: [ops/gf-mirror-readonly-status-20261017]
    paths: [.github/workflows/gf-assistant-reply-inspect-20261017.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Classify message content and visible chat reply with no interactions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 80s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            test "$(systemctl is-active fintual-gf-tx-bootstrap.service || true)" = inactive
            sudo -n -u fintual env PYTHONPATH=/opt/fintual-gf-mirror/integrations/google-finance \
               PYTHONDONTWRITEBYTECODE=1 /opt/fintual-gf-mirror-venv/bin/python - <<'PY'
            import json,os,re
            from pathlib import Path
            from gf_mirror.cli import _browser
            from gf_mirror.config import load_config
            c={}
            for l in Path("/etc/fintual-executor/gf-mirror.env").read_text().splitlines():
                s=l.strip()
                if s.startswith("#") or "=" not in s: continue
                k,v=s.split("=",1)
                if k.strip().isidentifier(): c[k.strip()]=v.strip().strip("'").strip('"')
            assert not c.get("GF_MIRROR_WRITES") and not c.get("GF_MIRROR_ALLOW_PROTECTED_PORTFOLIO")
            os.environ.update(c)
            config=load_config()
            assert not config.writes_armed
            with _browser(config) as b:
                findings=b.page.evaluate(r"""() => {
                  const full=document.body?.innerText||'';
                  const outgoing='Añade una única transacción nueva a este portafolio';
                  const offset=full.lastIndexOf(outgoing);
                  const tail=(offset>=0?full.slice(offset):full.slice(-2600)).slice(-3500);
                  const ls=tail.toLowerCase();
                  const present=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
                  const matches=p=>(tail.match(p)||[]).length;
                  const inputs=[...document.querySelectorAll('textarea,[contenteditable]')].filter(present);
                  return {
                    portfolioPage:location.pathname.includes('/finance/portfolio/'),
                    outgoingVisible:offset>=0,
                    trailingLength:tail.length,
                    anyQuestion:matches(/¿[^?\n]{8,900}\?/gi),
                    legacyConfirmation:matches(/¿?\s*Confirmas\b[^?\n]{0,1200}\?/gi),
                    inlineConfirmation:matches(/Confirmadd\b[^?\n]{0,1200}\?/gi),
                    structuredConfirmation:matches(/Solicito su confirmaci[oó]n para a[ñn]adir esta transacci[oó]n de venta/gi),
                    proceedConfirmation:matches(/¿Desea proceder con el registro de esta transacci[oó]n\?/gi),
                    yesOption:matches(/(?:^|\n)\s*(?:yes|s[íi])\s*(?:\n|$)/gi),
                    cancelOption:matches(/(?:^|\n)\s*(?:cancel|cancelar)\s*(?:\n|$)/gi),
                    genericInstructions:matches(/para registrar una venta|para registrar la venta|c[oó]mo registrar una venta/gi),
                    insufficientShares:matches(/acciones suficientes|no tienes suficientes acciones|insufficient shares/gi),
                    assistantError:matches(/algo sali[oó] mal|intenta de nuevo|try again|error al procesar|no puedo registrar|lo siento|disculpa/gi),
                    assistantBusy:matches(/pensando|procesando|generando respuesta|cargando|loading/gi),
                    editableInputs:inputs.length,
                    pendingDraft:inputs.some(e=>(e.value||e.innerText||'').includes(outgoing)),
                  };
                }""")
                print('GF_LAST_REPLY_CLASSIFICATION='+json.dumps(findings,sort_keys=True),flush=True)
            print('GF_ASSISTANT_READONLY=PASS',flush=True)
            PY

