name: GF Assistant reply inspection (read-only sanitized)
on:
  push:
    branches: [ops/gf-mirror-readonly-status-20261017]
    paths: [.github/workflows/gf-assistant-reply-inspect-20261017.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Classify message content and visible chat reply with no interactions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 80s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            test "$(systemctl is-active fintual-gf-tx-bootstrap.service || true)" = inactive
            sudo -n -u fintual env PYTHONPATH=/opt/fintual-gf-mirror/integrations/google-finance \
               PYTHONDONTWRITEBYTECODE=1 /opt/fintual-gf-mirror-venv/bin/python - <<'PY'
            import json,os,re
            from pathlib import Path
            from gf_mirror.cli import _browser
            from gf_mirror.config import load_config
            c={}
            for l in Path("/etc/fintual-executor/gf-mirror.env").read_text().splitlines():
                s=l.strip()
                if s.startswith("#") or "=" not in s: continue
                k,v=s.split("=",1)
                if k.strip().isidentifier(): c[k.strip()]=v.strip().strip("'").strip('"')
            assert not c.get("GF_MIRROR_WRITES") and not c.get("GF_MIRROR_ALLOW_PROTECTED_PORTFOLIO")
            os.environ.update(c)
            config=load_config()
            assert not config.writes_armed
            with _browser(config) as b:
                details=b.page.evaluate(r"""() => {
                  const raw=document.body?.innerText || '';
                  const outgoing='Añade una única transacción nueva a este portafolio';
                  const pos=raw.lastIndexOf(outgoing);
                  const following=pos>=0?raw.slice(pos):raw.slice(-2200);
                  const dialogs=[...document.querySelectorAll('[role=log],[aria-live],[role=alert]')].map(e=>({
                    role:e.getAttribute('role')||'',
                    aria:e.getAttribute('aria-live')||'',
                    textLength:(e.innerText||'').length,
                    visible:!!e.getBoundingClientRect().width
                  })).filter(e=>e.visible).slice(-20);
                  const boxes=[...document.querySelectorAll('textarea,[contenteditable]')].map(e=>({
                    element:e.tagName,visible:!!e.getBoundingClientRect().width,
                    valueLength:(e.value||e.innerText||'').length
                  })).slice(-8);
                  return {outgoingPresent:pos>=0, following:following.slice(-2500),dialogs,boxes,
                    textLength:raw.length, scrollY:window.scrollY};
                }""")
                def safe(text):
                    text=re.sub(r'[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}', '[EMAIL]',text)
                    text=re.sub(r'https?://\S+', '[URL]',text)
                    text=re.sub(r'(?i)portafolio\s+["“][^"”]+["”]', 'portafolio "[REDACTED]"',text)
                    text=re.sub(r'(?i)(?:NYSE|NASDAQ|BATS|NYSEARCA):[A-Z0-9.\-]+','[EXCHANGE_TICKER]',text)
                    text=re.sub(r'\b(?:TSLA|NVDA|STX|DELL|AAPL)\b','[TICKER]',text)
                    text=re.sub(r'\d+(?:[.,/:\-]\d+)*','[N]',text)
                    text=re.sub(r'\b[a-fA-F0-9]{16,}\b','[HASH]',text)
                    return text[:2300]
                print('GF_ASSISTANT_REPLY_SCRUBBED='+json.dumps(safe(details.pop('following')),ensure_ascii=False),flush=True)
                print('GF_ASSISTANT_UI_SHAPE='+json.dumps(details,ensure_ascii=False,sort_keys=True),flush=True)
            print('GF_ASSISTANT_READONLY=PASS',flush=True)
            PY

