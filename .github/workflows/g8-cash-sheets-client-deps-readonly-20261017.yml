name: G8 cash Sheets consumer dependency preflight (no mutations)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-cash-sheets-client-deps-readonly-20261017.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production state and independent cash IPC Python imports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 90s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-active fintual-browser.service || true)" = inactive
            test "$(systemctl is-enabled fintual-browser.service)" = disabled
            systemctl show -P ExecStart fintual-executor.service | grep -q -- '--sheet-cash-socket'
            systemctl show -P ExecStart fintual-sheet-sync.service | grep -q -- '--fills-only'
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = /opt/fintual-httpx-releases/81e3fb22788582806c991d4fc2e89b9e54e7219a
            sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
              /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            import importlib.util, sys
            from importlib import metadata
            print("G8_SHEETS_PYTHON="+sys.version.split()[0],flush=True)
            for package in ("httpx","google.auth","googleapiclient","playwright"):
                try:
                    ok=importlib.util.find_spec(package) is not None
                except ModuleNotFoundError:
                    ok=False
                print("G8_SHEETS_PACKAGE_"+package.replace(".","_")+"="+("PRESENT" if ok else "MISSING"),flush=True)
            PY
            sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
              env PYTHONPATH=/opt/fintual-sheet-sync-releases/81e3fb22788582806c991d4fc2e89b9e54e7219a/src \
              /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            try:
                from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            except (ImportError,ModuleNotFoundError) as err:
                print("G8_SHEETS_CASH_IPC_IMPORT=MISSING_DEPENDENCY",flush=True)
            else:
                print("G8_SHEETS_CASH_IPC_IMPORT=PASS",flush=True)
            PY
            echo G8_CASH_DEPENDENCY_PREFLIGHT_READONLY=PASS
