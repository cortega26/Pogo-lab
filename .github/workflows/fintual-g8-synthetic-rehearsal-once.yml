name: Fintual G8 synthetic staged cutover and code-only rollback acceptance
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-synthetic-rehearsal-once.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run toy G8 Git and SQLite release rehearsal at pinned SHA; no production effects
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE_SHA=ee3c493774fc752459917dc4f4552c025ed35252
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(systemctl is-active "$unit")" = active || { echo BLOCKED_SHADOW_OR_PRODUCTION_INACTIVE; exit 21; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            STAGE="$(mktemp -d /tmp/fintual-g8-rehearsal-ci.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              git clone --quiet --depth 1 --single-branch --branch feat/g8-synthetic-cutover-rollback-rehearsal-20261015 \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE_SHA"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra dev --extra shadow \
              --python "$PY" --quiet
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 180s "$STAGE/venv/bin/python" -m pytest -q -x \
                "$STAGE/repo/tests/test_g8_rehearsal.py" \
                "$STAGE/repo/tests/test_g8_stage.py" \
                "$STAGE/repo/tests/test_g8_dryrun.py" \
                "$STAGE/repo/tests/test_g8_observe.py"
            sudo -n "$STAGE/venv/bin/ruff" check \
              "$STAGE/repo/src/fintual_executor/g8_rehearsal.py" \
              "$STAGE/repo/tests/test_g8_rehearsal.py"
            sudo -n "$STAGE/venv/bin/python" -m compileall -q \
              "$STAGE/repo/src/fintual_executor/g8_rehearsal.py"
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" \
              "$STAGE/venv/bin/python" -m fintual_executor.g8_rehearsal
            if sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" \
              "$STAGE/venv/bin/python" -m fintual_executor.g8_rehearsal --fault new_fill; then
              echo BLOCKED_EXPECTED_FOR_SYNTHETIC_NEW_FILL; exit 22
            fi
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(systemctl is-active "$unit")" = active || { echo BLOCKED_SHADOW_OR_PRODUCTION_CHANGED; exit 23; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_SYNTHETIC_STAGE_ROLLBACK_TESTS=PASS
            echo G5_24H_WITNESS_STILL_ACTIVE=TRUE
            echo ORIGINAL_PRODUCTION_UNMODIFIED=TRUE
