name: Fintual G8 separate live HTTPX order acknowledgement service tests
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-live-httpx-optin-tests-20261016.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate separate HTTPX opt-in without enabling it in live Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 160s
          script: |
            set -euo pipefail
            SOURCE=dd3d6e8379752255e2989d9cf5e6da825aeef607
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            UV=/home/fintual/.uv-bootstrap/bin/uv
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 7s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            test ! -e /etc/fintual-executor/httpx-order.env
            WORK="$(mktemp -d /tmp/g8-httpx-optin.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch fix/g8-live-httpx-optin-envfile-20261016 \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$SOURCE"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$WORK/cache" \
              UV_PROJECT_ENVIRONMENT="$WORK/venv" "$UV" sync \
              --directory "$WORK/repo" --frozen --extra dev --extra shadow --python "$PY" --quiet
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$WORK/repo/src" timeout 65s \
              "$WORK/venv/bin/python" -m pytest -q -x \
              "$WORK/repo/tests/test_g8_systemd_reboot.py" \
              "$WORK/repo/tests/test_g6_transient_auth.py"
            sudo -n "$WORK/venv/bin/ruff" check "$WORK/repo/tests/test_g8_systemd_reboot.py"
            sudo -n sed \
              -e 's#EnvironmentFile=/etc/fintual-executor/httpx-order.env#EnvironmentFile=-/etc/fintual-executor/httpx-order.env#' \
              -e 's#/opt/fintual-httpx-current#/opt/fintual-httpx-releases/a21078ec309938db70f3f9e37ac9b3d55a162e0c#g' \
              "$WORK/repo/deploy/oracle/fintual-httpx-order.service.example" > "$WORK/fintual-executor.service"
            sudo -n timeout 25s systemd-analyze verify "$WORK/fintual-executor.service"
            echo G8_HTTPX_OPTIONAL_PARSER_TEST=PASS
            test ! -e /etc/fintual-executor/httpx-order.env
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 7s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_ACK_LIVE_FILE_NOT_INSTALLED_AND_G5_UNCHANGED=TRUE
