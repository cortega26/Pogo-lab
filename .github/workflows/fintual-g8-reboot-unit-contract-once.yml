name: Fintual G8 systemd reboot-safe replacement unit acceptance
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-reboot-unit-contract-once.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test actual existing service replacement file with systemd parser, without changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 155s
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            TESTED_SHA=0fdffe44d5a385d77935822cc893d2e3a03d4fc9
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            RELEASE=/opt/fintual-httpx-releases/03f282a16288c0a0c161415a6334347bb8b353b5
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 7s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-enabled fintual-browser.service)" = enabled
            WORK="$(mktemp -d /tmp/g8-systemd-unit-contract.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch fix/g8-reboot-safe-unit-switch-20261016 \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$TESTED_SHA"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$WORK/cache" \
              UV_PROJECT_ENVIRONMENT="$WORK/venv" "$UV" sync \
              --directory "$WORK/repo" --frozen --extra dev --python "$PY" --quiet
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS PYTHONDONTWRITEBYTECODE=1 \
              timeout 55s "$WORK/venv/bin/python" -m pytest -q -x "$WORK/repo/tests/test_g8_systemd_reboot.py"
            sudo -n "$WORK/venv/bin/ruff" check "$WORK/repo/tests/test_g8_systemd_reboot.py"
            sudo -n test -f "$RELEASE/HTTPX_RUNTIME_READY.json"
            sudo -n sed "s#/opt/fintual-httpx-current#$RELEASE#g" \
              "$WORK/repo/deploy/oracle/fintual-httpx-order.service.example" > "$WORK/fintual-executor.service"
            sudo -n timeout 20s systemd-analyze verify "$WORK/fintual-executor.service"
            echo SYSTEMD_REAL_PARSER_HTTPX_REPLACEMENT=PASS
            test "$(sudo -n readlink /opt/fintual-httpx-current || true)" = ""
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 7s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_AUTONOMOUS_BOOT_REHEARSAL=PASS
            echo ORIGINAL_AND_G5_UNCHANGED=TRUE
