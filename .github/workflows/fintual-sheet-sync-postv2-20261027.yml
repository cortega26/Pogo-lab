name: Fintual Sheet sync post-v2 health audit (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check recent cash-sync events, outbox and displayed worker status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 100s
          capture_stdout: false
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'PY'
            import json,re,sqlite3,subprocess
            from pathlib import Path
            con=sqlite3.connect("file:/var/lib/fintual-executor/state.sqlite3?mode=ro",uri=True,timeout=10)
            try:
                con.execute("PRAGMA query_only=ON")
                rows=con.execute(
                    "SELECT event_type,created_at,payload_json FROM audit_events "
                    "WHERE event_type IN ('SHEET_CASH_EVENT_SYNC_FAILED','SHEET_CASH_CHECKPOINT_MISMATCH',"
                    "'SHEET_SYNC_STATUS_UPDATE_FAILED') ORDER BY event_id DESC LIMIT 10"
                ).fetchall()
                outbox=con.execute("SELECT COUNT(*) FROM sheet_sync_outbox WHERE state='PENDING'").fetchone()[0]
            finally:
                con.close()
            print("SSYNC_PENDING_OUTBOX="+str(outbox),flush=True)
            print("SSYNC_RECENT_ERROR_EVENTS="+str(len(rows)),flush=True)
            for i,(kind,created,payload) in enumerate(rows):
                try:
                    obj=json.loads(payload)
                except ValueError:
                    obj={}
                raw=str(obj.get("error",""))
                klass=raw.split(":",1)[0] if re.fullmatch(r"[A-Za-z_]+(?::.*)?",raw) else "OTHER"
                allowed={"SheetSyncError","GoogleSheetProjectionError","ShadowReadOnlyViolation",
                         "ShadowTransportError","AuthRequired","KeyError","ValueError","TimeoutError",
                         "RuntimeError","OSError"}
                print("SSYNC_EVENT_"+str(i)+"_TYPE="+kind,flush=True)
                print("SSYNC_EVENT_"+str(i)+"_AT="+str(created),flush=True)
                print("SSYNC_EVENT_"+str(i)+"_CLASS="+(klass if klass in allowed else "OTHER"),flush=True)
            PY
            sudo -n /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            import sys
            from pathlib import Path
            sys.path.insert(0,"/opt/fintual-sheet-sync-current/src")
            from fintual_executor.google_sheets import GoogleSheetConfig, GoogleSheetsProjector
            env={}
            for line in Path("/etc/fintual-executor/sheet-sync.env").read_text().splitlines():
                line=line.strip()
                if line and not line.startswith("#") and "=" in line:
                    k,v=line.split("=",1); env[k.strip()]=v.strip().strip('"').strip("'")
            p=GoogleSheetsProjector.from_service_account(GoogleSheetConfig(
                spreadsheet_id=env["FINTUAL_SHEET_SPREADSHEET_ID"],
                credentials_file=Path(env["GOOGLE_APPLICATION_CREDENTIALS"])))
            rows=p.service.spreadsheets().values().get(
                spreadsheetId=env["FINTUAL_SHEET_SPREADSHEET_ID"],range="Sync_Status!B7:B9",
                valueRenderOption="UNFORMATTED_VALUE").execute().get("values",[])
            flat=[str(row[0]) if row else "" for row in rows]
            print("SSYNC_DISPLAY_STATE="+(flat[0] if len(flat)>0 else "MISSING"),flush=True)
            print("SSYNC_DISPLAY_PENDING="+(flat[1] if len(flat)>1 else "MISSING"),flush=True)
            print("SSYNC_DISPLAY_STAMP_SET="+str(len(flat)>2 and bool(flat[2])),flush=True)
            PY
            sudo -n journalctl -u fintual-sheet-sync.service --since "-20 min" --no-pager -o cat 2>/dev/null | grep -E "SHEET_SYNC_WORKER_ERROR|Traceback|SHEET_CASH_EVENT_SYNC_FAILED" | head -5 || true