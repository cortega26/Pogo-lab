name: Fintual G5 read-only first heartbeat verification
on:
  push:
    branches: [ops/fintual-g5-longrun-readonly-20261014]
    paths:
      - .github/workflows/fintual-g5-first-check-20261014.yml
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only sanitized transient-unit snapshot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            UNIT=fintual-g5-shadow-20261014.service
            test "$(systemctl is-active "$UNIT")" = active || { echo 'G5_SERVICE_NOT_ACTIVE'; exit 4; }
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service)" = active
            test "$(systemctl is-active fintual-xvfb.service)" = active
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            /usr/bin/python3 - <<'PY'
            import json, subprocess
            p = subprocess.run(['journalctl','--no-pager','-u','fintual-g5-shadow-20261014.service','-o','cat','--since','15 minutes ago'], text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,check=True)
            records=[]
            for line in p.stdout.splitlines():
                try:
                    entry=json.loads(line)
                except (ValueError,TypeError):
                    continue
                if isinstance(entry,dict) and entry.get('phase') in ('BOOTSTRAP','HTTP_READS','AUTH_REQUIRED','END'):
                    records.append(entry)
            bootstrap=[r for r in records if r.get('phase')=='BOOTSTRAP' and r.get('ok') is True]
            samples=[r for r in records if r.get('phase')=='HTTP_READS' and r.get('ok') is True]
            failures=[r for r in records if r.get('ok') is False]
            print('G5_INITIAL_BOOTSTRAP_OK='+str(bool(bootstrap)))
            print('G5_SUCCESSFUL_CHECKPOINTS='+str(len(samples)))
            print('G5_EARLY_FAILURES='+str(len(failures)))
            if samples:
                print('G5_LAST_ELAPSED_SECONDS='+str(samples[-1].get('elapsed_seconds')))
            if len(bootstrap)!=1 or not samples or failures:
                raise SystemExit('G5_BOOTSTRAP_OR_FIRST_READ_NOT_CONFIRMED')
            PY
            echo 'ORIGINAL_FINANCIAL_EXECUTOR_ACTIVE=TRUE'
            echo 'G5_HEARTBEAT=PASS_READONLY'
