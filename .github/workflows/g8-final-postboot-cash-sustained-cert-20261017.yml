name: G8 final postboot sustained cash sync certification
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-final-postboot-cash-sustained-cert-20261017.yml]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Confirm real VM restart, authenticated owner, no Chrome, full cash reconciliation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 15s
          command_timeout: 490s
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'PY'
            from pathlib import Path
            from datetime import datetime,timezone,timedelta
            import sqlite3
            root=Path('/var/lib/fintual-executor/g8-reboot-cert-20261017')
            previous=(root/'before_boot_id.txt').read_text().strip()
            current=Path('/proc/sys/kernel/random/boot_id').read_text().strip()
            assert previous!=current,'KERNEL_DID_NOT_REBOOT'
            print('G8_FINAL_NEW_KERNEL_BOOT=PASS',flush=True)
            browser=[]
            for p in Path('/proc').iterdir():
                if not p.name.isdigit():continue
                try:
                    exe=(p/'exe').resolve(strict=True).name.lower()
                    cmd=(p/'cmdline').read_bytes().replace(bytes([0]),b' ').decode('utf8','replace')
                except (FileNotFoundError,PermissionError,ProcessLookupError,OSError):
                    continue
                if '/var/lib/fintual-browser/profile' in cmd and exe in (
                        'chrome','chromium','chromium-browser','chrome-headless-shell'):
                    browser.append(p.name)
            assert len(browser)==0,'RESIDENT_PROFILE_CHROME'
            print('G8_FINAL_FINTUAL_RESIDENT_CHROME=0',flush=True)
            db=Path('/var/lib/fintual-executor/state.sqlite3')
            with sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=10) as con:
                con.execute('PRAGMA query_only=ON')
                assert con.execute('PRAGMA integrity_check').fetchone()==('ok',)
                states=('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')
                pending=con.execute('SELECT COUNT(*) FROM order_intents WHERE state IN (?,?,?,?,?)',states).fetchone()[0]
                assert pending==0
            print('G8_FINAL_FINANCIAL_LEDGER=PASS',flush=True)
            PY
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = enabled
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            test "$(systemctl is-enabled fintual-browser.service || :)" = disabled
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = /opt/fintual-httpx-releases/81e3fb22788582806c991d4fc2e89b9e54e7219a
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = /opt/fintual-sheet-sync-releases/b9d82a7668ea1ff67e9623499b0df6f778b50d1b
            echo G8_FINAL_RESTARTED_SYSTEMD_IDENTITIES=PASS
            sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
              env PYTHONPATH=/opt/fintual-sheet-sync-current/src PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            from pathlib import Path
            from datetime import datetime,timedelta,timezone
            from decimal import Decimal
            import time
            from google.oauth2 import service_account
            from googleapiclient.discovery import build
            from fintual_executor.client import get_buy_state,get_wallet_dividends,get_wallet_cash_interests
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            h=IpcReadOnlyBrokerHandle(Path('/var/lib/fintual-executor/cash-ipc/cash.sock'))
            assert h.health()['order_capability'] is False
            broker=Decimal(str(get_buy_state(h)['stocksWallet']['investableAmount']['amount']))
            native_divs=get_wallet_dividends(h)
            native_int=get_wallet_cash_interests(h)
            assert any(str(x.get('id'))=='1163144' and x.get('asset',{}).get('symbol')=='STX' for x in native_divs)
            assert len(native_int)>=17
            print('G8_FINAL_AUTHENTICATED_NATIVE_CASH=PASS',flush=True)
            identifier=None
            for line in Path('/etc/fintual-executor/sheet-sync.env').read_text().splitlines():
                if line.startswith('FINTUAL_SHEET_SPREADSHEET_ID='):
                    identifier=line.split('=',1)[1].strip().strip('"').strip("'")
            assert identifier
            credentials=service_account.Credentials.from_service_account_file(
              '/etc/fintual-executor/google-sheet-sync.json',
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
            api=build('sheets','v4',credentials=credentials,cache_discovery=False)
            def read(r):
                return api.spreadsheets().values().get(spreadsheetId=identifier,range=r,
                    valueRenderOption='UNFORMATTED_VALUE').execute().get('values',[])
            cash=read('Cash_Fintual!A350:K502')
            last=next((row[8] for row in reversed(cash) if len(row)>8 and row[8] not in ('',None)),None)
            assert last is not None,'NO_LATEST_SHEETS_CASH'
            assert abs(broker-Decimal(str(last)))<=Decimal('0.01'),'CASH_BALANCE_DRIFT'
            print('G8_FINAL_BROKER_SHEETS_CASH_PARITY=PASS',flush=True)
            boot_utc=datetime.now(timezone.utc)-timedelta(seconds=float(Path('/proc/uptime').read_text().split()[0]))
            ready=False
            first_stamp=None
            deadline=time.monotonic()+400
            while time.monotonic()<deadline:
                status=read('Sync_Status!B7:B9')
                if len(status)>=3 and all(status):
                    stamp=datetime.fromisoformat(str(status[2][0])).astimezone(timezone.utc)
                    if status[0][0]=='RUNNING' and int(float(status[1][0]))==0 and stamp>boot_utc:
                        if first_stamp is None:
                            first_stamp=stamp
                            print('G8_FINAL_GOOGLE_CASH_RUNNING_POSTBOOT=PASS',flush=True)
                        elif (stamp-first_stamp).total_seconds()>=30:
                            ready=True
                            print('G8_FINAL_GOOGLE_CASH_SUSTAINED_FRESH_UPDATES=PASS',flush=True)
                            break
                time.sleep(15)
            assert ready,'SHEETS_CASH_NOT_HEALTHY_WITHIN_400S'
            PY
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            echo G8_FULL_VM_REBOOT_CERTIFICATION=PASS
