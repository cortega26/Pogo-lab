name: Fintual Oracle graphical recovery — READ ONLY inspection

on:
  push:
    branches: [ops/fintual-pause-preflight-20261014]
    paths:
      - .github/workflows/fintual-pause-preflight.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify VNC remote login recovery prerequisites with no secret material
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            for x in fintual-executor.service fintual-browser.service fintual-xvfb.service; do test "$(systemctl is-active "$x")" = active; done
            sudo -n /usr/bin/python3 - <<'PY'
            import os, subprocess
            line=subprocess.check_output(['ss','-ltnpH'],text=True)
            for port in (5900,5901,6080,6081):
                entries=[row.split() for row in line.splitlines() if len(row.split())>3 and row.split()[3].rsplit(':',1)[-1]==str(port)]
                if not entries:
                    print(f'GUI_PORT_{port}=NOT_LISTENING')
                    continue
                hosts=[x[3].rsplit(':',1)[0].strip('[]') for x in entries]
                kind='LOOPBACK_ONLY' if all(h in ('127.0.0.1','::1') for h in hosts) else 'NON_LOOPBACK_BIND'
                print(f'GUI_PORT_{port}={kind}')
                for row in entries:
                    process=row[-1]
                    kind_proc='X11VNC' if 'x11vnc' in process.lower() else 'OTHER'
                    print(f'GUI_PORT_{port}_PROCESS={kind_proc}')
            PY
            echo '=== RECOVERY SERVICE NAMES (NO CONFIG OR COMMANDLINE OUTPUT) ==='
            systemctl list-units --type=service --all --no-legend | grep -Ei 'vnc|xpra|novnc|websockify' | sed -E 's/[[:space:]]+/ /g' | cut -d' ' -f1,3,4 | head -n 10 || true
            echo '=== SSH TRANSPORT ==='
            systemctl is-active ssh.service || systemctl is-active sshd.service || true
            command -v x11vnc >/dev/null 2>&1 && echo X11VNC_AVAILABLE=YES
            echo '=== CONSERVATIVE POSTFLIGHT ==='
            for x in fintual-executor.service fintual-browser.service; do test "$(systemctl is-active "$x")" = active; done
            echo RECOVERY_READONLY_DONE
