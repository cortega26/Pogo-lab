name: G8 phase2 read-only live release and rollback identity
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-cash-phase2-readonly-deployment-identity-20261017.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect live release, owner service and private socket prerequisites
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 90s
          script: |
            set -euo pipefail
            for svc in fintual-executor.service fintual-browser.service fintual-sheet-sync.service; do
              echo G8_PHASE2_STATE_${svc}="$(systemctl is-active "$svc" || true)"
              echo G8_PHASE2_ENABLE_${svc}="$(systemctl is-enabled "$svc" || true)"
              echo G8_PHASE2_EXEC_${svc}="$(systemctl show -P ExecStart "$svc" | sed -E 's/(EnvironmentFiles?=)[^ ]+/\1REDACTED/g')"
            done
            for folder in /opt/fintual-httpx-current /opt/fintual-sheet-sync-current /opt/fintual-httpx-releases /opt/fintual-sheet-sync-releases /var/lib/fintual-executor /var/lib/fintual-executor/cash-ipc; do
              echo G8_PHASE2_DIR_${folder}="$(sudo -n stat -c '%A %U:%G %F' "$folder" 2>&1 || echo ABSENT)"
            done
            echo G8_PHASE2_HTTPX_RESOLVED="$(sudo -n readlink -f /opt/fintual-httpx-current)"
            echo G8_PHASE2_SHEETS_RESOLVED="$(sudo -n readlink -f /opt/fintual-sheet-sync-current)"
            echo G8_PHASE2_ORDER_UNIT_WORKDIR="$(systemctl show -P WorkingDirectory fintual-executor.service)"
            echo G8_PHASE2_ORDER_UNIT_PYTHON="$(systemctl show -P Environment fintual-executor.service | grep -oE 'PYTHONPATH=[^ ]+' || true)"
            echo G8_PHASE2_SHEETS_UNIT_WORKDIR="$(systemctl show -P WorkingDirectory fintual-sheet-sync.service)"
            echo G8_PHASE2_SOURCE_BACKUP_EXISTS="$(sudo -n test -d /opt/fintual-httpx-releases/e922e0d153f32c8319bc4ec8b9165f39c7dfeac8 && echo YES || echo NO)"
            echo G8_PHASE2_IDENTITY_PREFLIGHT=PASS
