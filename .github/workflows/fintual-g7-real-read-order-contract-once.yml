name: Fintual G7 actual authenticated BUY SELL preflight no mutations
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g7-real-read-order-contract-once.yml]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query actual Fintual preflight and existing order statuses through unarmed HTTPX
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 140s
          script: |
            set -euo pipefail
            SHA=dfc0a9827a17a66ca4c8e8b1fecc658ce603676d
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            RELEASE=/opt/fintual-httpx-releases/$SHA
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            sudo -n test -f "$RELEASE/HTTPX_RUNTIME_READY.json"
            sudo -n -u fintual nice -n 15 ionice -c 3 timeout 105s env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$RELEASE/src" PYTHONDONTWRITEBYTECODE=1 "$RELEASE/.venv/bin/python" -u - <<'PY'
            import json
            import sqlite3
            from pathlib import Path
            from fintual_executor.order_session import HttpOrderSessionOwner
            from fintual_executor.client import (
                ExecutionDisabled, get_asset_preflight, get_buy_state,
                get_sell_state, get_pending, get_market_info,
            )
            from fintual_executor.execution import get_market_buy_status,get_market_sell_status
            from fintual_executor.http_broker import ORDER_DOCUMENTS
            config=json.loads(Path("/etc/fintual-executor/config.json").read_text())
            symbols=config["symbols"]
            assert symbols and len(symbols)==len(set(symbols))
            con=sqlite3.connect(
                Path("/var/lib/fintual-executor/state.sqlite3").as_uri()+"?mode=ro",
                uri=True, timeout=6,
            )
            try:
                con.execute("PRAGMA query_only=ON")
                fill_ids={
                    side:[row[0] for row in con.execute(
                        "SELECT fintual_operation_id FROM fills WHERE side = ? ORDER BY fulfilled_at DESC LIMIT 1",
                        (side,),
                    )]
                    for side in ("BUY","SELL")
                }
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                unsettled=con.execute(
                    "SELECT COUNT(*) FROM order_intents WHERE state IN ('SUBMITTING','UNKNOWN')"
                ).fetchone()[0]
                print("REAL_LEDGER_INTEGRITY=PASS",flush=True)
                print("REAL_LEDGER_UNRESOLVED_SUBMISSIONS="+str(unsettled),flush=True)
            finally:
                con.close()
            print("OWNER_CDPCOOKIE_BOOTSTRAP=START",flush=True)
            with HttpOrderSessionOwner(
                requested_execution=False,config_execution_enabled=False,
            ) as owner:
                owner.bootstrap_once()
                print("OWNER_CDPCOOKIE_BOOTSTRAP=PASS",flush=True)
                handle=owner.borrow(armed=False)
                assert handle.execution_enabled is False
                market=get_market_info(handle)
                assert isinstance(market,dict) and isinstance(market.get("isMarketOpen"),bool)
                print("HTTPX_REAL_MARKET_INFO=PASS",flush=True)
                buy=get_buy_state(handle)
                assert isinstance(buy.get("stocksWallet"),dict)
                assert isinstance(buy.get("stocksAssetsMarketOperationsRestrictions"),dict)
                print("HTTPX_REAL_BUY_PREFLIGHT=PASS",flush=True)
                pending=get_pending(handle)
                assert isinstance(pending.get("stocksPendingAssetMarketBuys"),list)
                assert isinstance(pending.get("stocksPendingAssetMarketSells"),list)
                print("HTTPX_REAL_PENDING_READ=PASS",flush=True)
                for symbol in symbols:
                    conditions=get_sell_state(handle,symbol)
                    assert "stocksPositionOperationsConditions" in conditions
                    preflight=get_asset_preflight(handle,symbol)
                    assert isinstance(preflight.get("stocksAsset"),dict)
                    assert isinstance(preflight.get("tailormadeConditionsMet"),dict)
                print("HTTPX_REAL_SELL_AND_ASSET_PREFLIGHTS=PASS",flush=True)
                checked={}
                for side,ids in fill_ids.items():
                    checked[side]=0
                    if not ids: continue
                    payload=(
                        get_market_buy_status(handle,str(ids[0]))
                        if side=="BUY" else get_market_sell_status(handle,str(ids[0]))
                    )
                    assert isinstance(payload,dict) and str(payload.get("id"))==str(ids[0])
                    assert isinstance(payload.get("assetOrder"),dict)
                    checked[side]=1
                print("HTTPX_REAL_EXISTING_BUY_STATUS_READS="+str(checked["BUY"]),flush=True)
                print("HTTPX_REAL_EXISTING_SELL_STATUS_READS="+str(checked["SELL"]),flush=True)
                for operation,document in ORDER_DOCUMENTS.items():
                    try:
                        handle.gql(operation,document,{})
                    except ExecutionDisabled:
                        pass
                    else:
                        raise AssertionError("Real account HTTPX mutation must be blocked")
                print("HTTPX_REAL_BUY_SELL_SUBMISSION_GATE_BLOCKED=TRUE",flush=True)
                assert owner._client is not None
                assert owner._client.execution_enabled is False
            print("HTTPX_REAL_OWNER_CLOSED=TRUE",flush=True)
            print("HTTPX_PRE_FLIGHT_SYMBOLS_COUNT="+str(len(symbols)),flush=True)
            PY
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo REAL_G7_READONLY_PREFLIGHT_NO_ORDERS=PASS
            echo G5_PRODUCTION_UNCHANGED=TRUE
