name: Fintual Oracle SSH recovered unit and resource read-only check
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths:
      - .github/workflows/fintual-ssh-banner-recheck-20261015.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Bounded SSH read-only original and G5 checks after banner recovery
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 60s
          script: |
            set -eu
            echo SSH_REMOTE_EXECUTION=PASS
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              printf 'UNIT_%s=' "$unit"
              timeout 8s systemctl is-active "$unit" || true
            done
            printf 'ORIGINAL_SHA='
            timeout 8s sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD || true
            free -m | awk 'NR==2 {print "MEMORY_AVAILABLE_MIB="$7}'
            free -m | awk 'NR==3 {print "SWAP_USED_MIB="$3}'
            cat /proc/pressure/cpu | head -1
            cat /proc/pressure/memory | head -1
            echo READ_ONLY_HEALTH_COMPLETE=TRUE
