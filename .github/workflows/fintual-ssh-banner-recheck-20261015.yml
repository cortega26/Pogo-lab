name: Oracle post-incident read-only SSH and resource RCA
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-ssh-banner-recheck-20261015.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sanitize SSH journal/kernel pressure without service changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 60s
          script: |
            set -euo pipefail
            echo SSH_ROOT_CAUSE_REVIEW_READONLY=TRUE
            sudo -n timeout 25s /usr/bin/python3 - <<'PY'
            import collections,subprocess,datetime
            def source(*args):
                p=subprocess.run(args,capture_output=True,text=True,timeout=10)
                return p.stdout if p.returncode==0 else ""
            ssh=source("journalctl","-u","ssh.service","-u","sshd.service","--since=2026-10-15 16:30:00 UTC","--no-pager","-o","cat").splitlines()
            counts=collections.Counter()
            for line in ssh:
                low=line.lower()
                if "maxstartups" in low or "drop connection" in low or "throttling" in low:
                    counts["SSHD_CONNECTION_THROTTLING"]+=1
                elif "oom" in low or "out of memory" in low:
                    counts["SSHD_OUT_OF_MEMORY"]+=1
                elif "timeout" in low or "banner" in low:
                    counts["SSHD_TIMEOUT"]+=1
                elif "start" in low or "stop" in low or "restart" in low:
                    counts["SSHD_SERVICE_TRANSITION"]+=1
            print("SSH_JOURNAL_ENTRIES="+str(len(ssh)))
            for k in ("SSHD_CONNECTION_THROTTLING","SSHD_OUT_OF_MEMORY","SSHD_TIMEOUT","SSHD_SERVICE_TRANSITION"):
                print(k+"="+str(counts[k]))
            kernel=source("journalctl","-k","--since=2026-10-15 16:30:00 UTC","--no-pager","-o","cat").splitlines()
            notes=collections.Counter()
            for line in kernel:
                l=line.lower()
                if "out of memory" in l or "killed process" in l or "oom-kill" in l:
                    notes["KERNEL_OOM_EVENT"]+=1
                if "blocked for more than" in l or "hung task" in l:
                    notes["KERNEL_HUNG_TASK"]+=1
            print("KERNEL_OOM_EVENTS="+str(notes["KERNEL_OOM_EVENT"]))
            print("KERNEL_HUNG_TASK_EVENTS="+str(notes["KERNEL_HUNG_TASK"]))
            cmd=source("systemctl","show","ssh.service","--property=ActiveState,SubState,ActiveEnterTimestamp,MainPID,NRestarts")
            for line in cmd.splitlines():
                if line.startswith(("ActiveState=","SubState=","ActiveEnterTimestamp=","NRestarts=")):
                    print("SSH_SERVICE_"+line)
            print("PROOF_ONLY_NOT_CAUSALITY=TRUE")
            PY
            uptime
            free -m | awk 'NR==2 {print "MEM_AVAILABLE_MIB="$7} NR==3 {print "SWAP_USED_MIB="$3}'
            echo RESOURCE_SNAPSHOT_READONLY=TRUE
