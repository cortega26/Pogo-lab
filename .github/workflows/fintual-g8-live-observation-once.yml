name: Fintual G8 actual read-only observation and temp artifact rehearsal
on:
  push:
    branches: [ci/fintual-g8-main-check-20261015]
    paths: [.github/workflows/fintual-g8-live-observation-once.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Sanitized real Oracle observation and SHA archive rehearsal, no production deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            REVIEWED=610928f09986db2bd905d7db16c30e15a9e5aed4
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$unit")" = active
            done
            STAGE="$(mktemp -d /tmp/fintual-g8-observation.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY"               git clone --quiet --depth 1 --single-branch --branch main               git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$REVIEWED"
            sudo -n chgrp -R fintual "$STAGE"
            sudo -n chmod 0750 "$STAGE"
            sudo -n chmod -R g+rX "$STAGE/repo"
            set +e
            OBS="$(sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS               PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1               /opt/fintual-executor/.venv/bin/python -m fintual_executor.g8_observe               --checkout /opt/fintual-executor               --ledger /var/lib/fintual-executor/state.sqlite3               --config /etc/fintual-executor/config.json               --market-env /etc/fintual-executor/market-data.env               --broker-pending-read-only)"
            STATUS=$?
            set -e
            test "$STATUS" -eq 3
            sudo -n env OBS_JSON="$OBS" /usr/bin/python3 - <<'PY'
            import json,os
            s=json.loads(os.environ["OBS_JSON"])
            if s.get("g8_status") != "INCOMPLETE_EVIDENCE_NO_GO":
                raise SystemExit("OBSERVATION_NOT_NO_GO")
            if s.get("live_mutation_authorized") is not False:
                raise SystemExit("UNSAFE_FINANCIAL_FLAG")
            a=s["oracle"]
            print("ORIGINAL_SERVICES_OK=" + str(all(a["services"].values())).upper())
            print("LEDGER_READ_INTEGRITY_OK=" + str(a["ledger"]["integrity_ok"]).upper())
            print("CONFIG_HASHES_READ_OK=" + str(a["configuration"]["private"]).upper())
            print("BROKER_READ_AUTHENTICATED=" + str(s["broker"]["authenticated"]).upper())
            print("BROKER_FULL_HISTORY_ATTESTED=" + str(s["broker"]["history_complete"]).upper())
            print("G8_RELEASE_STATUS=NO_GO_INCOMPLETE_EVIDENCE")
            PY
            sudo -n install -d -m 0700 "$STAGE/immutable"
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS               PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1               "$PY" -m fintual_executor.g8_stage               --checkout "$STAGE/repo"               --stage-directory "$STAGE/immutable"               --expected-sha "$REVIEWED"
            sudo -n /usr/bin/python3 - "$STAGE/immutable" "$REVIEWED" <<'PY'
            import hashlib,json,os,sys
            from pathlib import Path
            d,sha=Path(sys.argv[1]),sys.argv[2]
            m=json.loads((d/f"{sha}.manifest.json").read_text())
            checksum=hashlib.sha256((d/f"{sha}.tar").read_bytes()).hexdigest()
            assert m["archive_sha256"] == checksum
            assert m["git_sha"] == sha
            assert m["production_modified"] is False
            assert m["real_orders_enabled"] is False
            print("IMMUTABLE_STAGE_REHEARSAL=PASS")
            PY
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$unit")" = active
            done
            echo 'ORIGINAL_FINANCIAL_EXECUTOR_UNTOUCHED=TRUE'
            echo 'G8_PRODUCTION_CUTOVER=NOT_PERFORMED'
