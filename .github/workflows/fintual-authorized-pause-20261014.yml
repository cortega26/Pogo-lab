name: Fintual explicit owner-authorized executor pause — guarded

on:
  push:
    branches: [ops/fintual-authorized-executor-pause-20261014]
    paths:
      - .github/workflows/fintual-authorized-pause-20261014.yml

permissions:
  contents: read

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Revalidate zero pending and open intents, backup ledger, stop executor only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 9m
          script: |
            set -euo pipefail
            echo 'OWNER_AUTHORIZATION: TEMPORARY EXECUTOR STOP, EVEN WHILE MARKET OPEN'
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            TARGET=abf4db01082c77feef364a8925852a2633afbad2
            PRODUCT=/opt/fintual-executor
            LEDGER=/var/lib/fintual-executor/state.sqlite3
            BROWSER=fintual-browser.service
            EXECUTOR=fintual-executor.service
            XVFB=fintual-xvfb.service
            for unit in "$EXECUTOR" "$BROWSER" "$XVFB"; do
              test "$(systemctl is-active "$unit")" = active || { echo "STOP: SERVICE_PREFLIGHT_FAILED"; exit 4; }
            done
            test "$(sudo -n -u fintual git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET" || { echo 'STOP: SOURCE_SHA_CHANGED'; exit 4; }
            test -z "$(sudo -n -u fintual git -C "$PRODUCT" status --porcelain --untracked-files=no)" || { echo 'STOP: PRODUCTION_WORKTREE_DIRTY'; exit 4; }
            echo 'G0: SERVICES, SHA, WORKTREE PASS'
            CONFIG_BEFORE="$(sudo -n sha256sum /etc/fintual-executor/config.json /etc/fintual-executor/market-data.env | sha256sum | cut -d' ' -f1)"
            echo 'G1: LIVE BROKER PRE-STOP READ ONLY'
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH=/opt/fintual-executor/src PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-executor/.venv/bin/python - <<'PY'
            from fintual_executor.client import FintualClient, get_pending, get_market_info
            client = None
            try:
                client = FintualClient(execution_enabled=False).connect()
                pending = get_pending(client)
                buys = pending.get("stocksPendingAssetMarketBuys")
                sells = pending.get("stocksPendingAssetMarketSells")
                if not isinstance(buys, list) or not isinstance(sells, list):
                    raise RuntimeError("Missing broker pending-order structure")
                print("BROKER_PENDING_BUYS=" + str(len(buys)))
                print("BROKER_PENDING_SELLS=" + str(len(sells)))
                print("MARKET_OPEN=" + str(bool(get_market_info(client)["isMarketOpen"])))
                if buys or sells:
                    raise RuntimeError("Pending broker order; aborting pause")
                print("G1: BROKER_PENDING_ZERO_PASS")
            except Exception as exc:
                print("STOP: BROKER_GATE_" + type(exc).__name__)
                raise SystemExit(7)
            finally:
                if client is not None:
                    client.close()
            PY
            echo 'G2: SQLITE READ ONLY GATE AND CONSISTENT PRIVATE BACKUP'
            sudo -n install -d -o fintual -g fintual -m 0700 /var/lib/fintual-executor/pause-backups
            sudo -n -u fintual /usr/bin/python3 - <<'PY'
            import os
            import sqlite3
            import pathlib
            import time
            src = pathlib.Path("/var/lib/fintual-executor/state.sqlite3")
            dest = pathlib.Path("/var/lib/fintual-executor/pause-backups") / ("before-manual-auth-" + str(int(time.time())) + ".sqlite3")
            con = None
            target = None
            try:
                if not src.is_file():
                    raise RuntimeError("Missing canonical ledger")
                disk = os.statvfs(str(src.parent))
                free = disk.f_bavail * disk.f_frsize
                if free < src.stat().st_size * 3 + 100_000_000:
                    raise RuntimeError("Insufficient free disk for backup")
                con = sqlite3.connect("file:/var/lib/fintual-executor/state.sqlite3?mode=ro", uri=True, timeout=15)
                con.execute("PRAGMA query_only=ON")
                states=("SIGNALLED", "SUBMITTING", "ACKNOWLEDGED", "PARTIALLY_FILLED", "UNKNOWN")
                placeholders=",".join("?" for _ in states)
                count=con.execute(
                    f"SELECT count(*) FROM order_intents WHERE state IN ({placeholders})", states
                ).fetchone()[0]
                print("LOCAL_OPEN_INTENTS=" + str(count))
                if count != 0:
                    raise RuntimeError("Open or ambiguous local intent")
                if con.execute("PRAGMA integrity_check").fetchone()[0] != "ok":
                    raise RuntimeError("Live ledger integrity failure")
                print("LEDGER_INTEGRITY_OK=TRUE")
                fd = os.open(dest, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                os.close(fd)
                target = sqlite3.connect(str(dest))
                con.backup(target)
                target.close()
                target = None
                check = sqlite3.connect("file:" + str(dest) + "?mode=ro", uri=True)
                backup_ok = check.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
                check.close()
                if not backup_ok:
                    raise RuntimeError("Backup integrity failure")
                os.chmod(dest, 0o600)
                print("CONSISTENT_BACKUP=PASS")
                print("G2: LEDGER ZERO OPEN + BACKUP PASS")
            except Exception as exc:
                print("STOP: LEDGER_GATE_" + type(exc).__name__)
                if target is not None:
                    target.close()
                try:
                    dest.unlink(missing_ok=True)
                except OSError:
                    pass
                raise SystemExit(8)
            finally:
                if con is not None:
                    con.close()
            PY
            echo 'G3: RECHECK ACTIVE SERVICES AND STOP ONLY EXECUTOR'
            for unit in "$EXECUTOR" "$BROWSER" "$XVFB"; do
              test "$(systemctl is-active "$unit")" = active || { echo "STOP: PRE_STOP_SERVICE_DRIFT"; exit 9; }
            done
            test "$(sudo -n -u fintual git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
            sudo -n systemctl stop "$EXECUTOR"
            if test "$(systemctl is-active "$EXECUTOR")" != inactive; then
              echo 'STOP_STATE_UNEXPECTED: MANUAL_REVIEW_REQUIRED'
              exit 10
            fi
            echo 'EXECUTOR_PAUSED=TRUE'
            echo 'G4: POST-STOP HEALTH; NEVER REARM AUTOMATICALLY'
            test "$(systemctl is-active "$BROWSER")" = active || { echo "STOP: BROWSER_UNHEALTHY"; exit 11; }
            test "$(systemctl is-active "$XVFB")" = active || { echo "STOP: XVFB_UNHEALTHY"; exit 11; }
            test "$(sudo -n -u fintual git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
            CONFIG_AFTER="$(sudo -n sha256sum /etc/fintual-executor/config.json /etc/fintual-executor/market-data.env | sha256sum | cut -d' ' -f1)"
            test "$CONFIG_BEFORE" = "$CONFIG_AFTER" || { echo "STOP: PRODUCTION_CONFIG_DRIFT"; exit 12; }
            sudo -n -u fintual /usr/bin/python3 - <<'PY'
            import sqlite3
            try:
                con=sqlite3.connect("file:/var/lib/fintual-executor/state.sqlite3?mode=ro",uri=True,timeout=15)
                con.execute("PRAGMA query_only=ON")
                n=con.execute("SELECT count(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')").fetchone()[0]
                print('POSTSTOP_OPEN_INTENTS='+str(n))
                print('POSTSTOP_LEDGER_INTEGRITY='+str(con.execute("PRAGMA integrity_check").fetchone()[0]=='ok'))
                con.close()
                if n: raise SystemExit(13)
            except Exception as exc:
                print('POSTSTOP_LEDGER_CHECK_ERROR='+type(exc).__name__)
                raise SystemExit(13)
            PY
            echo 'BROWSER_REMAINS_ACTIVE=TRUE'
            echo 'XVFB_REMAINS_ACTIVE=TRUE'
            echo 'PRODUCTION_CONFIG_UNCHANGED=TRUE'
            echo 'RESULT=PAUSED_WITH_BROWSER_PRESERVED; NO_AUTOMATIC_RESUME'
