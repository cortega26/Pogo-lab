name: Fintual G5 assigned issue notification self-test (one shot)
on:
  push:
    branches: [ops/fintual-g5-notification-selftest-20261014]
    paths: [.github/workflows/fintual-g5-notification-selftest.yml]
permissions:
  contents: read
  issues: write
jobs:
  notification-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test GitHub Actions issue creation and assignment; zero Oracle access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GH_REPO/issues" \
            -f "title=[TEST] Fintual G5 alertas — comprobar entrega" \
            -f "body=AUTOPRUEBA del canal GitHub Actions de avisos de G5. NO es un fallo real. No se ha accedido a Oracle, servicios ni cuentas financieras. La incidencia podrá cerrarse tras comprobar la publicación." \
            -f "assignees[]=cortega26" \
            --jq '"ISSUE_CREATED=" + .html_url + " ASSIGNED=" + ([.assignees[].login] | join(","))'
