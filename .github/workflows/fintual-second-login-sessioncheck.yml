name: Fintual post-second-login Oracle read-only authentication check
on:
  push:
    branches: [ops/fintual-second-login-sessioncheck-20261014]
    paths:
      - .github/workflows/fintual-second-login-sessioncheck.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify paused runner and existing Chrome authentication, no secrets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            echo 'POST_SECOND_LOGIN_SNAPSHOT'
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            test "$(systemctl is-active fintual-executor.service)" = inactive || { echo EXECUTOR_NOT_PAUSED; exit 4; }
            echo 'EXECUTOR_PAUSED=TRUE'
            test "$(systemctl is-active fintual-browser.service)" = active || { echo BROWSER_NOT_ACTIVE; exit 4; }
            test "$(systemctl is-active fintual-xvfb.service)" = active || { echo XVFB_NOT_ACTIVE; exit 4; }
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            echo 'ORACLE_BROWSER_STILL_ACTIVE=TRUE'
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/opt/fintual-executor/src \
              /opt/fintual-executor/.venv/bin/python - <<'PY'
            from fintual_executor.client import FintualClient, get_market_info, get_pending
            browser = FintualClient(execution_enabled=False)
            try:
                browser.connect()
                market = get_market_info(browser)
                pending = get_pending(browser)
                buys = pending.get('stocksPendingAssetMarketBuys')
                sells = pending.get('stocksPendingAssetMarketSells')
                if not isinstance(market.get('isMarketOpen'), bool):
                    raise ValueError("broker market response invalid")
                if not isinstance(buys, list) or not isinstance(sells, list):
                    raise ValueError("broker pending response invalid")
                print('ORACLE_AUTH_READ=PASS')
                print('BROKER_PENDING_BUYS='+str(len(buys)))
                print('BROKER_PENDING_SELLS='+str(len(sells)))
            except Exception as error:
                print('ORACLE_AUTH_READ=FAIL:'+type(error).__name__)
                raise SystemExit(5)
            finally:
                browser.close()
            PY
            test "$(systemctl is-active fintual-executor.service)" = inactive
            test "$(systemctl is-active fintual-browser.service)" = active
            echo 'POSTFLIGHT=PRODUCTION_PAUSED_UNCHANGED'
