name: Fintual HTTPX auth continuity — fixed live evidence validator

on:
  push:
    branches: [ops/fintual-auth-live-two-checkpoints-20261014]
    paths:
      - .github/workflows/fintual-auth-live-two-checkpoints.yml

permissions:
  contents: read

concurrency:
  group: fintual-auth-live-two-checkpoints
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Bounded read-only detached HTTPX lease probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 9m
          script: |
            set -euo pipefail
            STAGE=/opt/fintual-auth-live-probe-${{ github.run_id }}
            KEY=/var/lib/fintual-ci-source-readonly
            PROD=/opt/fintual-executor
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            SHA=d989348347a9b77ffbca979847eda1de2fc061bb
            cleanup() { sudo rm -rf -- "$STAGE" || true; }
            trap cleanup EXIT
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service)" = active
            test "$(sudo -n -u fintual git -C "$PROD" rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            test -z "$(sudo -n -u fintual git -C "$PROD" status --porcelain --untracked-files=no)"
            test "$(sudo "$PY" -c 'import sys; print(".".join(map(str,sys.version_info[:3])))')" = 3.14.8
            echo 'GATE 0: production intact, source and Python preflight PASS'
            sudo install -d -m 0755 -o root -g root "$STAGE"
            sudo install -d -m 0700 -o fintual -g fintual "$STAGE/work"
            if ! sudo env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KEY/known_hosts -i $KEY/github_ed25519" \
              git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo" \
              2>&1 | sudo tee "$STAGE/clone.log" >/dev/null; then
              echo 'SOURCE_CLONE: FAIL'
              exit 11
            fi
            test "$(sudo git -C "$STAGE/repo" rev-parse HEAD)" = "$SHA"
            echo 'GATE 1: exact canonical read-only code pinned'
            sudo -u fintual env HOME=/home/fintual UV_NO_CONFIG=1 \
              "$UV" pip install --python "$PY" --target "$STAGE/work/vendor" httpx==0.28.1 --quiet \
              >/dev/null 2>&1
            sudo chown -R fintual:fintual "$STAGE/work"
            sudo -u fintual "$PY" - "$STAGE/work/symbols.json" <<'PY'
            import json, os, pathlib, sys
            config = json.loads(pathlib.Path("/etc/fintual-executor/config.json").read_text())
            symbols = config.get("symbols")
            assert isinstance(symbols, list) and 1 <= len(symbols) <= 20
            assert all(isinstance(s, str) and s.isascii() and s.isalnum() for s in symbols)
            fd = os.open(sys.argv[1], os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
            with os.fdopen(fd, "w") as output:
                json.dump({"symbols": symbols}, output)
            print("SANITIZED_SYMBOLS_CONFIG: PASS count=" + str(len(symbols)))
            PY
            echo 'GATE 2: isolated dependency, no broker ledger or credentials in files'
            if ! sudo systemd-run --collect --wait --pipe --quiet \
              -p User=fintual -p Group=fintual \
              -p MemoryMax=384M -p CPUQuota=50% -p TasksMax=64 \
              -p NoNewPrivileges=yes -p ProtectSystem=strict -p ProtectHome=yes \
              -p PrivateTmp=yes \
              -p "InaccessiblePaths=/var/lib/fintual-executor /etc/fintual-executor/market-data.env" \
              -p "WorkingDirectory=$STAGE/repo" \
              -p "Environment=PYTHONPATH=$STAGE/work/vendor:$STAGE/repo/src" \
              -p "Environment=PYTHONDONTWRITEBYTECODE=1" \
              -p "Environment=FINTUAL_REAL_EXECUTION=OFF" \
              -p "Environment=FINTUAL_HTTP_MUTATIONS=OFF" \
              -p "ReadWritePaths=$STAGE/work" \
              /bin/bash -c '
                "$1" -m fintual_executor.shadow_longrun \
                  --config "$2" --interval-seconds 300 \
                  --duration-seconds 300 --min-checkpoints 2 \
                  > "$3" 2>&1
              ' _ "$PY" "$STAGE/work/symbols.json" "$STAGE/work/status-only.jsonl"; then
              echo 'AUTH_CONTINUITY: FAIL (exit nonzero; details kept private)'
              exit 12
            fi
            sudo -u fintual "$PY" - "$STAGE/work/status-only.jsonl" <<'PY'
            import json, pathlib, sys
            rows = []
            auxiliary_lines = 0
            for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
                try:
                    decoded = json.loads(line)
                except ValueError:
                    auxiliary_lines += 1
                    continue
                if isinstance(decoded, dict) and decoded.get("phase") in {
                    "BOOTSTRAP", "HTTP_READS", "AUTH_REQUIRED", "END"
                }:
                    rows.append(decoded)
                else:
                    auxiliary_lines += 1
            assert rows, "No authenticated HTTPX status checkpoints found"
            assert rows[0]["phase"] == "BOOTSTRAP" and rows[0]["ok"] is True
            print("EVIDENCE_PARSER: sanitized_auxiliary_line_count=" + str(auxiliary_lines))
            assert rows[0]["cdp"] == "DISCONNECTED" and rows[0]["cookies_saved"] is False
            assert all(x.get("ok") is True for x in rows)
            checks = [x for x in rows if x["phase"] == "HTTP_READS"]
            final = rows[-1]
            assert final["phase"] == "END" and final["ok"] is True
            assert len(checks) >= 2 and final["checkpoints"] == len(checks)
            assert final["elapsed_seconds"] >= 300
            assert all(set(x) <= {"phase", "ok", "cdp", "cookies_saved", "checkpoint",
                                "elapsed_seconds", "state", "checkpoints"} for x in rows)
            print("AUTH_CONTINUITY: PASS_REAL_OBSERVATION checkpoints=" + str(len(checks)))
            print("AUTH_CONTINUITY: ELAPSED_SECONDS=" + str(final["elapsed_seconds"]))
            print("HTTPX_LEASE: DETACHED_CDP; NO_ORDER_CAPABILITY")
            PY
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service)" = active
            test "$(sudo -n -u fintual git -C "$PROD" rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            test -z "$(sudo -n -u fintual git -C "$PROD" status --porcelain --untracked-files=no)"
            echo 'POSTFLIGHT: production intact; disposable source, venv, config and status removed on EXIT'
