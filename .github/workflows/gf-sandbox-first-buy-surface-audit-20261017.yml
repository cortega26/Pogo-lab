name: GF empty sandbox first-buy UI surface audit (no submit)
on:
  push:
    branches: [ops/gf-mirror-readonly-status-20261017]
    paths: [.github/workflows/gf-sandbox-first-buy-surface-audit-20261017.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect add-investments surface without entering or submitting trades
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 360s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            test "$(systemctl is-active fintual-gf-tx.timer || true)" = inactive
            UUID="$(sudo -n cat /var/lib/fintual-gf-mirror/recovery-backups/parallel-preflight-20261017T183832Z/new-empty-sandbox-uuid.private)"
            sudo -n -u fintual env GF_SANDBOX_UUID="$UUID" \
              PYTHONPATH=/opt/fintual-gf-mirror/integrations/google-finance PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-gf-mirror-venv/bin/python - <<'PY'
            import json,os
            from pathlib import Path
            from urllib.parse import urlparse
            from gf_mirror.cli import _browser
            from gf_mirror.config import load_config
            env={}
            for l in Path("/etc/fintual-executor/gf-mirror.env").read_text().splitlines():
                if "=" in l and not l.lstrip().startswith("#"):
                    k,v=l.split("=",1)
                    if k.strip().isidentifier():env[k.strip()]=v.strip().strip("'").strip('"')
            assert not env.get("GF_MIRROR_WRITES")
            os.environ.update(env)
            cfg=load_config()
            assert not cfg.writes_armed
            new=os.environ["GF_SANDBOX_UUID"]
            old="86a77e49-9ac1-432e-8d3b-645b8cda19a2"
            protected="d6dca42c-4cfb-4ecd-b1cd-c0f585ca609f"
            assert new=="d24a1f7a-ad03-4bb4-b739-4da1d4561d61" and new not in (old,protected)
            with _browser(cfg) as browser:
                page=browser.page
                page.set_default_timeout(32000)
                try:
                    # Wait for a fully rendered portfolio route, not merely the
                    # first HTTP commit: Google Finance hydrates the UI asynchronously.
                    page.goto("https://www.google.com/finance/",wait_until="commit",timeout=65000)
                    sandbox=page.get_by_role("button",name="Fintual Historical Replay Sandbox 2026",exact=True)
                    sandbox.wait_for(state="visible",timeout=65000)
                    sandbox.click(no_wait_after=True,timeout=40000)
                    assert urlparse(page.url).path=="/finance/portfolio/"+new
                    page.wait_for_function(
                        "() => /Aún no hay nada en esta cartera|Nothing in this portfolio yet/i.test(document.body.innerText||'')",
                        timeout=65000
                    )
                    def controls():
                        return page.evaluate(r"""() => {
                            const visible=e=>{const r=e.getBoundingClientRect();return !!(r.width&&r.height)};
                            const elems=[...document.querySelectorAll('button,[role=button],[role=tab],input,textarea,[contenteditable=true]')].filter(visible);
                            return {
                                labels:elems.map(e=>({tag:e.tagName,role:e.getAttribute('role')||'',
                                    label:(e.getAttribute('aria-label')||e.getAttribute('placeholder')||
                                      (e.innerText||'').replace(/\s+/g,' ').trim()).slice(0,100)}))
                                  .filter(x=>/agregar|añadir|inversi|compra|buy|transacci|activo|registr|precio|cantidad|date|fecha|upload|cargar|describe/i.test(x.label)).slice(0,32),
                                dialogs:[...document.querySelectorAll('[role=dialog]')].filter(visible).length,
                                fields:elems.filter(e=>/INPUT|TEXTAREA/.test(e.tagName))
                                  .map(e=>({type:e.getAttribute('type')||'',
                                      placeholder:e.getAttribute('placeholder')||''})).slice(0,15),
                                empty:/Aún no hay nada en esta cartera|Nothing in this portfolio yet/i.test(document.body.innerText||'')
                            };
                        }""")
                    before=controls()
                    print("GF_FIRSTBUY_INITIAL_UI="+json.dumps(before,sort_keys=True,ensure_ascii=False),flush=True)
                    add=page.get_by_role("button",name="Agregar inversiones",exact=True)
                    if add.count()==0:
                        add=page.get_by_text("Agregar inversiones",exact=True)
                    print("GF_FIRSTBUY_ADD_CONTROL_COUNT="+str(add.count()),flush=True)
                    if add.count():
                        add.first.click(no_wait_after=True,timeout=32000)
                        page.wait_for_timeout(1200)
                        assert protected not in page.url and old not in page.url
                        print("GF_FIRSTBUY_AFTER_ADD_CLICK_UI="+json.dumps(controls(),sort_keys=True,ensure_ascii=False),flush=True)
                        print("GF_FIRSTBUY_ADD_CLICK_ONLY_NO_FORM_INPUT_OR_SUBMIT=TRUE",flush=True)
                    else:
                        print("GF_FIRSTBUY_NO_NATIVE_ADD_CONTROL=TRUE",flush=True)
                finally:
                    page.goto(cfg.portfolio_url,wait_until="commit",timeout=65000)
                    assert urlparse(page.url).path=="/finance/portfolio/"+old
                    print("GF_FIRSTBUY_ORIGINAL_BROWSER_ROUTE_RESTORED=TRUE",flush=True)
            print("GF_FIRSTBUY_NO_GOOGLE_OR_LEDGER_WRITES=TRUE",flush=True)
            PY
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-tx.timer || true)" = inactive
            echo GF_FIRSTBUY_FINANCIAL_PRODUCTION_UNCHANGED=PASS
