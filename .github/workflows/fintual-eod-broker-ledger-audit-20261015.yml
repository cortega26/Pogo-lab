name: Fintual after-market G8 authenticated ledger parity read-only
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-eod-broker-ledger-audit-20261015.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Audit authenticated post-market broker operations against read-only SQLite
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 2m
          script: |
            set -euo pipefail
            BASELINE=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE=ef50e244f51c3f9c40cb936ed051e61857c20c62
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || exit 21
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$BASELINE"
            STAGE="$(mktemp -d /tmp/fintual-eod-ledger.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE"
            sudo -n nice -n 15 ionice -c 3 timeout 65s env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 "$PY" - <<'PY'
            import json
            from pathlib import Path
            from fintual_executor.client import FintualClient
            from fintual_executor.g8_history import audit_history_against_ledger
            symbols=json.loads(Path("/etc/fintual-executor/config.json").read_text())["symbols"]
            client=FintualClient(execution_enabled=False)
            try:
                client.connect()
                result=audit_history_against_ledger(
                    client,Path("/var/lib/fintual-executor/state.sqlite3"),
                    symbols,page_size=20,max_pages=25,
                )
            finally:
                client.close()
            for name in ("status","error","pages_read","local_fills_checked",
                         "local_fills_unmatched","broker_fulfilled_without_local_fill",
                         "broker_legacy_fills_before_bot","local_open_intents",
                         "offset_traversal_complete","all_known_fills_match",
                         "broker_history_independently_attested",
                         "real_orders_authorized","chrome_retirement_authorized"):
                print("EOD_"+name.upper()+"="+str(result.get(name)),flush=True)
            assert result["real_orders_authorized"] is False
            assert result["chrome_retirement_authorized"] is False
            assert result["broker_history_independently_attested"] is False
            assert result["status"]=="BOUNDED_READ_ONLY_LEDGER_PARITY_PASS"
            PY
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || exit 22
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$BASELINE"
            echo END_OF_MARKET_DAY_AUTHENTICATED_HISTORY_PARITY=PASS
            echo G5_AND_ORIGINAL_FINANCIAL_PRODUCTION_UNCHANGED=TRUE
