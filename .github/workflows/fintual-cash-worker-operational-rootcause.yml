name: Fintual cash worker health root cause (read only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/fintual-cash-worker-operational-rootcause.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm sheet worker mode, authorized IPC queries and last error classes
        id: audit
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 60s
          capture_stdout: true
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'PY'
            import subprocess,sqlite3,json,pwd,stat,re
            from pathlib import Path
            unit="fintual-sheet-sync.service"
            cp=subprocess.run(["systemctl","show",unit,"-p","ExecStart","--value"],capture_output=True,text=True,timeout=8)
            args=cp.stdout
            print("CW_SERVICE_MODE="+("FILLS_ONLY" if "--fills-only" in args else "CASH_IPC" if "--cash-ipc-socket" in args else "UNKNOWN"),flush=True)
            dbfile=Path("/var/lib/fintual-executor/state.sqlite3")
            with sqlite3.connect(dbfile.as_uri()+"?mode=ro",uri=True,timeout=8) as db:
                db.execute("PRAGMA query_only=ON")
                rows=db.execute("SELECT event_type,payload_json FROM audit_events WHERE event_type IN ('SHEET_CASH_EVENT_SYNC_FAILED','SHEET_CASH_CHECKPOINT_MISMATCH') ORDER BY event_id DESC LIMIT 6").fetchall()
                print("CW_ERROR_EVENTS="+str(len(rows)),flush=True)
                for i,(kind,payload) in enumerate(rows[:3]):
                    try: obj=json.loads(payload)
                    except ValueError: obj={}
                    # Only publish the exception class, not message, money, or account info.
                    raw=str(obj.get("error",""))
                    klass=raw.split(":",1)[0] if re.fullmatch(r"[A-Za-z_]+(?::.*)?",raw) else "OTHER"
                    allowed={"SheetSyncError","GoogleSheetProjectionError","ShadowReadOnlyViolation","ShadowTransportError","AuthRequired","KeyError","ValueError","TimeoutError","RuntimeError"}
                    kind="CHECKPOINT_DRIFT" if kind=="SHEET_CASH_CHECKPOINT_MISMATCH" else "EVENT_FAILED"
                    print("CW_RECENT_"+str(i)+"_EVENT="+kind,flush=True)
                    print("CW_RECENT_"+str(i)+"_ERROR="+(klass if klass in allowed else "OTHER"),flush=True)
            release=Path("/opt/fintual-httpx-current").resolve()
            path=Path("/var/lib/fintual-executor/cash-ipc/cash.sock")
            ss=path.lstat(); ps=path.parent.stat()
            assert stat.S_ISSOCK(ss.st_mode) and stat.S_IMODE(ss.st_mode)==0o600 and stat.S_IMODE(ps.st_mode)==0o700 and ss.st_uid==ps.st_uid
            username=pwd.getpwuid(ss.st_uid).pw_name
            script=r"""
            import sys
            from pathlib import Path
            sys.path.insert(0,sys.argv[1])
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            from fintual_executor.client import get_wallet_dividends,get_wallet_cash_interests,get_buy_state
            h=IpcReadOnlyBrokerHandle(Path(sys.argv[2]))
            assert h.health()["order_capability"] is False
            for label,fn in (("DIVIDENDS",get_wallet_dividends),("INTERESTS",get_wallet_cash_interests),("CASH_BALANCE",get_buy_state)):
                try:
                    fn(h)
                    print("CW_IPC_"+label+"=PASS",flush=True)
                except Exception as e:
                    klass=type(e).__name__
                    print("CW_IPC_"+label+"="+(klass if klass in ("ShadowReadOnlyViolation","ShadowTransportError","AuthRequired") else "OTHER"),flush=True)
            """
            p=subprocess.run(["sudo","-n","-u",username,str(release/".venv/bin/python"),"-B","-c",script,str(release/"src"),str(path)],capture_output=True,text=True,timeout=35)
            for line in p.stdout.splitlines():
                if re.fullmatch(r"CW_IPC_[A-Z_]+=[A-Za-z_]+",line):print(line,flush=True)
            print("CW_IPC_PROCESS="+("PASS" if p.returncode==0 else "FAILED"),flush=True)
            PY
      - name: Publish sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT: ${{ steps.audit.outputs.stdout }}
        run: |
          python3 - <<'PY'
          import re,os,subprocess
          lines=[x for x in os.getenv("OUT","").splitlines() if re.fullmatch(r"CW_[A-Z0-9_]+=[A-Za-z0-9_]+",x)]
          body="Read-only cash worker diagnosis, no account values/log details published.\n"+os.environ["RUN_URL"]+"\n\n"+"\n".join(lines)
          p=subprocess.run(["gh","api","-X","POST",f"repos/{os.environ['GH_REPO']}/issues","-f","title=Fintual cash sync worker root-cause modes","-f","body="+body],capture_output=True,text=True,timeout=20)
          if p.returncode:raise SystemExit("issue publish failure")
          PY
