name: GF mirror immutable source validation feasibility (read only)
on:
  push:
    branches:
      - ops/gf-mirror-readonly-status-20261017
    paths:
      - .github/workflows/gf-source-fetch-feasibility-20261017.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether Oracle has authorized readonly repository access
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 45s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            test "$(systemctl is-active fintual-gf-tx-bootstrap.service || true)" = inactive
            echo GF_SOURCE_LOCAL_GIT="$(sudo -n -u fintual git -C /opt/fintual-gf-mirror rev-parse --is-inside-work-tree 2>/dev/null || echo UNAVAILABLE)"
            export GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=5'
            source_ref="$(sudo -n -u fintual timeout 17s git -C /opt/fintual-gf-mirror ls-remote origin refs/heads/feat/google-finance-mirror 2>/dev/null || true)"
            if [[ "$source_ref" == c58ed27fc2b32a599bc0a98ce42cea30212e2a19* ]]; then
              echo GF_IMMUTABLE_SOURCE_FETCH_AVAILABLE=TRUE
            else
              echo GF_IMMUTABLE_SOURCE_FETCH_AVAILABLE=FALSE
            fi
            echo GF_GIT_CLONE_AND_SYSTEMD_UNMODIFIED=TRUE
