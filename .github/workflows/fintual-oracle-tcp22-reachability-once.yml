name: Fintual Oracle TCP22 and SSH banner hosted check (no auth)
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-oracle-tcp22-reachability-once.yml]
permissions:
  contents: read
jobs:
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve OCI SSH host and probe TCP port without attempting authentication
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          python3 - <<'PY'
          import os, socket, sys, time
          host = os.environ.get("OCI_HOST", "")
          if not host:
              print("OCI_HOST_MISSING=TRUE")
              sys.exit(3)
          try:
              infos = socket.getaddrinfo(host, 22, type=socket.SOCK_STREAM)
          except OSError as e:
              print("OCI_HOST_DNS_RESOLUTION=FAILED")
              print("OCI_HOST_DNS_ERROR_TYPE="+type(e).__name__)
              sys.exit(4)
          print("OCI_HOST_DNS_RESOLUTION=PASS")
          print("OCI_HOST_RESOLVED_ADDRESS_COUNT="+str(len({r[4][0] for r in infos})))
          status = "UNREACHABLE"
          errors = set()
          for item in infos[:4]:
              sock = socket.socket(item[0], socket.SOCK_STREAM, item[2])
              sock.settimeout(5)
              try:
                  sock.connect(item[4])
                  status = "OPEN"
                  sock.settimeout(5)
                  try:
                      banner = sock.recv(256)
                  except OSError as error:
                      print("OCI_SSH_BANNER=TIMEOUT_OR_ERROR")
                      print("OCI_SSH_BANNER_ERROR_TYPE="+type(error).__name__)
                      sys.exit(6)
                  if banner.startswith(b"SSH-2.0-"):
                      print("OCI_SSH_BANNER=VALID_SSH2")
                  else:
                      print("OCI_SSH_BANNER=MISSING_OR_UNEXPECTED")
                      sys.exit(7)
                  break
              except OSError as e:
                  errors.add(type(e).__name__)
              finally:
                  sock.close()
          print("OCI_SSH_TCP22="+status)
          if status != "OPEN":
              print("OCI_SSH_TCP22_ERROR_TYPES="+",".join(sorted(errors)))
              sys.exit(5)
          print("NO_CREDENTIALS_OR_FINANCIAL_SERVICES_TOUCHED=TRUE")
          PY
