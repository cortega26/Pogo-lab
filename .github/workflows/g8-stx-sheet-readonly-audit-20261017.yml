name: G8 STX October 7 Sheets provenance inspection (read only)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-stx-sheet-readonly-audit-20261017.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only Google Sheets STX dividend and cash status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 100s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-active fintual-browser.service || true)" = inactive
            sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
              /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            from datetime import date, timedelta
            from google.oauth2 import service_account
            from googleapiclient.discovery import build
            creds=service_account.Credentials.from_service_account_file(
                '/etc/fintual-executor/google-sheet-sync.json',
                scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
            api=build('sheets','v4',credentials=creds,cache_discovery=False)
            doc='1KMWgfA66xwhm6iedNWqpkkWpfzd6DrksnbbsCofwBB4'
            def rows(range_name):
                return api.spreadsheets().values().get(spreadsheetId=doc,range=range_name,
                    valueRenderOption='UNFORMATTED_VALUE',
                    dateTimeRenderOption='SERIAL_NUMBER').execute().get('values',[])
            def day(value):
                if isinstance(value,(float,int)):
                    return (date(1899,12,30)+timedelta(days=int(value))).isoformat()
                return str(value)[:10]
            ledger=rows('Ledger_Fintual!A2:M5000')
            stx=[x for x in ledger if len(x)>10 and day(x[0])=='2026-10-07' and
                 str(x[1]).upper()=='STX' and str(x[2]).upper()=='DIVIDEND']
            native=[x for x in stx if str(x[10]).startswith('fintual-dividend:')]
            provisional=[x for x in stx if str(x[10]).startswith('gmail:fintual-dividend-net:')]
            from decimal import Decimal
            total=sum((Decimal(str(x[5] or 0)) for x in stx),Decimal(0))
            state=rows('Sync_Status!B7:B9')
            print('G8_STX_DIVIDEND_ROWS='+str(len(stx)),flush=True)
            print('G8_STX_BROKER_NATIVE_ROWS='+str(len(native)),flush=True)
            print('G8_STX_PROVISIONAL_NET_ROWS='+str(len(provisional)),flush=True)
            print('G8_STX_DIVIDEND_LEDGER_CREDIT_USD='+str(total),flush=True)
            print('G8_STX_SHEETS_WORKER_STATE='+str(state[0][0] if state and state[0] else 'MISSING'),flush=True)
            print('G8_STX_SHEETS_READONLY_INSPECTION=PASS',flush=True)
            PY
