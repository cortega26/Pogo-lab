name: Fintual mirror Chrome consumer audit read-only
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g5-diagnostics-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect CDP 9223 service dependencies and live connections, no changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            /usr/bin/python3 - <<'PY'
            import subprocess,json
            for unit in ('fintual-gf-mirror-browser.service','fintual-executor.service','fintual-browser.service'):
                for prop in ('Description','ActiveState','RequiredBy','Requires','Wants','WantedBy','PartOf'):
                    p=subprocess.run(['systemctl','show',unit,'--property='+prop,'--value'],
                                     capture_output=True,text=True,timeout=10)
                    print(unit.split('.')[0].upper().replace('-','_')+'_'+prop.upper()+'='+p.stdout.strip()[:150])
            p=subprocess.run(['ss','-Htnp'],capture_output=True,text=True,timeout=20)
            peers=[line for line in p.stdout.splitlines() if ':9223' in line]
            print('CDP_9223_TCP_CONNECTIONS='+str(len(peers)))
            print('CDP_9223_ESTABLISHED='+str(sum(line.startswith('ESTAB') for line in peers)))
            print('CDP_9223_PYTHON_CLIENTS='+str(sum('python' in line for line in peers)))
            PY
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            echo ORIGINAL_PRODUCTION_UNMODIFIED=TRUE
