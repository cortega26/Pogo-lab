name: Fintual Oracle read-only swap and process pressure inventory
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g5-diagnostics-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inventory process RAM and potential stale CI workers only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            echo PROCESSES_TOP_BY_RSS_KB
            ps -eo pid,ppid,rss,etimes,comm --sort=-rss | head -n 30 || true
            echo CPU_COUNT
            nproc
            echo SWAP_DEVICE
            cat /proc/swaps
            echo ROOT_FS
            df -h / | tail -n 1
            echo STALE_CI_PROCESS_MATCHES
            /usr/bin/python3 - <<'PY'
            import os
            for pid in sorted((x for x in os.listdir('/proc') if x.isdecimal()),key=int):
                try:
                    with open('/proc/'+pid+'/cmdline','rb') as f:
                        cmd=f.read(4000).replace(b'\\x00',b' ').decode('utf-8','ignore')
                    if any(tag in cmd for tag in ('fintual-g6-recovery.', 'fintual-g5-fail-closed.', '/tmp/fintual-')):
                        with open('/proc/'+pid+'/status') as f:
                            vals={k:v for k,v in (line.split(':',1) for line in f if ':' in line)}
                        print('CI_PID='+pid+' UID='+vals.get('Uid','').split()[0]+
                              ' RSS='+vals.get('VmRSS','unknown').strip()+
                              ' PPID='+vals.get('PPid','').strip())
                except (FileNotFoundError,PermissionError,OSError,ValueError):
                    continue
            PY
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            echo PRODUCTION_ORIGINAL_SHA_UNMODIFIED=TRUE
