name: Fintual G5 read-only 24h shadow re-launch one-shot
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g5-diagnostics-once.yml]
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start single independent read-only Chrome-bootstrap HTTPX 24h witness
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE_SHA=3dd3f2b0e7b9fb683c3d4f066f819add91848ae9
            STAGE=/opt/fintual-g5-readonly-20261015
            UNIT=fintual-g5-shadow-20261014.service
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            for x in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$x")" = active || { echo ORIGINAL_SERVICE_UNHEALTHY; exit 11; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            test "$(systemctl show "$UNIT" --property=LoadState --value)" = not-found || { echo SHADOW_UNIT_ALREADY_EXISTS; exit 12; }
            test ! -e "$STAGE" || { echo SHADOW_STAGING_EXISTS; exit 13; }
            sudo -n install -d -o fintual -g fintual -m 0700 "$STAGE"
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE_SHA"
            sudo -n env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra shadow \
              --python "$PY" --quiet
            sudo -n chown -R fintual:fintual "$STAGE"
            sudo -n systemd-run --unit=fintual-g5-shadow-20261014 \
              --description="Fintual single-bootstrap HTTPX read-only 24h re-certification" \
              --property=User=fintual --property=Group=fintual \
              --property=WorkingDirectory="$STAGE/repo" \
              --property=Environment="PYTHONPATH=$STAGE/repo/src" \
              --property=Environment=PYTHONDONTWRITEBYTECODE=1 \
              --property=Environment=FINTUAL_REAL_EXECUTION= \
              --property=Environment=FINTUAL_HTTP_MUTATIONS= \
              --property=NoNewPrivileges=true --property=UMask=0077 \
              --property=ProtectSystem=strict --property=ProtectHome=read-only \
              --property=PrivateTmp=true --property=RuntimeMaxSec=87000 \
              "$STAGE/venv/bin/python" -m fintual_executor.shadow_longrun \
              --config /etc/fintual-executor/config.json \
              --interval-seconds 900 --duration-seconds 86400 --min-checkpoints 97
            sleep 15
            test "$(systemctl is-active "$UNIT")" = active || { echo SHADOW_BOOTSTRAP_FAILED; exit 14; }
            /usr/bin/python3 - <<'PY'
            import json,subprocess,datetime as dt
            p=subprocess.run(['journalctl','-u','fintual-g5-shadow-20261014.service','-o','json',
                              '--since=2026-10-15 15:00:00 UTC','--no-pager'],
                             capture_output=True,text=True,timeout=15)
            rows=[]
            for line in p.stdout.splitlines():
                try:
                    x=json.loads(json.loads(line)['MESSAGE'])
                    if isinstance(x,dict) and x.get('phase') in ('BOOTSTRAP','HTTP_READS','AUTH_REQUIRED'):
                        rows.append((x.get('phase'),x.get('ok')))
                except (ValueError,KeyError,TypeError):
                    pass
            print('NEW_G5_BOOTSTRAP_SEEN='+str(('BOOTSTRAP',True) in rows).upper())
            print('NEW_G5_FIRST_SAMPLE_SEEN='+str(('HTTP_READS',True) in rows).upper())
            assert ('BOOTSTRAP',True) in rows
            assert ('HTTP_READS',True) in rows
            PY
            for x in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$x")" = active || { echo ORIGINAL_SERVICE_CHANGED; exit 15; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G5_READONLY_24H_RESTARTED=TRUE
            echo ORIGINAL_PRODUCTION_UNMODIFIED=TRUE
