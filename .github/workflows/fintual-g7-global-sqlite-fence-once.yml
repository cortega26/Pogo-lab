name: Fintual G7 SQLite global uncertainty and crash recovery one-shot
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g7-global-sqlite-fence-once.yml]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Offline G7 subprocess crash, SQLite cross-symbol fence and existing execution regressions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE_SHA=f3a638fdb6e7c130fceabba94436e6bd7a863efa
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(systemctl is-active "$unit")" = active || { echo BLOCKED_G5_OR_PRODUCTION_INACTIVE; exit 21; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            STAGE="$(mktemp -d /tmp/fintual-g7-global-fence.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              git clone --quiet --depth 1 --single-branch --branch fix/g7-global-unknown-restart-fence-20261015 \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE_SHA"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra dev --extra shadow \
              --python "$PY" --quiet
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 160s "$STAGE/venv/bin/python" -m pytest -q -x \
                "$STAGE/repo/tests/test_g7_global_unknown_fence.py" \
                "$STAGE/repo/tests/test_state.py" \
                "$STAGE/repo/tests/test_orchestrator.py" \
                "$STAGE/repo/tests/test_reconcile.py" \
                "$STAGE/repo/tests/test_reconcile_history_bounds.py" \
                "$STAGE/repo/tests/test_execution.py" \
                "$STAGE/repo/tests/test_http_broker_end_to_end_mock.py" \
                "$STAGE/repo/tests/test_http_order_runner_integration.py" \
                "$STAGE/repo/tests/test_http_broker.py" \
                "$STAGE/repo/tests/test_http_g7_session_freeze.py"
            sudo -n "$STAGE/venv/bin/ruff" check \
              "$STAGE/repo/src/fintual_executor/state.py" \
              "$STAGE/repo/src/fintual_executor/orchestrator.py" \
              "$STAGE/repo/tests/test_g7_global_unknown_fence.py"
            sudo -n "$STAGE/venv/bin/python" -m compileall -q \
              "$STAGE/repo/src/fintual_executor/state.py" \
              "$STAGE/repo/src/fintual_executor/orchestrator.py"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(systemctl is-active "$unit")" = active || { echo BLOCKED_G5_OR_PRODUCTION_CHANGED; exit 22; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G7_ATOMIC_GLOBAL_CRASH_FENCE=PASS
            echo G5_STILL_RUNNING=TRUE
            echo ORIGINAL_PRODUCTION_UNMODIFIED=TRUE
