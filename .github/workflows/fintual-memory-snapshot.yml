name: Fintual Oracle browser memory — read-only snapshot

on:
  push:
    branches: [ops/fintual-memory-snapshot-20261014]
    paths:
      - .github/workflows/fintual-memory-snapshot.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure existing production services without changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            echo 'READ_ONLY_MEMORY_SNAPSHOT'
            date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
            echo '--- capacity in MiB ---'
            free -m
            echo '--- cgroup memory bytes ---'
            for svc in fintual-browser.service fintual-xvfb.service fintual-executor.service; do
              active="$(systemctl is-active "$svc" || true)"
              current="$(systemctl show "$svc" -p MemoryCurrent --value || true)"
              peak="$(systemctl show "$svc" -p MemoryPeak --value || true)"
              echo "$svc active=$active memory_current_bytes=$current memory_peak_bytes=$peak"
            done
            echo '--- browser process RSS MiB, aggregate by name ---'
            ps -eo comm=,rss= | awk 'tolower($1) ~ /(chrome|chromium|xvfb)/ { sums[$1]+=$2; counts[$1]++ } END { for (name in counts) printf "%s processes=%d aggregate_rss_mib=%.1f\n", name, counts[name], sums[name]/1024 }'
            echo '--- productive SHA (no fetch/checkout) ---'
            sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD
            echo 'READ_ONLY_MEMORY_SNAPSHOT_DONE'
