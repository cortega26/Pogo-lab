name: Fintual G8 post-rollback original service and Chrome PID verification
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-cutover-after-rollback-audit-20261016.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect real Chrome process ownership and G8 post-rollback identity, no broker requests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 65s
          script: |
            set -euo pipefail
            for name in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              echo UNIT="$name" STATUS="$(timeout 6s systemctl is-active "$name")" ENABLED="$(timeout 6s systemctl is-enabled "$name")"
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            sudo -n cmp /etc/systemd/system/fintual-executor.service /var/lib/fintual-g8-unit-prestage/original-fintual-executor.service
            echo ORIGINAL_FINANCIAL_EXECUTOR_RESTORED=TRUE
            sudo -n /usr/bin/python3 - <<'PY'
            import os,sqlite3
            from pathlib import Path
            root=Path("/opt/fintual-httpx-current")
            print("G8_ALIAS_EXISTS="+str(root.is_symlink()))
            if root.is_symlink():
                print("G8_ALIAS_POINTS_TO_VERIFIED_RELEASE="+str(root.resolve()==Path("/opt/fintual-httpx-releases/e922e0d153f32c8319bc4ec8b9165f39c7dfeac8")))
            print("G8_ACK_INSTALLED="+str(Path("/etc/fintual-executor/httpx-order.env").exists()))
            count=0
            for task in Path("/proc").iterdir():
                if not task.name.isdecimal():continue
                try:raw=(task/"cmdline").read_bytes()
                except (OSError,PermissionError):continue
                argv=raw.split(bytes([0]))
                if not argv or not argv[0]:continue
                executable=Path(os.fsdecode(argv[0])).name.lower()
                if ("chrome" in executable or "chromium" in executable) and (
                    b"--user-data-dir=/var/lib/fintual-browser/profile" in argv
                ):
                    count+=1
            print("ACTUAL_CHROME_MAIN_WITH_REAL_PROFILE="+str(count))
            print("MEM_AVAILABLE_KIB="+next(line.split()[1] for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:")))
            state=Path("/var/lib/fintual-executor/state.sqlite3")
            conn=sqlite3.connect(state.as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                conn.execute("PRAGMA query_only=ON")
                print("LIVE_FINANCIAL_SQLITE_INTEGRITY="+str(conn.execute("PRAGMA integrity_check").fetchone()[0]))
                print("LIVE_FINANCIAL_UNKNOWN="+str(conn.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('UNKNOWN','SUBMITTING')").fetchone()[0]))
            finally:conn.close()
            PY
            echo G8_POST_ROLLBACK_AUDIT=PASS
