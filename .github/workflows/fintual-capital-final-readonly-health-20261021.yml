name: Fintual final live read-only environment gate
on:
  push:
    branches:
      - forensics/fintual-buy-cash-20261021
    paths:
      - .github/workflows/fintual-capital-final-readonly-health-20261021.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production service, immutable release, SQLite and open intent state read only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 90s
          script: |
            sudo -n /usr/bin/python3 - <<'PY'
            import sqlite3,subprocess
            from pathlib import Path
            def run(*args):
                return subprocess.run(args,capture_output=True,text=True,timeout=6)
            assert run("systemctl","is-active","fintual-executor.service").stdout.strip()=="active"
            print("EXECUTOR_ACTIVE=PASS",flush=True)
            assert run("systemctl","is-active","fintual-browser.service").stdout.strip()!="active"
            print("RESIDENT_BROWSER_INACTIVE=PASS",flush=True)
            release=Path("/opt/fintual-httpx-current")
            target=release.resolve(strict=True)
            assert target.is_dir() and target.parent==Path("/opt/fintual-httpx-releases")
            print("FROZEN_RELEASE="+target.name,flush=True)
            db=Path("/var/lib/fintual-executor/state.sqlite3")
            con=sqlite3.connect(db.as_uri()+"?mode=ro",uri=True,timeout=8)
            con.execute("PRAGMA query_only=ON")
            assert con.execute("PRAGMA quick_check").fetchone()[0]=="ok"
            print("LEDGER_QUICK_CHECK=PASS",flush=True)
            uncertain=con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SUBMITTING','UNKNOWN')").fetchone()[0]
            open_intents=con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')").fetchone()[0]
            print("UNRESOLVED_SUBMISSIONS="+str(uncertain),flush=True)
            print("OPEN_INTENTS="+str(open_intents),flush=True)
            assert uncertain==0
            con.close()
            print("FINANCIAL_LEDGER_READONLY=PASS",flush=True)
            PY
      - name: Assert broker session alive via disarmed allowlisted cash read; do not print balances
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 50s
          script: |
            sudo -n -u fintual env PYTHONPATH=/opt/fintual-httpx-current/src \
              /opt/fintual-httpx-current/.venv/bin/python - <<'PY'
            from decimal import Decimal
            from pathlib import Path
            from fintual_executor.client import ASSET_BUY_INPUT_QUERY
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            handle=IpcReadOnlyBrokerHandle(Path("/var/lib/fintual-executor/cash-ipc/cash.sock"))
            health=handle.health()
            assert health["status"]=="READY"
            assert health["order_capability"] is False
            wallet=handle.gql("AssetBuyInputAmount", ASSET_BUY_INPUT_QUERY)["stocksWallet"]
            for key in ("balance","investableAmount"):
                row=wallet[key]
                assert row["currency"]=="USD"
                number=Decimal(str(row["amount"]))
                assert number.is_finite() and number>=0
            handle.close()
            print("BROKER_SESSION_READONLY=PASS",flush=True)
            print("CASH_PAYLOAD_VALID=PASS",flush=True)
            print("REAL_ORDER_CAPABILITY=FALSE",flush=True)
            PY
