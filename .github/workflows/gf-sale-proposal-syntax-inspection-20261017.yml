name: GF sale proposal syntax inspection (read only)
on:
  push:
    branches:
      - ops/gf-mirror-readonly-status-20261017
    paths:
      - .github/workflows/gf-sale-proposal-syntax-inspection-20261017.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect visible sale draft syntax without sending or clicking
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 65s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            sudo -n -u fintual env PYTHONPATH=/opt/fintual-gf-mirror/integrations/google-finance \
              PYTHONDONTWRITEBYTECODE=1 /opt/fintual-gf-mirror-venv/bin/python - <<'PY'
            import os,re
            from pathlib import Path
            from gf_mirror.config import load_config
            from gf_mirror.cli import _browser
            from gf_mirror.txwriter import TransactionWriter
            env={}
            for line in Path("/etc/fintual-executor/gf-mirror.env").read_text().splitlines():
                s=line.strip()
                if s.startswith("#") or "=" not in s:continue
                k,v=s.split("=",1)
                if k.strip().isidentifier():env[k.strip()]=v.strip().strip("'").strip('"')
            assert not env.get("GF_MIRROR_WRITES")
            os.environ.update(env)
            cfg=load_config()
            with _browser(cfg) as browser:
                writer=TransactionWriter(browser,cfg.portfolio_url,cfg.portfolio_name)
                text=writer._await_sale_proposal(timeout_s=7)
                print("GF_PROPOSAL_STILL_VISIBLE="+str(text is not None),flush=True)
                if text:
                    lines=text.splitlines()
                    for line in lines:
                        ll=line.lower()
                        if any(k in ll for k in ("marzo","fecha","portafolio","portfolio","confirm","venta","registrar")):
                            safe=re.sub(r"\d+(?:[.,]\d+)*","[N]",line.strip())
                            safe=re.sub(r"\b[A-Z]{2,8}:[A-Z0-9.]+\b","[SYMBOL]",safe)
                            print("GF_PROPOSAL_SYNTAX="+safe[:185],flush=True)
                print("GF_NO_ASSISTANT_SEND_NO_CONFIRM=TRUE",flush=True)
            PY
