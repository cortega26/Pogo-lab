name: Fintual G8 independent live HTTPX service persistence postflight
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-independent-live-postflight-20261016.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Independently attest HTTPX systemd process and financial ledger, no broker orders
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 90s
          script: |
            set -euo pipefail
            SHA=e922e0d153f32c8319bc4ec8b9165f39c7dfeac8
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-active fintual-browser.service)" = inactive
            test "$(systemctl is-enabled fintual-browser.service)" = disabled
            test "$(systemctl is-active fintual-xvfb.service)" = active
            PID="$(systemctl show -P MainPID fintual-executor.service)"
            test "$PID" -gt 0
            sudo -n env PID="$PID" SHA="$SHA" /usr/bin/python3 - <<'PY'
            import json,os,sqlite3,stat
            from pathlib import Path
            pid=int(os.environ["PID"])
            sha=os.environ["SHA"]
            proc=Path("/proc")/str(pid)
            assert proc.exists()
            argv=(proc/"cmdline").read_bytes().split(bytes([0]))
            assert b"-m" in argv and b"fintual_executor.runner" in argv
            assert b"--broker-transport" in argv and b"http-order" in argv
            assert b"--auth-bootstrap" in argv and b"transient-profile" in argv
            print("G8_REAL_SYSTEMD_PROCESS_HTTPX_CLI=PASS",flush=True)
            alias=Path("/opt/fintual-httpx-current")
            assert alias.is_symlink() and alias.resolve()==Path("/opt/fintual-httpx-releases")/sha
            ready=json.loads((alias/"HTTPX_RUNTIME_READY.json").read_text())
            assert ready["source_sha"]==sha and ready["runtime_imports_verified"]
            assert b"Requires=fintual-browser.service" not in Path("/etc/systemd/system/fintual-executor.service").read_bytes()
            ack=Path("/etc/fintual-executor/httpx-order.env")
            assert ack.is_file() and stat.S_IMODE(ack.stat().st_mode)==0o600
            assert b"FINTUAL_HTTP_MUTATIONS=YES_I_ACCEPT_HTTP_ORDER_TRANSPORT" in ack.read_bytes()
            print("G8_RELEASE_AND_REAL_ORDER_OPTIN_CONFIG_VALID=PASS",flush=True)
            profile=Path("/var/lib/fintual-browser/profile")
            assert not os.path.lexists(profile/"SingletonLock")
            count=0
            for task in Path("/proc").iterdir():
                if not task.name.isdecimal():continue
                try:raw=(task/"cmdline").read_bytes()
                except (OSError,PermissionError):continue
                av=raw.split(bytes([0]))
                if not av or not av[0]:continue
                command=Path(os.fsdecode(av[0])).name.lower()
                if ("chrome" in command or "chromium" in command) and b"--user-data-dir=/var/lib/fintual-browser/profile" in av:
                    count+=1
            assert count==0
            print("G8_RESIDENT_FINTUAL_CHROME_PROCESSES=0",flush=True)
            con=sqlite3.connect(Path("/var/lib/fintual-executor/state.sqlite3").as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                con.execute("PRAGMA query_only=ON")
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                uncertain=con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SUBMITTING','UNKNOWN')").fetchone()[0]
                assert uncertain==0
                fills=con.execute("SELECT COUNT(*) FROM fills").fetchone()[0]
                print("G8_LOCAL_FILLS_TOTAL="+str(fills),flush=True)
                print("G8_UNKNOWN_OR_SUBMITTING=0",flush=True)
            finally:con.close()
            mem=next(row.split()[1] for row in Path("/proc/meminfo").read_text().splitlines() if row.startswith("MemAvailable:"))
            print("G8_MEM_AVAILABLE_KIB="+mem,flush=True)
            print("G8_INDEPENDENT_FINANCIAL_SQLITE_POSTFLIGHT=PASS",flush=True)
            PY
            sudo -n /usr/bin/python3 - <<'PY'
            import datetime as dt,json,subprocess
            p=subprocess.run(["journalctl","-u","fintual-executor.service","--since=2026-10-16 17:15:40 UTC","--no-pager","-o","cat"],text=True,capture_output=True,timeout=10)
            assert p.returncode==0
            types=[]
            for raw in p.stdout.splitlines():
                try:
                    row=json.loads(raw)
                    if isinstance(row,dict) and isinstance(row.get("state"),str):types.append(row["state"])
                except (ValueError,TypeError):pass
            if not types:print("G8_NEW_RUNTIME_STRUCTURED_EVENTS=NONE",flush=True)
            else:
                keep=[x for x in types if x in ("MARKET_DATA_SOURCE_CONNECTED","MARKET_DATA_SOURCE_DISCONNECTED","AUTH_REQUIRED","ALREADY_RUNNING","MARKET_CLOSED")]
                print("G8_NEW_RUNTIME_SAFE_EVENT_KINDS="+",".join(keep[-8:]),flush=True)
            PY
            test "$(systemctl is-active fintual-executor.service)" = active
            echo G8_LIVE_HTTPX_SERVICE_INDEPENDENT_POSTFLIGHT=PASS
