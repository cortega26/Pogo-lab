name: Fintual v2 live broker shadow preflight (read only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/fintual-v2-broker-shadow-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sample authenticated broker data through strictly read-only owner socket
        id: probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 100s
          capture_stdout: true
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'ROOT'
            import pwd,stat,subprocess,re
            from pathlib import Path
            rel=Path("/opt/fintual-httpx-current").resolve()
            sock=Path("/var/lib/fintual-executor/cash-ipc/cash.sock")
            a=sock.lstat(); b=sock.parent.stat()
            assert stat.S_ISSOCK(a.st_mode) and stat.S_IMODE(a.st_mode)==0o600
            assert a.st_uid==b.st_uid and stat.S_IMODE(b.st_mode)==0o700
            user=pwd.getpwuid(a.st_uid).pw_name
            child = r"""
            from pathlib import Path
            import sys
            from datetime import datetime, timezone
            from decimal import Decimal as D, ROUND_DOWN
            sys.path.insert(0,sys.argv[1])
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            from fintual_executor.client import get_pending,get_buy_state,get_market_info
            from fintual_executor.engine import latest_reference
            handle=IpcReadOnlyBrokerHandle(Path(sys.argv[2]))
            health=handle.health()
            assert health["status"]=="READY" and health["order_capability"] is False
            print("V2_SHADOW_READ_ONLY=true",flush=True)
            # Each query is independently probed. A denied query stays
            # UNVERIFIED; never claim no pending broker orders by default.
            def guarded(label, fn):
                print("V2_SHADOW_STAGE="+label,flush=True)
                try:
                    value=fn()
                    print("V2_SHADOW_"+label+"_READ=PASS",flush=True)
                    return value
                except Exception as exc:
                    print("V2_SHADOW_"+label+"_READ=UNVERIFIED",flush=True)
                    allowed={"ShadowReadOnlyViolation","ShadowTransportError","AuthRequired","KeyError","ValueError"}
                    klass=type(exc).__name__
                    print("V2_SHADOW_"+label+"_ERROR="+(klass if klass in allowed else "OTHER"),flush=True)
                    return None
            pending=guarded("PENDING",lambda:get_pending(handle))
            if pending is not None:
                buys=pending.get("stocksPendingAssetMarketBuys",[])
                sells=pending.get("stocksPendingAssetMarketSells",[])
                assert isinstance(buys,list) and isinstance(sells,list)
                print("V2_SHADOW_BROKER_PENDING_BUYS="+str(len(buys)),flush=True)
                print("V2_SHADOW_BROKER_PENDING_SELLS="+str(len(sells)),flush=True)
            buy=guarded("BUY_STATE",lambda:get_buy_state(handle))
            investable=None
            if buy is not None:
                investable=D(str(buy["stocksWallet"]["investableAmount"]["amount"]))
                assert investable.is_finite() and investable>=0
                print("V2_SHADOW_CASH_MATCH_SHEET_001="+str(abs(investable-D("0.01"))<=D("0.005")).lower(),flush=True)
            market=guarded("MARKET_INFO",lambda:get_market_info(handle))
            if market is not None:
                info=market["stocksAssetsMarketInfo"]
                print("V2_SHADOW_MARKET_OPEN="+str(bool(info["isMarketOpen"])).lower(),flush=True)
            anchors={"NVDA":D("237.17"),"TSLA":D("396.91"),"STX":D("779.48")}
            for symbol in ("NVDA","TSLA","STX"):
                ref=guarded(symbol+"_REFERENCE",lambda:latest_reference(handle,symbol))
                quote=guarded(symbol+"_PRICE",lambda:handle.current_price(symbol))
                if ref is None or quote is None:
                    continue
                price,stamp=quote
                assert price.is_finite() and price>0 and ref.price>0
                dt=datetime.fromisoformat(stamp.replace("Z","+00:00"))
                assert dt.tzinfo is not None
                age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()
                fresh=0<=age<=120
                deviation=abs(price-ref.price)/max(price,ref.price)
                side="BUY" if price<ref.price and deviation>=D("0.03") else "SELL" if price>ref.price and deviation>=D("0.03") else "HOLD"
                target=(deviation*D("1000")).quantize(D("0.01"),rounding=ROUND_DOWN) if side!="HOLD" else D("0")
                print("V2_SHADOW_"+symbol+"_BROKER_REF_MATCH_SHEET="+str(ref.price==anchors[symbol]).lower(),flush=True)
                print("V2_SHADOW_"+symbol+"_FRESH="+str(fresh).lower(),flush=True)
                print("V2_SHADOW_"+symbol+"_SIDE="+side,flush=True)
                if symbol=="NVDA" and investable is not None:
                    shortage=(target-investable)/target if target>investable and target>0 else D("0")
                    action=("HOLD" if side!="BUY" else "BUY" if investable>=target else "BUY_ALL_CASH" if investable>0 and shortage<D("0.05") else "NO_ACTION")
                    print("V2_SHADOW_NVDA_CASH_ACTION="+action,flush=True)
                    print("V2_SHADOW_NVDA_CASH_SHORTAGE_5PCT="+("over" if shortage>=D("0.05") else "under"),flush=True)
            handle.close()
            print("V2_SHADOW_DONE=true",flush=True)
            """
            p=subprocess.run(["sudo","-n","-u",user,str(rel/".venv/bin/python"),"-B","-c",child,str(rel/"src"),str(sock)],
                             capture_output=True,text=True,timeout=80)
            for line in p.stdout.splitlines():
                if re.fullmatch(r"V2_SHADOW_[A-Z0-9_]+=[A-Za-z0-9_.-]+",line):
                    print(line,flush=True)
            if p.returncode:
                classes={"ShadowTransportError","AuthRequired","ShadowReadOnlyViolation","PermissionError","ValueError","RuntimeError","KeyError","TypeError","AssertionError","OSError"}
                found=[line.split(":",1)[0].strip().rsplit(".",1)[-1] for line in p.stderr.splitlines()]
                result=next((x for x in reversed(found) if x in classes),"UNCLASSIFIED")
                print("V2_SHADOW_ERROR_CLASS="+result,flush=True)
            print("V2_SHADOW_PROCESS="+("success" if p.returncode==0 else "failed"),flush=True)
            ROOT
      - name: Publish sanitized no-order shadow evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT: ${{ steps.probe.outputs.stdout }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python3 - <<'PY'
          import re,os,subprocess
          evidence=[line for line in os.getenv("OUTPUT","").splitlines() if re.fullmatch(r"V2_SHADOW_[A-Z0-9_]+=[A-Za-z0-9_.-]+",line)]
          body="Read-only v2 broker shadow (NO orders, no raw cash/quote/account values)\nRun: "+os.environ["GH_RUN"]+"\nProbe: "+os.getenv("OUTCOME","UNKNOWN")+"\n\n" + "\n".join("- "+line for line in evidence)
          p=subprocess.run(["gh","api","-X","POST",f"repos/{os.environ['GH_REPO']}/issues","-f","title=Fintual v2 broker-confirmed read-only shadow preflight","-f","body="+body],capture_output=True,text=True,timeout=20)
          if p.returncode:raise SystemExit("Could not publish shadow evidence")
          PY
