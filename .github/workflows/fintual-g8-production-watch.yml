name: Fintual G8 live HTTPX production watch (hourly)
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: fintual-g8-production-watch
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify active single-writer HTTPX, retired Chrome and ledger, read only
        id: probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 100s
          # Deliberately false: multiline captured stdout is not a verdict
          # channel. The remote step writes a bounded single-line JSON file.
          capture_stdout: false
          script: |
            sudo -n /usr/bin/python3 - <<'PY'
            import json,os,sqlite3,stat,subprocess
            from pathlib import Path
            SHA="b9415c5ae4df8336d98b4dd1b910b979075b6e8f"
            def run(*cmd):
                p=subprocess.run(cmd,capture_output=True,text=True,timeout=12)
                return p.stdout.strip()
            units={
                "executor_active":run("systemctl","is-active","fintual-executor.service")=="active",
                "executor_enabled":run("systemctl","is-enabled","fintual-executor.service")=="enabled",
                "browser_inactive":run("systemctl","is-active","fintual-browser.service")=="inactive",
                "browser_disabled":run("systemctl","is-enabled","fintual-browser.service")=="disabled",
                "xvfb_active":run("systemctl","is-active","fintual-xvfb.service")=="active",
            }
            pid_text=run("systemctl","show","-P","MainPID","fintual-executor.service")
            try:pid=int(pid_text)
            except ValueError:pid=0
            proc=Path("/proc")/str(pid)
            argv=[]
            if pid>0 and proc.exists():
                try:argv=(proc/"cmdline").read_bytes().split(bytes([0]))
                except OSError:pass
            is_httpx=(
                b"fintual_executor.runner" in argv
                and b"--broker-transport" in argv
                and b"http-order" in argv
                and b"--auth-bootstrap" in argv
                and b"transient-profile" in argv
            )
            alias=Path("/opt/fintual-httpx-current")
            release_ok=False
            try:
                ready=json.loads((alias/"HTTPX_RUNTIME_READY.json").read_text())
                cwd=(proc/"cwd").resolve() if pid>0 and proc.exists() else Path("/")
                release_ok=(
                    alias.is_symlink()
                    and alias.resolve()==Path("/opt/fintual-httpx-releases")/SHA
                    and ready.get("source_sha")==SHA
                    and ready.get("runtime_imports_verified") is True
                    and cwd==alias.resolve()
                )
            except (OSError,ValueError,KeyError):pass
            chrome=0
            for task in Path("/proc").iterdir():
                if not task.name.isdecimal():continue
                try:raw=(task/"cmdline").read_bytes()
                except (OSError,PermissionError):continue
                parts=raw.split(bytes([0]))
                if not parts or not parts[0]:continue
                name=Path(os.fsdecode(parts[0])).name.lower()
                if ("chrome" in name or "chromium" in name) and b"--user-data-dir=/var/lib/fintual-browser/profile" in parts:
                    chrome+=1
            if chrome:
                import time
                time.sleep(6)
                chrome=0
                for task in Path("/proc").iterdir():
                    if not task.name.isdecimal():continue
                    try:raw=(task/"cmdline").read_bytes()
                    except (OSError,PermissionError):continue
                    parts=raw.split(bytes([0]))
                    if parts and parts[0] and (b"chrome" in parts[0].lower() or b"chromium" in parts[0].lower()) and b"--user-data-dir=/var/lib/fintual-browser/profile" in parts:
                        chrome+=1
            fills=0
            recent_fills=0
            unknown=-1
            integrity=False
            try:
                db=Path("/var/lib/fintual-executor/state.sqlite3")
                conn=sqlite3.connect(db.as_uri()+"?mode=ro",uri=True,timeout=6)
                try:
                    conn.execute("PRAGMA query_only=ON")
                    integrity=conn.execute("PRAGMA integrity_check").fetchone()==("ok",)
                    unknown=conn.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('UNKNOWN','SUBMITTING')").fetchone()[0]
                    fills=conn.execute("SELECT COUNT(*) FROM fills").fetchone()[0]
                    recent_fills=conn.execute(
                        "SELECT COUNT(*) FROM fills WHERE recorded_at>=datetime('now','-75 minutes')"
                    ).fetchone()[0]
                finally:conn.close()
            except sqlite3.Error:pass
            mem=int(next(row.split()[1] for row in Path("/proc/meminfo").read_text().splitlines() if row.startswith("MemAvailable:")))
            signals={
                **units,"httpx_process":is_httpx,"release_exact":release_ok,
                "no_resident_chrome":chrome==0,"ledger_integrity":integrity,
                "no_uncertain_orders":unknown==0,
            }
            status="HEALTHY" if all(signals.values()) else "ALERT"
            payload={
                "status":status,
                "checks":(",".join(k for k,v in signals.items() if not v) if not all(signals.values()) else "PASS"),
                "resident_chrome_count":chrome,
                "unknown_submissions":unknown,
                "new_httpx_fills":recent_fills>0,
                "total_local_fills":fills,
                "mem_available_kib":mem,
                "release_exact":release_ok,
                "executor_active":units["executor_active"],
                "httpx_process":is_httpx,
            }
            print("G8_STATUS="+status,flush=True)
            print("G8_CHECKS="+payload["checks"],flush=True)
            print("G8_RESIDENT_CHROME_COUNT="+str(chrome),flush=True)
            print("G8_UNKNOWN_SUBMISSIONS="+str(unknown),flush=True)
            print("G8_NEW_HTTPX_FILLS="+("TRUE" if recent_fills>0 else "FALSE"),flush=True)
            print("G8_TOTAL_LOCAL_FILLS="+str(fills),flush=True)
            print("G8_MEM_AVAILABLE_KIB="+str(mem),flush=True)
            root=Path("/var/lib/fintual-executor/production-watch")
            root.mkdir(mode=0o700,parents=True,exist_ok=True)
            path=root/"latest.json"
            path.write_text(json.dumps(payload,separators=(",",":"),sort_keys=True)+"\n")
            os.chmod(path,0o600)
            raise SystemExit(0 if all(signals.values()) else 3)
            PY
      - name: Read the bounded status file and notify only on a real alert or first fill
        if: always()
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$OCI_SSH_KEY" > "$RUNNER_TEMP/oci_key"
          chmod 600 "$RUNNER_TEMP/oci_key"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=12 \
            -i "$RUNNER_TEMP/oci_key" "$OCI_USER@$OCI_HOST" \
            'sudo -n cat /var/lib/fintual-executor/production-watch/latest.json' \
            > "$RUNNER_TEMP/watch.json" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,subprocess
          path=os.path.join(os.environ["RUNNER_TEMP"],"watch.json")
          try:
              payload=json.load(open(path))
          except (OSError,ValueError):
              payload={"status":"UNKNOWN","checks":"STATUS_FILE_UNREADABLE"}
          status=str(payload.get("status","UNKNOWN"))
          checks=str(payload.get("checks","UNKNOWN"))
          bad=os.environ.get("RESULT")!="success" or status!="HEALTHY"
          first_fill=(not bad) and bool(payload.get("new_httpx_fills"))
          if not bad and not first_fill:
              print("G8_STATUS_HEALTHY_NO_NEW_FINANCIAL_FILLS")
              raise SystemExit(0)
          title=("Fintual G8 ALERTA — ejecución HTTPX o Chrome residente" if bad
                 else "Fintual G8 — nuevos fills HTTPX (total local "+str(payload.get("total_local_fills","UNKNOWN"))+")")
          description=("Revisar estado de Oracle, sistema y ledger; NO restaurar una copia histórica sobre fills recientes."
              if bad else "Se registraron fills locales recientes (ventana de 75 minutos). Confirmar paridad con el historial real de Fintual mediante consulta autenticada de solo lectura; NO colocar una orden de prueba.")
          def gh(*args):
              p=subprocess.run(["gh","api",*args],capture_output=True,text=True,timeout=30)
              if p.returncode:raise RuntimeError("Could not publish owner alert")
              return json.loads(p.stdout)
          repo=os.environ["GH_REPO"]
          issues=gh(f"repos/{repo}/issues?state=all&per_page=100")
          if any(i.get("title")==title for i in issues):
              print("Existing owner notification, avoiding duplicates")
              raise SystemExit(1 if bad else 0)
          msg=(f"**Estado:** {status}\n**Comprobaciones:** {checks}"
               f"\n**Chrome residente:** {payload.get('resident_chrome_count','UNKNOWN')}"
               f"\n**Órdenes inciertas:** {payload.get('unknown_submissions','UNKNOWN')}"
               f"\n**Total fills locales:** {payload.get('total_local_fills','UNKNOWN')}"
               f"\n**Evidencia:** {os.environ['GH_RUN']}\n\n{description}")
          report=gh("-X","POST",f"repos/{repo}/issues","-f","title="+title,
                    "-f","body="+msg,"-f","assignees[]=cortega26")
          print("Owner notification created:",report["html_url"])
          if bad:raise SystemExit(1)
          PY