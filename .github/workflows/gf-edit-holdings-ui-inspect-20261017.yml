name: GF New Portfolio edit holdings UI inspection (no save)
on:
  push:
    branches: [ops/gf-mirror-readonly-status-20261017]
    paths: [.github/workflows/gf-edit-holdings-ui-inspect-20261017.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Open edit participations UI and inspect without saving
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 120s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            for unit in fintual-gf-tx-bootstrap.service fintual-gf-tx.service fintual-gf-tx.timer; do
              test "$(systemctl is-active "$unit" || true)" = inactive
            done
            sudo -n -u fintual env PYTHONPATH=/opt/fintual-gf-mirror/integrations/google-finance PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-gf-mirror-venv/bin/python - <<'PY'
            import os,json
            from pathlib import Path
            from urllib.parse import urlparse
            from gf_mirror.config import load_config
            from gf_mirror.cli import _browser
            from gf_mirror.txwriter import TransactionWriter
            vals={}
            for line in Path("/etc/fintual-executor/gf-mirror.env").read_text().splitlines():
                line=line.strip()
                if line.startswith("#") or "=" not in line:continue
                k,v=line.split("=",1)
                if k.strip().isidentifier():vals[k.strip()]=v.strip().strip("'").strip('"')
            assert not vals.get("GF_MIRROR_WRITES") and not vals.get("GF_MIRROR_ALLOW_PROTECTED_PORTFOLIO")
            configured=urlparse(vals.get("GF_MIRROR_PORTFOLIO_URL",""))
            expected="86a77e49-9ac1-432e-8d3b-645b8cda19a2"
            assert configured.hostname=="www.google.com" and configured.path=="/finance/portfolio/"+expected
            os.environ.update(vals)
            config=load_config()
            assert not config.writes_armed
            with _browser(config) as browser:
                writer=TransactionWriter(browser,config.portfolio_url,config.portfolio_name)
                writer._open_assets_tab()
                page=browser.page
                assert urlparse(page.url).path=="/finance/portfolio/"+expected
                candidates=page.evaluate(r"""() => {
                  const visible=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
                  return [...document.querySelectorAll('button[aria-label="Más opciones"]')].filter(visible)
                    .map((b,index)=>{
                      let p=b.parentElement,score=null,depth=0;
                      for(;p&&depth<7;p=p.parentElement,depth++){
                        const text=(p.innerText||'').replace(/\s+/g,' ').trim();
                        if(/\bNew Portfolio\b/.test(text) && !/Portafolio Actualizado/.test(text)
                            && !/Tesla|NVIDIA|Seagate/i.test(text) && text.length<480) {
                          const candidate={index,depth,chars:text.length};
                          if(!score || candidate.chars<score.chars)score=candidate;
                        }
                      }
                      return {index,nearNewPortfolio:!!score,depth:score?.depth??null,
                        contextChars:score?.chars??null};
                    });
                }""")
                print("GF_MENU_CANDIDATES="+json.dumps(candidates,sort_keys=True),flush=True)
                suitable=[x for x in candidates if x["nearNewPortfolio"]]
                assert len(suitable)==1, "New Portfolio menu is not unique; no action"
                try:
                    page.locator('button[aria-label="Más opciones"]:visible').nth(suitable[0]["index"]).click()
                    page.wait_for_timeout(400)
                    items=page.locator('[role="menuitem"]:visible').filter(has_text="Editar participaciones")
                    assert items.count()==1, "Edit holdings menu item ambiguous"
                    print("GF_EDIT_MENU_ITEM=UNIQUE",flush=True)
                    items.first.click()
                    page.wait_for_timeout(1200)
                    assert urlparse(page.url).path=="/finance/portfolio/"+expected,"Destination changed"
                    summary=page.evaluate(r"""() => {
                      const vis=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
                      const labels=[...document.querySelectorAll('button,[role="button"],[role="tab"],[role="menuitem"],input,select,[role="combobox"],[role="dialog"],[role="columnheader"],th')]
                        .filter(vis).map(e=>({
                          tag:e.tagName,role:e.getAttribute('role')||'',
                          value:(e.getAttribute('aria-label')||e.getAttribute('placeholder')||
                            (e.innerText||'').replace(/\s+/g,' ').trim()).slice(0,75)
                        }));
                      const patterns={
                        save:/guardar|save|aplicar|apply/i,
                        cancel:/cancelar|cancel|cerrar|close/i,
                        edit:/editar|edit/i,
                        delete:/borrar|eliminar|delete|remove|quitar/i,
                        sale:/venta|vender|sell/i,
                        transaction:/transacc|activity|historial/i,
                        date:/fecha|date/i,
                        quantity:/cantidad|quantity/i,
                        price:/precio|price/i
                      };
                      const categories=Object.fromEntries(Object.entries(patterns)
                        .map(([name,re])=>[name,labels.filter(e=>re.test(e.value)).length]));
                      const uniqueLabels=[...new Set(labels.filter(e=>Object.values(patterns)
                        .some(re=>re.test(e.value))).map(e=>e.value))].slice(0,30);
                      const tableHeaderLabels=[...document.querySelectorAll('[role="columnheader"],th')]
                        .filter(vis).map(e=>(e.innerText||'').replace(/\s+/g,' ').trim())
                        .filter(t=>/^(s[íi]mbolos?|cantidad|fecha|precio|tipo|acci[oó]n|operaci[oó]n|transacciones|total)$/i.test(t)).slice(0,12);
                      return {
                        visibleDialogs:labels.filter(e=>e.role==='dialog').length,
                        visibleInputs:labels.filter(e=>e.tag==='INPUT').length,
                        visibleSelects:labels.filter(e=>e.tag==='SELECT').length,
                        categoryCounts:categories,
                        knownControls:uniqueLabels,
                        tableHeaderLabels,
                        newPortfolioTitleVisible:!![...document.querySelectorAll('h1,h2,h3')]
                          .filter(vis).find(e=>(e.innerText||'').trim()==='New Portfolio')
                      };
                    }""")
                    print("GF_EDIT_HOLDINGS_UI="+json.dumps(summary,sort_keys=True,ensure_ascii=False),flush=True)

                    view=page.evaluate(r"""() => {
                      const vis=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
                      const allowedTab=/^(?:Activos|Transacciones|Estadísticas|Investments|Activity|Statistics)$/i;
                      const selected=[...document.querySelectorAll('[role=tab],[aria-selected]')].filter(vis)
                        .filter(e=>e.getAttribute('aria-selected')==='true')
                        .map(e=>(e.innerText||e.getAttribute('aria-label')||'').trim())
                        .filter(t=>allowedTab.test(t)).slice(0,5);
                      const buttons=[...document.querySelectorAll('button,[role=button],[role=menuitem]')]
                        .filter(vis).map(e=>(
                          (e.getAttribute('aria-label')||e.getAttribute('title')||(e.innerText||'')).replace(/\s+/g,' ').trim()
                        ));
                      const hasPattern=p=>buttons.some(x=>p.test(x));
                      const rows=[...document.querySelectorAll('tr,[role=row]')].filter(vis);
                      const tslaSales=rows.filter(r=>/March\s+25,\s*2024/i.test(r.innerText||'') &&
                          /Tesla|TSLA/.test(r.innerText||'') &&
                          /Venta|Sell/i.test(r.innerText||''));
                      return {
                        urlTab:new URL(location.href).searchParams.get('tab')||'none',
                        selectedTab:selected,
                        visibleRows:rows.length,
                        targetedTslaSaleRows:tslaSales.length,
                        visibleRowControls:tslaSales.map(r=>[...r.querySelectorAll('button,[role=button],[role=menuitem],input')]
                            .filter(vis).length),
                        anyDeleteControl:hasPattern(/^(?:Eliminar|Borrar|Delete|Remove)(?:\s+transacci[oó]n)?$/i),
                        anySaveControl:hasPattern(/^(?:Guardar|Save|Aplicar|Apply)(?:\s+cambios)?$/i),
                        anyEditControl:hasPattern(/^(?:Editar|Edit)(?:\s+transacci[oó]n)?$/i),
                        editableFields:[...document.querySelectorAll('input,textarea,select,[contenteditable=true]')]
                          .filter(vis).length,
                        dialogs:[...document.querySelectorAll('[role=dialog]')].filter(vis).length,
                        pageHeadingEditable:/editar participaciones|edit holdings/i.test(
                          [...document.querySelectorAll('h1,h2,h3')].filter(vis)
                            .map(e=>e.innerText||'').join(' '))
                      };
                    }""")
                    print("GF_EDIT_VIEW_ROUTE_AND_CONTROLS="+json.dumps(view,sort_keys=True),flush=True)

                finally:
                    # No fields ever changed. Close the UI by navigating back to the target.
                    page.goto(config.portfolio_url,wait_until="domcontentloaded")
                    print("GF_EDIT_NO_FORM_CHANGES_NO_SAVE_NO_DELETE=TRUE",flush=True)
            PY
