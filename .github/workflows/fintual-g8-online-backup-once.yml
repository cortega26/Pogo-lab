name: Fintual G8 online private WAL recovery point acceptance
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-online-backup-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic WAL backup and private release preflight; G5 unchanged
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 155s
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SHA=702603e7f0d6aa80a9c15862c9725a63e9885e1b
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            for service in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$service")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            WORK="$(mktemp -d /tmp/fintual-g8-online-backup-tests.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch feat/g8-online-sqlite-recovery-point-20261015 \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$SHA"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$WORK/cache" \
              UV_PROJECT_ENVIRONMENT="$WORK/venv" "$UV" sync \
              --directory "$WORK/repo" --frozen --extra dev --extra shadow --python "$PY" --quiet
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$WORK/repo/src" PYTHONDONTWRITEBYTECODE=1 timeout 75s \
              "$WORK/venv/bin/python" -m pytest -q -x \
              "$WORK/repo/tests/test_g8_ledger_backup.py" \
              "$WORK/repo/tests/test_g8_observe.py" \
              "$WORK/repo/tests/test_g8_rehearsal.py" \
              "$WORK/repo/tests/test_g8_stage.py" \
              "$WORK/repo/tests/test_g8_httpx_runtime.py"
            sudo -n "$WORK/venv/bin/ruff" check \
              "$WORK/repo/src/fintual_executor/g8_ledger_backup.py" \
              "$WORK/repo/tests/test_g8_ledger_backup.py"
            sudo -n "$WORK/venv/bin/python" -m compileall -q \
              "$WORK/repo/src/fintual_executor/g8_ledger_backup.py"
            for service in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$service")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_ONLINE_PRIVATE_BACKUP_SYNTHETIC_TESTS=PASS
            echo G5_ORIGINAL_PRODUCTION_UNMODIFIED=TRUE
