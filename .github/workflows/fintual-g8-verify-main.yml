name: Fintual G8 merged-main offline verification
on:
  push:
    branches: [ci/fintual-g8-main-check-20261015]
    paths: [.github/workflows/fintual-g8-verify-main.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Oracle isolated tests of reviewed Fintual main; no trading
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            REVIEWED=610928f09986db2bd905d7db16c30e15a9e5aed4
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$unit")" = active
            done
            STAGE="$(mktemp -d /tmp/fintual-g8-check.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY"               git clone --quiet --depth 1 --single-branch --branch main               git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$REVIEWED"
            sudo -n env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache"               UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync               --directory "$STAGE/repo" --frozen --extra dev --extra shadow               --python "$PY" --quiet
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS               PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1               timeout 180s "$STAGE/venv/bin/python" -m pytest -q               "$STAGE/repo/tests/test_g8_observe.py"               "$STAGE/repo/tests/test_g8_stage.py"               "$STAGE/repo/tests/test_g8_dryrun.py"               "$STAGE/repo/tests/test_http_order_ambiguous_recovery.py"
            sudo -n "$STAGE/venv/bin/ruff" check               "$STAGE/repo/src/fintual_executor/g8_observe.py"               "$STAGE/repo/src/fintual_executor/g8_stage.py"               "$STAGE/repo/tests/test_g8_observe.py"               "$STAGE/repo/tests/test_g8_stage.py"
            sudo -n "$STAGE/venv/bin/python" -m compileall -q               "$STAGE/repo/src/fintual_executor/g8_observe.py"               "$STAGE/repo/src/fintual_executor/g8_stage.py"
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$unit")" = active
            done
            echo G8_MERGED_MAIN_TESTS_PASS
            echo FINANCIAL_PRODUCTION_UNCHANGED
