name: G8 final VM reboot preflight (read-only)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-final-reboot-preflight-20261017.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check boot identities, active releases, ledger and readonly broker/Sheets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 130s
          script: |
            set -euo pipefail
            export TARGET_HTTPX=81e3fb22788582806c991d4fc2e89b9e54e7219a
            export TARGET_SHEETS=b9d82a7668ea1ff67e9623499b0df6f778b50d1b
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = enabled
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            test "$(systemctl is-enabled fintual-browser.service || :)" = disabled
            test "$(systemctl is-active fintual-xvfb.service)" = active
            test "$(systemctl is-enabled fintual-xvfb.service)" = enabled
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = "/opt/fintual-httpx-releases/$TARGET_HTTPX"
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = "/opt/fintual-sheet-sync-releases/$TARGET_SHEETS"
            systemctl show -P ExecStart fintual-executor.service | grep -q -- '--sheet-cash-socket'
            systemctl show -P ExecStart fintual-sheet-sync.service | grep -q -- '--cash-ipc-socket'
            ! systemctl show -P ExecStart fintual-sheet-sync.service | grep -q -- '--fills-only'
            test ! -e /var/lib/fintual-browser/profile/SingletonLock
            echo G8_REBOOT_PRE_UNIT_STATES=PASS
            sudo -n /usr/bin/python3 - <<'PY'
            from pathlib import Path
            import hashlib
            root=Path('/etc/fintual-executor/g8-phase2-pre-cutover-backups')
            assert root.is_dir() and root.stat().st_uid==0
            for unit in ('fintual-executor.service','fintual-sheet-sync.service'):
                assert (root/unit).is_file()
            for path in (
                '/etc/fintual-executor/config.json',
                '/etc/fintual-executor/httpx-order.env',
                '/etc/fintual-executor/market-data.env',
                '/etc/fintual-executor/sheet-sync.env',
                '/etc/fintual-executor/google-sheet-sync.json',
            ):
                f=Path(path)
                assert f.is_file() and f.stat().st_uid == 0
            print('G8_REBOOT_PRE_PRIVATE_CONFIG_AND_ROLLBACK=PASS',flush=True)
            PY
            sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
              env PYTHONPATH="/opt/fintual-sheet-sync-current/src" PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            import json, sqlite3
            from datetime import datetime
            from pathlib import Path
            from zoneinfo import ZoneInfo
            from fintual_executor.client import get_buy_state,get_wallet_dividends,get_wallet_cash_interests
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            from google.oauth2 import service_account
            from googleapiclient.discovery import build
            ny=datetime.now(ZoneInfo('America/New_York'))
            assert ny.weekday() in (5,6),'G8_REBOOT_BLOCK_MARKET_WEEKDAY'
            print('G8_REBOOT_MARKET_DAY='+ny.strftime('%a'),flush=True)
            db=Path('/var/lib/fintual-executor/state.sqlite3')
            with sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=10) as con:
                con.execute('PRAGMA query_only=ON')
                assert con.execute('PRAGMA integrity_check').fetchone()==('ok',)
                states=('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')
                pending=con.execute(
                    'SELECT COUNT(*) FROM order_intents WHERE state IN (?,?,?,?,?)', states
                ).fetchone()[0]
                assert pending==0,'G8_REBOOT_BLOCK_OPEN_ORDERS'
                print('G8_REBOOT_PRE_OPEN_INTENTS=0',flush=True)
                print('G8_REBOOT_PRE_LEDGER_INTEGRITY=PASS',flush=True)
            h=IpcReadOnlyBrokerHandle(Path('/var/lib/fintual-executor/cash-ipc/cash.sock'))
            assert h.health()['order_capability'] is False
            d=get_wallet_dividends(h)
            i=get_wallet_cash_interests(h)
            amount=get_buy_state(h)['stocksWallet']['investableAmount']['amount']
            assert isinstance(d,list) and isinstance(i,list) and float(amount)>=0
            assert any(str(x.get('id'))=='1163144' and str(x.get('asset',{}).get('symbol'))=='STX' for x in d)
            print('G8_REBOOT_PRE_BROKER_NATIVE_READS=PASS',flush=True)
            params={}
            for line in Path('/etc/fintual-executor/sheet-sync.env').read_text().splitlines():
                if line.startswith('FINTUAL_SHEET_SPREADSHEET_ID='):
                    params['id']=line.split('=',1)[1].strip().strip('"').strip("'")
            assert params.get('id')
            cred=service_account.Credentials.from_service_account_file(
              '/etc/fintual-executor/google-sheet-sync.json',
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
            service=build('sheets','v4',credentials=cred,cache_discovery=False)
            values=service.spreadsheets().values().get(
                spreadsheetId=params['id'],range='Sync_Status!B7:B9').execute()['values']
            assert values[0][0]=='RUNNING' and int(float(values[1][0]))==0
            assert len(values[2])==1
            print('G8_REBOOT_PRE_GOOGLE_SHEETS_RUNNING=PASS',flush=True)
            PY
            echo G8_REBOOT_PRE_BOOT_ID="$(cat /proc/sys/kernel/random/boot_id)"
            echo G8_REBOOT_PRE_ALL_READONLY=PASS
