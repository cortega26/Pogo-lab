name: Fintual G8 updated main frozen runtime immutable prestage
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-latest-main-prestage-once.yml]
permissions:
  contents: read
jobs:
  prestage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prestage reviewed main to root-owned versioned HTTPX release (no activation)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 4m
          script: |
            set -euo pipefail
            SOURCE=ea54d4d0d79b3a813fb6d1c49a02df73c4af001f
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            STAGEDIR=/var/lib/fintual-g8-stage
            ROOT=/opt/fintual-httpx-releases
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            before="$(sudo -n readlink /opt/fintual-httpx-current || true)"
            WORK="$(mktemp -d /tmp/fintual-g8-latest.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 40s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$SOURCE"
            sudo -n test -d "$STAGEDIR"
            sudo -n test -d "$ROOT"
            if ! sudo -n test -e "$STAGEDIR/$SOURCE.tar"; then
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$WORK/repo/src" "$PY" -m fintual_executor.g8_stage \
                --checkout "$WORK/repo" --stage-directory "$STAGEDIR" --expected-sha "$SOURCE"
            fi
            if ! sudo -n test -e "$ROOT/$SOURCE/HTTPX_RUNTIME_READY.json"; then
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$WORK/repo/src" timeout 150s "$PY" -m fintual_executor.g8_httpx_runtime \
                --stage-dir "$STAGEDIR" --release-root "$ROOT" \
                --source-sha "$SOURCE" --uv "$UV" --base-python "$PY"
            fi
            sudo -n env SOURCE="$SOURCE" STAGEDIR="$STAGEDIR" ROOT="$ROOT" /usr/bin/python3 - <<'PY'
            import json,hashlib,os,stat
            from pathlib import Path
            sha=os.environ["SOURCE"]
            folder=Path(os.environ["ROOT"])/sha
            stage=Path(os.environ["STAGEDIR"])
            ready=json.loads((folder/"HTTPX_RUNTIME_READY.json").read_text())
            mf=json.loads((stage/(sha+".manifest.json")).read_text())
            archive=stage/(sha+".tar")
            dig=hashlib.sha256(archive.read_bytes()).hexdigest()
            assert ready["source_sha"]==mf["git_sha"]==sha
            assert dig==ready["source_archive_sha256"]==mf["archive_sha256"]
            assert ready["runtime_imports_verified"] is True
            assert ready["current_alias_modified"] is False
            assert stat.S_IMODE(folder.stat().st_mode)==0o755
            print("LATEST_HTTPX_RELEASE_SHA="+sha)
            print("LATEST_HTTPX_SOURCE_ARCHIVE_SHA256="+dig)
            print("LATEST_HTTPX_RELEASE_MANIFEST=PASS")
            PY
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$ROOT/$SOURCE/src" "$ROOT/$SOURCE/.venv/bin/python" -c \
              'import httpx,playwright.sync_api;from fintual_executor import runner,reconcile,order_session;print("LATEST_HTTPX_SERVICE_USER_IMPORT=PASS")'
            test "$(sudo -n readlink /opt/fintual-httpx-current || true)" = "$before"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo LATEST_G8_RUNTIME_PRESTAGED_WITHOUT_CUTOVER=PASS
            echo G5_AND_ORIGINAL_PRODUCTION_UNCHANGED=TRUE
