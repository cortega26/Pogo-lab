name: Fintual post-second Chrome-off recovery read-only production verification
on:
  push:
    branches: [ops/fintual-post-manual-recovery-check-20261014]
    paths:
      - .github/workflows/fintual-post-manual-recovery-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check original Oracle Chrome authenticated and armed executor still paused
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            test "$(systemctl is-active fintual-executor.service)" = inactive || { echo EXECUTOR_NOT_PAUSED; exit 4; }
            test "$(systemctl is-active fintual-browser.service)" = active || { echo BROWSER_NOT_ACTIVE; exit 4; }
            test "$(systemctl is-active fintual-xvfb.service)" = active || { echo XVFB_NOT_ACTIVE; exit 4; }
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = abf4db01082c77feef364a8925852a2633afbad2
            echo 'G0: EXECUTOR_INACTIVE_ORIGINAL_CHROME_ACTIVE'
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH=/opt/fintual-executor/src PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-executor/.venv/bin/python - <<'PY'
            from fintual_executor.client import FintualClient, get_pending, get_market_info
            client=FintualClient(execution_enabled=False)
            try:
                client.connect()
                p=get_pending(client)
                m=get_market_info(client)
                buys=p.get("stocksPendingAssetMarketBuys")
                sells=p.get("stocksPendingAssetMarketSells")
                if not isinstance(buys,list) or not isinstance(sells,list) or not isinstance(m.get("isMarketOpen"),bool):
                    raise ValueError("Invalid broker shapes")
                print("ORACLE_AUTH_AFTER_TWO_EXPERIMENTS=PASS")
                print("PENDING_BUYS="+str(len(buys)))
                print("PENDING_SELLS="+str(len(sells)))
            except Exception as error:
                print("ORACLE_AUTH_AFTER_TWO_EXPERIMENTS=FAIL_"+type(error).__name__)
                raise SystemExit(7)
            finally:
                client.close()
            PY
            sudo -n -u fintual /usr/bin/python3 - <<'PY'
            import sqlite3
            db=sqlite3.connect("file:/var/lib/fintual-executor/state.sqlite3?mode=ro",uri=True,timeout=15)
            db.execute("PRAGMA query_only=ON")
            n=db.execute("SELECT count(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')").fetchone()[0]
            integrity=db.execute("PRAGMA integrity_check").fetchone()[0]
            db.close()
            print("OPEN_LOCAL_INTENTS="+str(n))
            print("LEDGER_INTEGRITY_OK="+str(integrity=="ok"))
            if integrity!="ok": raise SystemExit(8)
            PY
            test "$(systemctl is-active fintual-executor.service)" = inactive
            test "$(systemctl is-active fintual-browser.service)" = active
            echo 'RESULT=PRODUCTION_PAUSED_SESSION_VALID_NO_MUTATION'
