name: G8 provision isolated Sheet sync Python runtime (no service changes)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/fintual-sheet-sync-dedicated-venv-20261016.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Provision Python 3.14.8 and Sheets-only dependencies on Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 260s
          script: |
            set -euo pipefail
            SHA=643b4feadf8f0fd223eaa1c95fd6adc1f55f8ed8
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = "/opt/fintual-sheet-sync-releases/$SHA"
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service || true)" = inactive
            test "$(systemctl is-active fintual-sheet-sync.service || true)" = inactive
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = disabled
            test -x /home/fintual/.uv-bootstrap/bin/uv
            UV=/home/fintual/.uv-bootstrap/bin/uv
            VENV=/opt/fintual-sheet-sync-venv
            if test -x "$VENV/bin/python"; then
              ACTUAL="$("$VENV/bin/python" -c 'import sys;print(".".join(map(str,sys.version_info[:3])))')"
              test "$ACTUAL" = 3.14.8
              echo G8_SHEET_EXISTING_VENV_VERSION="$ACTUAL"
            else
              sudo -n install -d -o fintual -g fintual -m 0755 "$VENV"
              sudo -n -u fintual "$UV" venv --python 3.14.8 "$VENV"
              echo G8_SHEET_ISOLATED_VENV_CREATED=TRUE
            fi
            sudo -n -u fintual "$UV" pip install --python "$VENV/bin/python" \
              'google-api-python-client==2.194.0' \
              'google-auth==2.49.2' \
              'playwright==1.58.0' \
              'websockets==17.1'
            sudo -n -u fintual env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/opt/fintual-sheet-sync-current/src \
              "$VENV/bin/python" - <<'PY'
            import importlib.metadata as meta
            import pathlib
            from fintual_executor import sheet_sync
            for pkg,expected in (("google-api-python-client","2.194.0"),("google-auth","2.49.2"),("playwright","1.58.0"),("websockets","17.1")):
                assert meta.version(pkg)==expected,(pkg,meta.version(pkg))
            assert pathlib.Path(sheet_sync.__file__).resolve()==pathlib.Path("/opt/fintual-sheet-sync-current/src/fintual_executor/sheet_sync.py").resolve()
            print("G8_SHEET_ISOLATED_IMPORT_AND_DEPENDENCY_VERSIONS=PASS",flush=True)
            PY
            sudo -n -u fintual env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/opt/fintual-sheet-sync-current/src \
              "$VENV/bin/python" -m fintual_executor.sheet_sync --help | grep -q -- '--fills-only'
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service || true)" = inactive
            test "$(systemctl is-active fintual-sheet-sync.service || true)" = inactive
            echo G8_SHEET_RUNTIME_READY=PASS
            echo G8_SHEET_SERVICES_UNCHANGED=TRUE
