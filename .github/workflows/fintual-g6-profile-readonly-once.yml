name: Fintual G6 existing Chrome profile permissions and executable, metadata only
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-profile-readonly-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read only browser service/profile metadata; never print cookies
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 50s
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'PY'
            import os,stat,pwd,subprocess
            from pathlib import Path
            username="fintual"
            uid=pwd.getpwnam(username).pw_uid
            profile=Path("/var/lib/fintual-browser/profile")
            binary=Path("/var/lib/fintual-browser/chrome")
            print("EXPECTED_USER_EXISTS=TRUE")
            for label,path in (("CHROME_PROFILE",profile),("CHROME_BINARY",binary)):
                try:
                    i=path.lstat()
                    print(label+"_EXISTS=TRUE")
                    print(label+"_IS_DIRECTORY="+str(stat.S_ISDIR(i.st_mode)).upper())
                    print(label+"_IS_SYMLINK="+str(stat.S_ISLNK(i.st_mode)).upper())
                    print(label+"_OWNER_MATCHES_FINTUAL="+str(i.st_uid==uid).upper())
                    print(label+"_MODE="+oct(stat.S_IMODE(i.st_mode)))
                    if label=="CHROME_BINARY":
                        print(label+"_EXECUTABLE="+str(os.access(path,os.X_OK)).upper())
                except OSError:
                    print(label+"_EXISTS=FALSE")
            lock=profile/"SingletonLock"
            print("CHROME_PROFILE_SINGLETON_LOCK_PRESENT="+str(os.path.lexists(lock)).upper())
            for service in ("fintual-browser.service","fintual-executor.service","fintual-g5-shadow-20261014.service"):
                p=subprocess.run(["systemctl","is-active",service],capture_output=True,text=True,timeout=5)
                print("UNIT_"+service.replace(".","_").upper()+"="+p.stdout.strip())
            print("NO_COOKIE_VALUES_LOGGED=TRUE")
            PY
