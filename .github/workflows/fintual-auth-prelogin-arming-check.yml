name: Fintual read-only authentication prelogin guard

on:
  push:
    branches: [ops/fintual-auth-prelogin-arming-check-20261014]
    paths:
      - .github/workflows/fintual-auth-prelogin-arming-check.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read booleans only from live process without modifying production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            for s in fintual-executor.service fintual-browser.service; do
              test "$(systemctl is-active "$s")" = "active"
            done
            echo "SERVICES: ACTIVE"
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "abf4db01082c77feef364a8925852a2633afbad2"
            echo "SOURCE_SHA: EXPECTED"
            sudo -n python3 - <<'PY'
            import json
            from pathlib import Path
            import subprocess
            config = json.loads(Path('/etc/fintual-executor/config.json').read_text())
            cfg_enabled = config.get('execution_enabled') is True
            pid = int(subprocess.check_output(
                ['systemctl', 'show', '-p', 'MainPID', '--value', 'fintual-executor.service'],
                text=True,
            ).strip())
            if pid < 2:
                raise SystemExit('STOP: No live executor PID')
            env = Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
            acknowledged = b'FINTUAL_REAL_EXECUTION=YES_I_ACCEPT_REAL_ORDERS' in env
            print('CONFIG_EXECUTION_ENABLED=' + str(cfg_enabled).upper())
            print('LIVE_PROCESS_REAL_EXECUTION_ACK=' + str(acknowledged).upper())
            print('EFFECTIVE_ORDER_CAPABILITY=' + ('ARMED' if cfg_enabled and acknowledged else 'DISARMED'))
            PY
            for s in fintual-executor.service fintual-browser.service; do
              test "$(systemctl is-active "$s")" = "active"
            done
            echo "POSTFLIGHT: PRODUCTION SERVICES ACTIVE; NO FILES MODIFIED"
