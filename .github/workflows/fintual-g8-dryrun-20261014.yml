name: Fintual G8 fail-closed offline rehearsal (one-shot)
on:
  push:
    branches: [ci/fintual-g8-dryrun-20261014]
    paths: [.github/workflows/fintual-g8-dryrun-20261014.yml]
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Offline G8 failure-gates & reversible code-only simulation, no financial mutation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SHA=cb8b81dacddc9fc405ff436ab3c7a7741ebe5fdd
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            HOSTKEY=/var/lib/fintual-ci-source-readonly/known_hosts
            for service in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$service")" = active || {
                echo "G8_STOP: ORIGINAL_SERVICE_UNHEALTHY"; exit 11;
              }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo "G8_INITIAL_G5_UNIT_STATE=$(systemctl is-active fintual-g5-shadow-20261014.service || true)"
            STAGE="$(mktemp -d /tmp/g8-dryrun-offline.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOSTKEY -i $KEY" \
              git clone --quiet --depth 1 --single-branch --branch feat/g8-reversible-promotion-dryrun-20261014 \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SHA"
            sudo -n env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra dev --extra shadow \
              --python "$PY" --quiet
            echo 'G8_PINNED_OFFLINE_SOURCE_VERIFIED=TRUE'
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 240s "$STAGE/venv/bin/python" -m pytest -q \
              "$STAGE/repo/tests/test_g8_dryrun.py" \
              "$STAGE/repo/tests/test_http_session_ipc.py" \
              "$STAGE/repo/tests/test_http_order_runner_integration.py" \
              "$STAGE/repo/tests/test_http_order_ambiguous_recovery.py"
            sudo -n "$STAGE/venv/bin/ruff" check \
              "$STAGE/repo/src/fintual_executor/g8_dryrun.py" \
              "$STAGE/repo/tests/test_g8_dryrun.py"
            sudo -n "$STAGE/venv/bin/python" -m compileall -q \
              "$STAGE/repo/src/fintual_executor/g8_dryrun.py" \
              "$STAGE/repo/tests/test_g8_dryrun.py"
            for service in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$service")" = active || {
                echo "G8_STOP: ORIGINAL_SERVICE_CHANGED"; exit 12;
              }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo "G8_FINAL_G5_UNIT_STATE=$(systemctl is-active fintual-g5-shadow-20261014.service || true)"
            echo 'G8_OFFLINE_REHEARSAL=PASS_NO_DEPLOYMENT'
            echo 'ORIGINAL_FINANCIAL_PRODUCTION_SHA_UNCHANGED=TRUE'
