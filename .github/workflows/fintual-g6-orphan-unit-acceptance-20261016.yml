name: Fintual G6 verified stale lock cleanup offline acceptance
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-orphan-unit-acceptance-20261016.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test revised orphan lock ownership and transient session under isolated Oracle Python
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 135s
          script: |
            set -euo pipefail
            SHA=9a54488eee2dc088b5ebafe73da432000380de9d
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            UV=/home/fintual/.uv-bootstrap/bin/uv
            for svc in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(timeout 7s systemctl is-active "$svc")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            WORK="$(mktemp -d /tmp/g6-orphan-lock-regression.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch fix/g6-orphan-singleton-20261016 \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$SHA"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$WORK/cache" \
              UV_PROJECT_ENVIRONMENT="$WORK/venv" "$UV" sync \
              --directory "$WORK/repo" --frozen --extra dev --extra shadow --python "$PY" --quiet
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$WORK/repo/src" PYTHONDONTWRITEBYTECODE=1 timeout 70s \
              "$WORK/venv/bin/python" -m pytest -q -x \
              "$WORK/repo/tests/test_g6_transient_auth.py" \
              "$WORK/repo/tests/test_http_order_runner_integration.py" \
              "$WORK/repo/tests/test_g8_systemd_reboot.py" \
              "$WORK/repo/tests/test_shadow_longrun_certification.py"
            sudo -n "$WORK/venv/bin/ruff" check \
              "$WORK/repo/src/fintual_executor/transient_auth.py" \
              "$WORK/repo/tests/test_g6_transient_auth.py"
            sudo -n "$WORK/venv/bin/python" -m compileall -q "$WORK/repo/src/fintual_executor/transient_auth.py"
            for svc in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(timeout 7s systemctl is-active "$svc")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo VERIFIED_G6_ORPHAN_SINGLETON_FIX=PASS
            echo LIVE_ORIGINAL_FINANCIAL_PRODUCTION_UNCHANGED=TRUE
