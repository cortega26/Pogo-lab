name: Fintual merged G6 orphan fix frozen Oracle HTTPX release staging
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-orphan-unit-acceptance-20261016.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pre-stage latest merged G6 fix immutable runtime without service cutover
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 190s
          script: |
            set -euo pipefail
            SOURCE=e922e0d153f32c8319bc4ec8b9165f39c7dfeac8
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            ROOT=/opt/fintual-httpx-releases
            STAGE=/var/lib/fintual-g8-stage
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for s in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(timeout 7s systemctl is-active "$s")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            before="$(sudo -n readlink /opt/fintual-httpx-current || true)"
            TMP="$(mktemp -d /tmp/fintual-g6-orphan-new-release.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$TMP"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$TMP/repo"
            test "$(sudo -n git -C "$TMP/repo" rev-parse HEAD)" = "$SOURCE"
            if ! sudo -n test -e "$STAGE/$SOURCE.tar"; then
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$TMP/repo/src" timeout 35s "$PY" -m fintual_executor.g8_stage \
                --checkout "$TMP/repo" --stage-directory "$STAGE" --expected-sha "$SOURCE"
            fi
            if ! sudo -n test -e "$ROOT/$SOURCE/HTTPX_RUNTIME_READY.json"; then
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$TMP/repo/src" timeout 115s "$PY" -m fintual_executor.g8_httpx_runtime \
                --stage-dir "$STAGE" --release-root "$ROOT" \
                --source-sha "$SOURCE" --uv "$UV" --base-python "$PY"
            fi
            sudo -n env SOURCE="$SOURCE" ROOT="$ROOT" STAGE="$STAGE" /usr/bin/python3 - <<'PY'
            import hashlib,json,os,stat
            from pathlib import Path
            sha=os.environ["SOURCE"]
            root=Path(os.environ["ROOT"])/sha
            stage=Path(os.environ["STAGE"])
            ready=json.loads((root/"HTTPX_RUNTIME_READY.json").read_text())
            manifest=json.loads((stage/(sha+".manifest.json")).read_text())
            checksum=hashlib.sha256((stage/(sha+".tar")).read_bytes()).hexdigest()
            assert sha==ready["source_sha"]==manifest["git_sha"]
            assert checksum==ready["source_archive_sha256"]==manifest["archive_sha256"]
            assert ready["runtime_imports_verified"] is True
            assert stat.S_IMODE(root.stat().st_mode)==0o755
            assert b"EnvironmentFile=/etc/fintual-executor/httpx-order.env" in (root/"deploy/oracle/fintual-httpx-order.service.example").read_bytes()
            print("G8_LATEST_CANONICAL="+sha,flush=True)
            print("G8_RELEASE_INTEGRITY_SHA256="+checksum,flush=True)
            print("G8_LATEST_FROZEN_RELEASE_VERIFIED=TRUE",flush=True)
            PY
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$ROOT/$SOURCE/src" "$ROOT/$SOURCE/.venv/bin/python" -c \
              'import httpx,playwright.sync_api;from fintual_executor import transient_auth,runner,order_session;print("G6_NEW_SERVICE_USER_IMPORT=PASS")'
            test "$(sudo -n readlink /opt/fintual-httpx-current || true)" = "$before"
            test ! -e /etc/fintual-executor/httpx-order.env
            for s in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(timeout 7s systemctl is-active "$s")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_G6_ORPHAN_FIX_PRESTAGED_NO_CUTOVER=PASS
