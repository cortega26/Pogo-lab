name: Fintual G6 actual Chrome lifecycle with production-equivalent systemd sandbox
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-chrome-systemd-isolated-20261016.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Smoke test real transient Chrome under service sandbox on separate empty profile
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 105s
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE=fc6803f5c2aa299f7aa4962887c68f65c0c72762
            RELEASE=/opt/fintual-httpx-releases/$SOURCE
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 6s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            sudo -n test -L /var/lib/fintual-browser/profile/SingletonLock
            sudo -n test -f "$RELEASE/HTTPX_RUNTIME_READY.json"
            SCRIPT=/var/lib/fintual-executor/.g6-one-shot-systemd-canary-$$.py
            cleanup() { sudo -n rm -f -- "$SCRIPT"; }
            trap cleanup EXIT
            cat <<'PY' | sudo -n tee "$SCRIPT" >/dev/null
            import os,tempfile
            from pathlib import Path
            from playwright.sync_api import sync_playwright
            # A fresh empty browser profile; never read persisted Fintual auth.
            with tempfile.TemporaryDirectory(prefix=".g6-systemd-profile-",dir="/var/lib/fintual-executor") as base:
                profile=Path(base)/"profile"
                profile.mkdir(mode=0o700)
                with sync_playwright() as p:
                    ctx=p.chromium.launch_persistent_context(
                        user_data_dir=str(profile),
                        executable_path="/var/lib/fintual-browser/chrome",
                        headless=False,
                        args=["--disable-extensions","--disable-sync","--disable-gpu",
                              "--no-first-run","--no-default-browser-check"],
                        timeout=26000,
                    )
                    try:
                        page=ctx.new_page()
                        page.goto("about:blank",wait_until="domcontentloaded",timeout=10000)
                        assert "Chrome" in page.evaluate("navigator.userAgent")
                        print("G6_SYSTEMD_SANDBOX_ACTUAL_CHROME=PASS",flush=True)
                    finally:
                        ctx.close()
                assert not os.path.lexists(profile/"SingletonLock")
                print("G6_SYSTEMD_SANDBOX_PROFILE_RELEASE=PASS",flush=True)
            print("G6_SYSTEMD_SANDBOX_PROFILE_DELETED=PASS",flush=True)
            PY
            sudo -n chmod 0644 "$SCRIPT"
            sudo -n timeout 78s systemd-run --quiet --wait --pipe --collect \
              --unit="fintual-g6-sandbox-canary-$$" \
              -p User=fintual -p Group=fintual \
              -p Environment=DISPLAY=:99 -p Environment=HOME=/home/fintual \
              -p Environment=PYTHONDONTWRITEBYTECODE=1 \
              -p NoNewPrivileges=yes -p PrivateTmp=yes \
              -p ProtectSystem=strict -p ProtectHome=read-only \
              -p ReadWritePaths=/var/lib/fintual-executor \
              -p ReadWritePaths=/var/lib/fintual-browser/profile \
              -p UMask=0077 -p MemoryMax=900M -p RuntimeMaxSec=65s \
              "$RELEASE/.venv/bin/python" "$SCRIPT"
            sudo -n test -L /var/lib/fintual-browser/profile/SingletonLock
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 6s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G6_PRODUCTION_SANDBOX_CHROME_TRANSIENT=PASS
            echo G5_AND_FINANCIAL_PRODUCTION_UNCHANGED=TRUE
