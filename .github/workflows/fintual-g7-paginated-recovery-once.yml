name: Fintual G8 authenticated broker-history read-only parity check
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g7-paginated-recovery-once.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only broker history against intact live SQLite, no credentials emitted
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 3m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE=1eda20c24d73f8678d59ba3240c76fd321709022
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || { echo PRECHECK_SERVICE_NOT_ACTIVE; exit 21; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            WORK="$(mktemp -d /tmp/fintual-g8-broker-history.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n chmod 0700 "$WORK"
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 45s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$SOURCE"
            # Read-only CDP GraphQL history and SQLite URI mode=ro, no order environment flags.
            # The CLI returns 3 even for a bounded parity pass (no cutover approval).
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$WORK/repo/src" "$PY" - <<'PY'
            import json
            from pathlib import Path
            from fintual_executor.client import FintualClient
            from fintual_executor.g8_history import audit_history_against_ledger
            config=json.loads(Path("/etc/fintual-executor/config.json").read_text())
            symbols=config.get("symbols")
            broker=FintualClient(execution_enabled=False)
            try:
                broker.connect()
                result=audit_history_against_ledger(
                    broker,
                    Path("/var/lib/fintual-executor/state.sqlite3"),
                    symbols,
                    page_size=20,
                    max_pages=25,
                )
            except Exception:
                result={
                    "status":"INCOMPLETE_NO_G7_G8_AUTHORIZATION",
                    "error":"READONLY_AUDIT_UNVERIFIED",
                }
            finally:
                broker.close()
            for key in (
                "status","error","pages_read","local_fills_checked",
                "local_fills_unmatched","broker_fulfilled_without_local_fill",
                "broker_legacy_fills_before_bot","local_open_intents",
                "offset_traversal_complete","all_known_fills_match",
                "broker_history_independently_attested",
                "real_orders_authorized","chrome_retirement_authorized",
            ):
                val=result.get(key)
                if isinstance(val,(str,int,float,bool)) or val is None:
                    print("G8_"+key.upper()+"="+str(val))
            assert result.get("real_orders_authorized") is False
            assert result.get("broker_history_independently_attested") is False
            assert result.get("chrome_retirement_authorized") is False
            PY
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || { echo POSTCHECK_SERVICE_NOT_ACTIVE; exit 22; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_READONLY_AUDIT_NO_MUTATION=TRUE
            echo ORIGINAL_PRODUCTION_UNMODIFIED=TRUE
            echo G5_SHADOW_SERVICE_ACTIVE=TRUE
