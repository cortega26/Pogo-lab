name: G8 Sheets failed precheck exact gate (read-only)
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-sheet-precheck-failure-diagnose-20261017.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only gate check with no credentials printed
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 75s
          script: |
            set -u
            old=643b4feadf8f0fd223eaa1c95fd6adc1f55f8ed8
            owner=81e3fb22788582806c991d4fc2e89b9e54e7219a
            backup=/etc/fintual-executor/g8-phase2-pre-cutover-backups/fintual-sheet-sync.service
            show() { if "$@" >/dev/null 2>&1; then echo "G8_PRECHECK_$1=PASS"; else echo "G8_PRECHECK_$1=FAIL"; fi; }
            # Split each check explicitly; only return PASS/FAIL.
            test "$(systemctl is-active fintual-executor.service)" = active && echo G8_OWNER_ACTIVE=PASS || echo G8_OWNER_ACTIVE=FAIL
            test "$(systemctl is-active fintual-sheet-sync.service)" = active && echo G8_SHEETS_ACTIVE=PASS || echo G8_SHEETS_ACTIVE=FAIL
            test "$(systemctl is-active fintual-browser.service || true)" = inactive && echo G8_BROWSER_INACTIVE=PASS || echo G8_BROWSER_INACTIVE=FAIL
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = "/opt/fintual-httpx-releases/$owner" && echo G8_OWNER_SHA=PASS || echo G8_OWNER_SHA=FAIL
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = "/opt/fintual-sheet-sync-releases/$old" && echo G8_SHEET_SHA=PASS || echo G8_SHEET_SHA=FAIL
            test -d "/opt/fintual-sheet-sync-releases/$old" && echo G8_OLD_DIR_UNPRIV=PASS || echo G8_OLD_DIR_UNPRIV=FAIL
            systemctl show -P ExecStart fintual-sheet-sync.service | grep -q -- '--fills-only' && echo G8_UNIT_FILLS_ONLY=PASS || echo G8_UNIT_FILLS_ONLY=FAIL
            test -f "$backup" && echo G8_BACKUP_UNPRIV=PASS || echo G8_BACKUP_UNPRIV=FAIL
            sudo -n test -f "$backup" && echo G8_BACKUP_ROOT=PASS || echo G8_BACKUP_ROOT=FAIL
            sudo -n cmp -s "$backup" /etc/systemd/system/fintual-sheet-sync.service && echo G8_BACKUP_MATCH=PASS || echo G8_BACKUP_MATCH=FAIL
            test -x /opt/fintual-sheet-sync-venv/bin/python && echo G8_VENV_UNPRIV_EXEC=PASS || echo G8_VENV_UNPRIV_EXEC=FAIL
            sudo -n -u fintual test -x /opt/fintual-sheet-sync-venv/bin/python && echo G8_VENV_SERVICE_EXEC=PASS || echo G8_VENV_SERVICE_EXEC=FAIL
            echo G8_PRECHECK_READONLY_DIAG_COMPLETE=PASS
