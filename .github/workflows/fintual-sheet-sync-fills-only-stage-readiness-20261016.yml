name: Fintual G8 Sheets phase1 independent source/readiness
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/fintual-sheet-sync-fills-only-stage-readiness-20261016.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Oracle safe immutable source retrieval without service mutations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 85s
          script: |
            set -euo pipefail
            SHA=9dd6d43a715d533c213a41b906a373983447017c
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-browser.service || true)" = inactive
            test "$(systemctl is-active fintual-sheet-sync.service || true)" = inactive
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = disabled
            if sudo -n -u fintual git -C /opt/fintual-executor cat-file -e "${SHA}^{commit}" >/dev/null 2>&1; then
              echo SHEET_SYNC_SHA_OBJECT_CACHED=YES
            else
              echo SHEET_SYNC_SHA_OBJECT_CACHED=NO
            fi
            if sudo -n -u fintual timeout 25s git -C /opt/fintual-executor ls-remote origin refs/heads/fix/g8-sheet-sync-fills-only-independent-20261016 >/dev/null 2>&1; then
              echo SHEET_SYNC_GIT_REMOTE_FETCH_AUTH=PASS
            else
              echo SHEET_SYNC_GIT_REMOTE_FETCH_AUTH=UNAVAILABLE
            fi
            sudo -n /usr/bin/python3 - <<'PY'
            import sqlite3
            from pathlib import Path
            d=Path("/var/lib/fintual-executor/state.sqlite3")
            c=sqlite3.connect(d.as_uri()+"?mode=ro",uri=True,timeout=10)
            try:
                c.execute("PRAGMA query_only=ON")
                assert c.execute("PRAGMA integrity_check").fetchone()==("ok",)
                print("SHEET_SYNC_LEDGER_FILLS="+str(c.execute("SELECT COUNT(*) FROM fills").fetchone()[0]),flush=True)
                print("SHEET_SYNC_OUTBOX_PENDING="+str(c.execute("SELECT COUNT(*) FROM sheet_sync_outbox WHERE state!='SYNCED'").fetchone()[0]),flush=True)
                print("SHEET_SYNC_OPEN_LOCAL_INTENTS="+str(c.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')").fetchone()[0]),flush=True)
            finally:c.close()
            PY
            test -x /opt/fintual-sheet-sync-venv/bin/python && echo SHEET_SYNC_EXISTING_VENV=TRUE
            echo SHEET_SYNC_STAGING_PREFLIGHT_NO_ORACLE_MUTATION=PASS
