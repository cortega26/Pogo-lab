name: Fintual G8 merged explicit-opt-in main frozen runtime and unit candidate pre-stage
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-main-fc6803-prestage-20261016.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Stage latest canonical HTTPX release and root-private optin candidate, without activation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 165s
          script: |
            set -euo pipefail
            SOURCE=fc6803f5c2aa299f7aa4962887c68f65c0c72762
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            STAGEDIR=/var/lib/fintual-g8-stage
            ROOT=/opt/fintual-httpx-releases
            UNITPREP=/var/lib/fintual-g8-unit-prestage
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 6s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            test ! -e /etc/fintual-executor/httpx-order.env
            before="$(sudo -n readlink /opt/fintual-httpx-current || true)"
            WORK="$(mktemp -d /tmp/fintual-g8-released-optin.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$WORK"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 35s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$WORK/repo"
            test "$(sudo -n git -C "$WORK/repo" rev-parse HEAD)" = "$SOURCE"
            if ! sudo -n test -f "$STAGEDIR/$SOURCE.tar"; then
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$WORK/repo/src" "$PY" -m fintual_executor.g8_stage \
                --checkout "$WORK/repo" --stage-directory "$STAGEDIR" --expected-sha "$SOURCE"
            fi
            if ! sudo -n test -f "$ROOT/$SOURCE/HTTPX_RUNTIME_READY.json"; then
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$WORK/repo/src" timeout 115s "$PY" -m fintual_executor.g8_httpx_runtime \
                --stage-dir "$STAGEDIR" --release-root "$ROOT" \
                --source-sha "$SOURCE" --uv "$UV" --base-python "$PY"
            fi
            sudo -n env SOURCE="$SOURCE" ROOT="$ROOT" STAGEDIR="$STAGEDIR" UNITPREP="$UNITPREP" /usr/bin/python3 - <<'PY'
            import hashlib,json,os,stat
            from pathlib import Path
            sha=os.environ["SOURCE"]
            release=Path(os.environ["ROOT"])/sha
            archive=Path(os.environ["STAGEDIR"])/(sha+".tar")
            mf=json.loads((Path(os.environ["STAGEDIR"])/(sha+".manifest.json")).read_text())
            ready=json.loads((release/"HTTPX_RUNTIME_READY.json").read_text())
            checksum=hashlib.sha256(archive.read_bytes()).hexdigest()
            assert sha==mf["git_sha"]==ready["source_sha"]
            assert checksum==mf["archive_sha256"]==ready["source_archive_sha256"]
            assert ready["runtime_imports_verified"] and not ready["current_alias_modified"]
            unit=(release/"deploy/oracle/fintual-httpx-order.service.example").read_bytes()
            ack=(release/"deploy/oracle/fintual-httpx-order.env.example").read_bytes()
            assert b"EnvironmentFile=/etc/fintual-executor/httpx-order.env" in unit
            assert b"[Install]" in unit and b"Requires=fintual-browser.service" not in unit
            statements=[x for x in ack.decode().splitlines() if x.strip() and not x.lstrip().startswith("#")]
            assert statements==["FINTUAL_HTTP_MUTATIONS=YES_I_ACCEPT_HTTP_ORDER_TRANSPORT"]
            root=Path(os.environ["UNITPREP"])
            assert root.is_dir() and root.stat().st_uid==0 and stat.S_IMODE(root.stat().st_mode)==0o700
            rollback=root/"original-fintual-executor.service"
            assert rollback.exists() and rollback.read_bytes()==Path("/etc/systemd/system/fintual-executor.service").read_bytes()
            for file,data in ((root/("httpx-"+sha+"-fintual-executor.service"),unit),
                              (root/("httpx-"+sha+"-order.env.example"),ack)):
                if file.exists():
                    assert file.read_bytes()==data
                else:
                    fd=os.open(file,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
                    with os.fdopen(fd,"wb") as out:
                        out.write(data)
                        out.flush()
                        os.fsync(out.fileno())
                assert file.stat().st_uid==0 and stat.S_IMODE(file.stat().st_mode)==0o600
            print("G8_MERGED_SHA="+sha)
            print("G8_MERGED_ARCHIVE_SHA256="+checksum)
            print("G8_ROLLBACK_AND_NEW_UNIT_PRIVATE_PRESTAGE=PASS")
            PY
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$ROOT/$SOURCE/src" "$ROOT/$SOURCE/.venv/bin/python" -c \
              'import httpx,playwright.sync_api;from fintual_executor import runner,transient_auth,g8_ledger_backup;print("G8_NEW_SERVICE_USER_IMPORT=PASS")'
            test ! -e /etc/fintual-executor/httpx-order.env
            test "$(sudo -n readlink /opt/fintual-httpx-current || true)" = "$before"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 6s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_OPTIN_RELEASE_AND_REPLACEMENT_STAGED_NO_CUTOVER=PASS
