name: Fintual check GitHub-hosted private code CI availability without OCI
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-private-source-ci-access-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check whether existing job identity may read the private Fintual repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/cortega26/fintual-executor --jq '.private' >/dev/null 2>&1; then
            echo "HOSTED_CI_PRIVATE_SOURCE_ACCESS=AVAILABLE"
          else
            echo "HOSTED_CI_PRIVATE_SOURCE_ACCESS=NOT_AUTHORIZED"
          fi
          echo "NO_ORACLE_HOST_CONTACTED=TRUE"
          echo "NO_FINANCIAL_CONFIG_OR_SECRETS_READ=TRUE"
