name: Fintual G8 frozen HTTPX runtime acceptance (isolated)
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-frozen-runtime-once.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test immutable real frozen HTTPX runtime in throwaway Oracle path
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 3m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE_SHA=cbcd3d634ccfb624f61de62bc3aebf1bf3d23b95
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || { echo G5_ORIGINAL_PRECHECK_FAILED; exit 21; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            STAGE="$(mktemp -d /tmp/fintual-g8-frozen-release.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 40s git clone --quiet --depth 1 --single-branch --branch fix/g8-independent-frozen-httpx-runtime-20261015 \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE_SHA"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/test-cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/testvenv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra dev --extra shadow \
              --python "$PY" --quiet
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 70s "$STAGE/testvenv/bin/python" -m pytest -q -x \
              "$STAGE/repo/tests/test_g8_httpx_runtime.py" \
              "$STAGE/repo/tests/test_g8_stage.py" \
              "$STAGE/repo/tests/test_g8_rehearsal.py" \
              "$STAGE/repo/tests/test_http_order_runner_cli.py" \
              "$STAGE/repo/tests/test_g6_transient_auth.py"
            sudo -n "$STAGE/testvenv/bin/ruff" check \
              "$STAGE/repo/src/fintual_executor/g8_httpx_runtime.py" \
              "$STAGE/repo/tests/test_g8_httpx_runtime.py"
            sudo -n env STAGE="$STAGE" /usr/bin/python3 - <<'PY'
            import os
            from pathlib import Path
            root=Path(os.environ["STAGE"])
            private=root/"private-artifacts"
            private.mkdir(mode=0o700)
            private.chmod(0o700)
            release=root/"release-root"
            release.mkdir(mode=0o755)
            release.chmod(0o755)
            PY
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" "$PY" -m fintual_executor.g8_stage \
              --checkout "$STAGE/repo" --stage-directory "$STAGE/private-artifacts" --expected-sha "$SOURCE_SHA"
            sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" timeout 95s "$PY" -m fintual_executor.g8_httpx_runtime \
              --stage-dir "$STAGE/private-artifacts" --release-root "$STAGE/release-root" \
              --source-sha "$SOURCE_SHA" --uv "$UV" --base-python "$PY"
            sudo -n test -x "$STAGE/release-root/$SOURCE_SHA/.venv/bin/python"
            sudo -n test -f "$STAGE/release-root/$SOURCE_SHA/HTTPX_RUNTIME_READY.json"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || { echo G5_ORIGINAL_POSTCHECK_FAILED; exit 22; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_FROZEN_SHADOW_RUNTIME_BUILD=PASS
            echo ORIGINAL_AND_G5_UNMODIFIED=TRUE
