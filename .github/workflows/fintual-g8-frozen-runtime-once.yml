name: Fintual G8 canonical independent HTTPX runtime production pre-stage (NO CUTOVER)
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g8-frozen-runtime-once.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Build root-owned SHA-pinned HTTPX shadow runtime separately, check service user
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 4m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE_SHA=dfc0a9827a17a66ca4c8e8b1fecc658ce603676d
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            STAGEDIR=/var/lib/fintual-g8-stage
            RELEASES=/opt/fintual-httpx-releases
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || { echo PRODUCTION_OR_G5_NOT_ACTIVE; exit 21; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            test "$(df -Pk /opt | awk 'NR==2 {print $4}')" -gt 524288 || { echo INSUFFICIENT_FREE_DISK_FOR_STAGING; exit 23; }
            ALIAS_BEFORE="$(sudo -n readlink /opt/fintual-httpx-current || true)"
            STAGE="$(mktemp -d /tmp/fintual-g8-canonical-runtime.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 40s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE_SHA"
            sudo -n test -d "$STAGEDIR"
            if sudo -n test -e "$STAGEDIR/$SOURCE_SHA.tar"; then
              echo EXISTING_CANONICAL_SOURCE_ARCHIVE=TRUE
            else
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$STAGE/repo/src" "$PY" -m fintual_executor.g8_stage \
                --checkout "$STAGE/repo" --stage-directory "$STAGEDIR" --expected-sha "$SOURCE_SHA"
            fi
            sudo -n install -d -m 0755 -o root -g root "$RELEASES"
            if sudo -n test -e "$RELEASES/$SOURCE_SHA/HTTPX_RUNTIME_READY.json"; then
              echo EXISTING_CANONICAL_RUNTIME_READY=TRUE
            else
              sudo -n nice -n 15 ionice -c 3 env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
                PYTHONPATH="$STAGE/repo/src" timeout 150s "$PY" -m fintual_executor.g8_httpx_runtime \
                --stage-dir "$STAGEDIR" --release-root "$RELEASES" \
                --source-sha "$SOURCE_SHA" --uv "$UV" --base-python "$PY"
            fi
            sudo -n env SOURCE_SHA="$SOURCE_SHA" STAGEDIR="$STAGEDIR" RELEASES="$RELEASES" /usr/bin/python3 - <<'PY'
            import json,os,hashlib,stat
            from pathlib import Path
            sha=os.environ["SOURCE_SHA"]
            root=Path(os.environ["STAGEDIR"])
            rel=Path(os.environ["RELEASES"])/sha
            manifest=json.loads((root/(sha+".manifest.json")).read_text())
            ready=json.loads((rel/"HTTPX_RUNTIME_READY.json").read_text())
            h=hashlib.sha256()
            with (root/(sha+".tar")).open("rb") as input:
                for block in iter(lambda:input.read(131072),b""):
                    h.update(block)
            assert h.hexdigest()==ready["source_archive_sha256"]==manifest["archive_sha256"]
            assert ready["source_sha"]==sha and ready["runtime_imports_verified"] is True
            assert ready["production_modified"] is False and ready["services_modified"] is False
            assert ready["current_alias_modified"] is False
            assert stat.S_IMODE(rel.stat().st_mode)==0o755 and rel.stat().st_uid==0
            print("G8_CANONICAL_RUNTIME_SHA="+sha)
            print("G8_CANONICAL_RUNTIME_ARCHIVE_SHA256="+h.hexdigest())
            print("G8_FROZEN_RUNTIME_MANIFEST_INTEGRITY=PASS")
            PY
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$RELEASES/$SOURCE_SHA/src" "$RELEASES/$SOURCE_SHA/.venv/bin/python" -c \
              'import httpx,playwright.sync_api;from fintual_executor import runner,order_session,transient_auth;print("G8_FINTUAL_USER_IMPORT_AND_HTTPX_RUNTIME=PASS")'
            test "$(sudo -n readlink /opt/fintual-httpx-current || true)" = "$ALIAS_BEFORE"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || { echo G5_OR_PRODUCTION_CHANGED; exit 22; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G8_CANONICAL_RUNTIME_STAGED_NO_CUTOVER=PASS
            echo PRODUCTION_AND_G5_UNMODIFIED=TRUE
