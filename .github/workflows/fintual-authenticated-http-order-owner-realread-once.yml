name: Fintual OCI SSH banner recurrence check (no login)
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-authenticated-http-order-owner-realread-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve and connect to SSH port then read protocol banner, no auth
        env:
          TARGET: ${{ secrets.OCI_HOST }}
        run: |
          python3 - <<'PY'
          import os,socket,sys,time
          host=os.environ["TARGET"]
          infos=socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)
          print("DNS=PASS")
          results=[]
          for seconds in (4,8):
              family,kind,proto,_,addr=infos[0]
              with socket.socket(family,kind,proto) as s:
                  s.settimeout(seconds)
                  try:
                      s.connect(addr)
                      print("TCP22=OPEN",flush=True)
                      banner=s.recv(256)
                      if banner.startswith(b"SSH-2.0-"):
                          print("SSH_PROTOCOL_BANNER=PASS")
                          print("NO_CREDENTIALS_OR_REMOTE_COMMANDS_USED=TRUE")
                          sys.exit(0)
                      results.append("UNEXPECTED_PAYLOAD")
                  except OSError as err:
                      results.append(type(err).__name__)
          print("SSH_PROTOCOL_BANNER=UNAVAILABLE")
          print("SSH_BANNER_ERROR_TYPES="+",".join(results))
          print("NO_CREDENTIALS_OR_REMOTE_COMMANDS_USED=TRUE")
          sys.exit(6)
          PY
