name: Fintual G7 CDP vs HTTPX read-only phase diagnostic bounded
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-authenticated-http-order-owner-realread-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Bounded authenticated read stages; no orders; explicit G5 checks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 90s
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE=ef50e244f51c3f9c40cb936ed051e61857c20c62
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || exit 21
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            STAGE="$(mktemp -d /tmp/fintual-auth-phase-probe.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              timeout 30s git clone --quiet --depth 1 --single-branch --branch main \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$SOURCE"
            sudo -n nice -n 15 ionice -c 3 env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra shadow --python "$PY" --quiet
            sudo -n chmod 0700 "$STAGE"
            sudo -n chown -R fintual:fintual "$STAGE"
            set +e
            sudo -n -u fintual nice -n 15 ionice -c 3 timeout 45s env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 "$STAGE/venv/bin/python" -u - <<'PY'
            from fintual_executor.client import FintualClient, MARKET_INFO_QUERY
            from fintual_executor.http_broker import HttpBrokerTransport
            client=FintualClient(execution_enabled=False)
            try:
                print("CDP_ATTACH_PHASE=START",flush=True)
                client.connect()
                print("CDP_ATTACH_PHASE=PASS",flush=True)
                print("COOKIE_SCOPED_SNAPSHOT_PHASE=START",flush=True)
                cookies=client.page.context.cookies(["https://fintual.cl"])
                user_agent=client.page.evaluate("navigator.userAgent")
                print("COOKIE_SCOPED_SNAPSHOT_PHASE="+("PASS" if bool(cookies) else "EMPTY"),flush=True)
            except Exception as exc:
                print("BOOTSTRAP_PHASE_ERROR_TYPE="+type(exc).__name__,flush=True)
                raise SystemExit(11)
            finally:
                print("CDP_DETACH_PHASE=START",flush=True)
                try:
                    client.close()
                    print("CDP_DETACH_PHASE=PASS",flush=True)
                except Exception as exc:
                    print("CDP_DETACH_ERROR_TYPE="+type(exc).__name__,flush=True)
            try:
                print("HTTPX_OWNER_REAL_READ_PHASE=START",flush=True)
                with HttpBrokerTransport(
                    cookies, user_agent=user_agent,
                    requested_execution=False, config_execution_enabled=False,
                ) as broker:
                    assert broker.execution_enabled is False
                    data=broker.gql("StocksAssetsMarketInfo", MARKET_INFO_QUERY)
                    assert isinstance(data.get("stocksAssetsMarketInfo"), dict)
                print("HTTPX_OWNER_REAL_READ_PHASE=PASS",flush=True)
            except Exception as exc:
                print("HTTPX_OWNER_REAL_READ_ERROR_TYPE="+type(exc).__name__,flush=True)
                raise SystemExit(12)
            PY
            RC="$?"
            set -e
            echo PHASE_PROBE_EXIT_CODE="$RC"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active || exit 22
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G5_AND_ORIGINAL_STILL_ACTIVE=TRUE
            test "$RC" -eq 0
