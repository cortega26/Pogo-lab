name: Fintual Oracle connectivity and G5 state only (read-only)
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g5-remote-connectivity-probe-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Bounded read-only SSH and service health probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 45s
          script: |
            set -eu
            echo SSH_CONNECTION_ESTABLISHED=TRUE
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service fintual-g5-shadow-20261014.service; do
              printf 'UNIT_%s=' "$unit"
              systemctl is-active "$unit" || true
            done
            printf 'ORIGINAL_SHA='
            sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD || true
            free -m | awk 'NR==2 {print "MEMORY_AVAILABLE_MIB="$7}' 
            free -m | awk 'NR==3 {print "SWAP_USED_MIB="$3}'
            echo READ_ONLY_PROBE_COMPLETE=TRUE
