name: Fintual Sheets formula diff diagnostic (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print stored formulas only (no monetary values)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 90s
          capture_stdout: false
          script: |
            set -euo pipefail
            sudo -n /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            import os,json
            from pathlib import Path
            import sys
            sys.path.insert(0,"/opt/fintual-sheet-sync-current/src")
            from fintual_executor.google_sheets import GoogleSheetConfig, GoogleSheetsProjector
            env={}
            for line in Path("/etc/fintual-executor/sheet-sync.env").read_text().splitlines():
                line=line.strip()
                if line and not line.startswith("#") and "=" in line:
                    k,v=line.split("=",1); env[k.strip()]=v.strip().strip('"').strip("'")
            p=GoogleSheetsProjector.from_service_account(GoogleSheetConfig(
                spreadsheet_id=env["FINTUAL_SHEET_SPREADSHEET_ID"],
                credentials_file=Path(env["GOOGLE_APPLICATION_CREDENTIALS"])))
            values=p.service.spreadsheets().values()
            def get(r):
                rows=values.get(spreadsheetId=env["FINTUAL_SHEET_SPREADSHEET_ID"],range=r,
                    valueRenderOption="FORMULA",dateTimeRenderOption="SERIAL_NUMBER").execute().get("values",[])
                return rows[0][0] if rows and rows[0] else ""
            for c in ("AL3","AO3","AX3","BA3","BB3","BE3"):
                print("SHEETS_DIAG_"+c+"_CURRENT="+repr(get("Stocks!"+c))[:500],flush=True)
            hidden=values.get(spreadsheetId=env["FINTUAL_SHEET_SPREADSHEET_ID"],
                range="Strategy_v1_rollback_20261027!A1:Z40",
                valueRenderOption="FORMULA",dateTimeRenderOption="SERIAL_NUMBER").execute().get("values",[])
            for r,row in enumerate(hidden,start=1):
                for col,val in enumerate(row,start=1):
                    text=str(val).strip()
                    if "IFERROR" in text and "Positions!$I$" in text:
                        print("SHEETS_DIAG_HIDDEN_R"+str(r)+"C"+str(col)+"="+repr(text)[:500],flush=True)
            print("SHEETS_DIAG_READ_ONLY=true",flush=True)
            PY