name: G8 final Oracle VM reboot and autonomous HTTPX Sheets recovery
on:
  push:
    branches: [ops/g8-live-reboot-cert-20261016]
    paths: [.github/workflows/g8-final-oracle-vm-reboot-cert-20261017.yml]
permissions:
  contents: read
jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Final weekend-only financial gates and schedule single VM reboot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 15s
          command_timeout: 110s
          script: |
            set -euo pipefail
            ROOT=/var/lib/fintual-executor/g8-reboot-cert-20261017
            UNIT=g8-final-oracle-vm-reboot-20261017
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = enabled
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            test "$(systemctl is-enabled fintual-browser.service || :)" = disabled
            test "$(systemctl is-active fintual-xvfb.service)" = active
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = /opt/fintual-httpx-releases/81e3fb22788582806c991d4fc2e89b9e54e7219a
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = /opt/fintual-sheet-sync-releases/b9d82a7668ea1ff67e9623499b0df6f778b50d1b
            systemctl show -P ExecStart fintual-executor.service | grep -q -- '--sheet-cash-socket'
            systemctl show -P ExecStart fintual-sheet-sync.service | grep -q -- '--cash-ipc-socket'
            sudo -n /usr/bin/python3 - <<'PY'
            from pathlib import Path
            from datetime import datetime, timezone
            from zoneinfo import ZoneInfo
            import stat, json, sqlite3
            root=Path('/var/lib/fintual-executor/g8-reboot-cert-20261017')
            assert root.is_dir() and root.stat().st_uid==0
            assert stat.S_IMODE(root.stat().st_mode)==0o700
            assert datetime.now(ZoneInfo('America/New_York')).weekday() in (5,6),'MARKET_WEEKDAY_REBOOT_DENIED'
            before=(root/'before_boot_id.txt').read_text().strip()
            assert before==Path('/proc/sys/kernel/random/boot_id').read_text().strip(),'ALREADY_REBOOTED'
            snaps=sorted(root.glob('g8-financial-*.manifest.json'))
            assert len(snaps)==1,'EXPECTED_EXACTLY_ONE_REBOOT_SNAPSHOT'
            proof=json.loads(snaps[0].read_text())
            assert proof['status']=='G8_ONLINE_RECOVERY_POINT_VERIFIED'
            assert proof['sqlite_integrity']=='ok'
            assert proof['snapshot_open_intents']==0 and proof['snapshot_uncertain_submissions']==0
            stamp=datetime.fromisoformat(proof['created_at_utc'])
            age=(datetime.now(timezone.utc)-stamp).total_seconds()
            assert 0 <= age < 1800,'SNAPSHOT_TOO_OLD'
            snap=root/proof['backup_filename']
            assert snap.is_file() and stat.S_IMODE(snap.stat().st_mode)==0o600
            import hashlib
            assert hashlib.sha256(snap.read_bytes()).hexdigest()==proof['backup_sha256']
            for name in ('fintual-executor.service','fintual-sheet-sync.service'):
                assert (root/name).read_bytes()==(Path('/etc/systemd/system')/name).read_bytes(),'UNIT_CHANGED'
            db=Path('/var/lib/fintual-executor/state.sqlite3')
            with sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=10) as con:
                con.execute('PRAGMA query_only=ON')
                assert con.execute('PRAGMA integrity_check').fetchone()==('ok',)
                states=('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')
                assert con.execute('SELECT COUNT(*) FROM order_intents WHERE state IN (?,?,?,?,?)',states).fetchone()[0]==0,'OPEN_ORDERS'
            print('G8_REBOOT_PRE_WAL_AND_UNITS_VERIFIED=PASS',flush=True)
            print('G8_REBOOT_PRE_NO_UNCERTAIN_ORDERS=PASS',flush=True)
            PY
            test "$(sudo -n test -e "$ROOT/reboot-scheduled" && echo YES || echo NO)" = NO
            sudo -n systemd-run --unit="$UNIT" --on-active=25s \
              --timer-property=AccuracySec=1s /usr/bin/systemctl reboot
            test "$(systemctl is-active "$UNIT.timer")" = active
            sudo -n /usr/bin/python3 - "$ROOT/reboot-scheduled" <<'PY'
            from pathlib import Path
            import os,sys
            p=Path(sys.argv[1])
            fd=os.open(p,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
            with os.fdopen(fd,'w') as f:f.write('scheduled_once\n')
            print('G8_FULL_VM_REBOOT_SCHEDULED=PASS',flush=True)
            PY

  certify:
    needs: reboot
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Allow the scheduled full VM reboot and systemd startup
        run: sleep 130
      - name: Independently attest new kernel boot and autonomous broker / Google Sheets recovery
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 20s
          command_timeout: 675s
          script: |
            set -euo pipefail
            ROOT=/var/lib/fintual-executor/g8-reboot-cert-20261017
            sudo -n /usr/bin/python3 - <<'PY'
            from pathlib import Path
            root=Path('/var/lib/fintual-executor/g8-reboot-cert-20261017')
            assert (root/'reboot-scheduled').read_text().strip()=='scheduled_once'
            old=(root/'before_boot_id.txt').read_text().strip()
            new=Path('/proc/sys/kernel/random/boot_id').read_text().strip()
            assert new!=old,'VM_BOOT_ID_NOT_CHANGED'
            print('G8_NEW_KERNEL_BOOT_ID_VERIFIED=PASS',flush=True)
            PY
            test "$(systemctl is-enabled fintual-executor.service)" = enabled
            test "$(systemctl is-enabled fintual-sheet-sync.service)" = enabled
            test "$(systemctl is-enabled fintual-browser.service || :)" = disabled
            test "$(systemctl is-enabled fintual-xvfb.service)" = enabled
            test "$(sudo -n readlink -f /opt/fintual-httpx-current)" = /opt/fintual-httpx-releases/81e3fb22788582806c991d4fc2e89b9e54e7219a
            test "$(sudo -n readlink -f /opt/fintual-sheet-sync-current)" = /opt/fintual-sheet-sync-releases/b9d82a7668ea1ff67e9623499b0df6f778b50d1b
            systemctl show -P ExecStart fintual-executor.service | grep -q -- '--sheet-cash-socket'
            systemctl show -P ExecStart fintual-sheet-sync.service | grep -q -- '--cash-ipc-socket'
            echo G8_REBOOT_BOOT_UNIT_IDENTITIES=PASS
            # The broker owner may spend time in transient-profile authentication.
            # The Sheets worker intentionally waits up to 300s between cash reads.
            for attempt in $(seq 1 54); do
              if test "$(systemctl is-active fintual-executor.service || :)" = active &&
                 test "$(systemctl is-active fintual-sheet-sync.service || :)" = active &&
                 test "$(systemctl is-active fintual-browser.service || :)" = inactive &&
                 sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
                   env PYTHONPATH=/opt/fintual-sheet-sync-current/src PYTHONDONTWRITEBYTECODE=1 \
                   /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            from pathlib import Path
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            from fintual_executor.client import get_buy_state
            h=IpcReadOnlyBrokerHandle(Path('/var/lib/fintual-executor/cash-ipc/cash.sock'))
            assert h.health()['order_capability'] is False
            val=get_buy_state(h)['stocksWallet']['investableAmount']['amount']
            assert float(val)>=0
            PY
              then
                echo G8_REBOOT_AUTONOMOUS_HTTPX_AUTH=PASS
                break
              fi
              if test "$attempt" -eq 54; then
                echo G8_REBOOT_AUTONOMOUS_HTTPX_AUTH=FAIL
                exit 1
              fi
              sleep 10
            done
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            sudo -n /usr/bin/python3 - <<'PY'
            from pathlib import Path
            import os
            names=[]
            for p in Path('/proc').iterdir():
                if not p.name.isdigit():continue
                try:
                    cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode('utf8','replace')
                except (PermissionError,FileNotFoundError,ProcessLookupError):
                    continue
                if '/var/lib/fintual-browser/profile' in cmd:
                    names.append(p.name)
            assert not names,'FINTUAL_PROFILE_CHROME_REMAINED_RESIDENT'
            print('G8_REBOOT_FINTUAL_CHROME_RESIDENT=0',flush=True)
            PY
            sudo -n -H -u fintual sh -c 'cd /tmp && exec "$@"' sh \
              env PYTHONPATH=/opt/fintual-sheet-sync-current/src PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-sheet-sync-venv/bin/python - <<'PY'
            from datetime import datetime,timedelta,timezone
            from zoneinfo import ZoneInfo
            from pathlib import Path
            import sqlite3,time
            from google.oauth2 import service_account
            from googleapiclient.discovery import build
            from fintual_executor.client import get_wallet_dividends,get_wallet_cash_interests,get_buy_state
            from fintual_executor.session_ipc import IpcReadOnlyBrokerHandle
            root=Path('/var/lib/fintual-executor')
            h=IpcReadOnlyBrokerHandle(root/'cash-ipc/cash.sock')
            assert h.health()['order_capability'] is False
            ds=get_wallet_dividends(h)
            ins=get_wallet_cash_interests(h)
            amount=float(get_buy_state(h)['stocksWallet']['investableAmount']['amount'])
            assert any(str(x.get('id'))=='1163144' for x in ds)
            assert len(ins)>=17
            print('G8_REBOOT_NATIVE_CASH_BROKER=PASS',flush=True)
            id=None
            for line in Path('/etc/fintual-executor/sheet-sync.env').read_text().splitlines():
                if line.startswith('FINTUAL_SHEET_SPREADSHEET_ID='):
                    id=line.split('=',1)[1].strip().strip('"').strip("'")
            assert id
            cred=service_account.Credentials.from_service_account_file(
              '/etc/fintual-executor/google-sheet-sync.json',
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
            api=build('sheets','v4',credentials=cred,cache_discovery=False)
            boot_utc=datetime.now(timezone.utc)-timedelta(seconds=float(Path('/proc/uptime').read_text().split()[0]))
            def sheet(rng):
                return api.spreadsheets().values().get(spreadsheetId=id,range=rng,
                    valueRenderOption='UNFORMATTED_VALUE').execute().get('values',[])
            ready=False
            for i in range(20):
                vals=sheet('Sync_Status!B7:B9')
                if len(vals)>=3 and vals[0] and vals[1] and vals[2]:
                    stamp=datetime.fromisoformat(str(vals[2][0]))
                    recent=stamp.astimezone(timezone.utc)>boot_utc
                    if vals[0][0]=='RUNNING' and int(float(vals[1][0]))==0 and recent:
                        ready=True
                        break
                time.sleep(20)
            assert ready,'GOOGLE_SHEETS_NOT_RUNNING_AFTER_REBOOT'
            print('G8_REBOOT_GOOGLE_SHEETS_CASH_RUNNING=PASS',flush=True)
            assert amount>=0
            with sqlite3.connect((root/'state.sqlite3').as_uri()+'?mode=ro',uri=True,timeout=10) as con:
                con.execute('PRAGMA query_only=ON')
                assert con.execute('PRAGMA integrity_check').fetchone()==('ok',)
                states=('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')
                assert con.execute('SELECT COUNT(*) FROM order_intents WHERE state IN (?,?,?,?,?)',states).fetchone()[0]==0
            print('G8_REBOOT_LOCAL_LEDGER_INTEGRITY=PASS',flush=True)
            PY
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-sheet-sync.service)" = active
            test "$(systemctl is-active fintual-browser.service || :)" = inactive
            echo G8_FULL_VM_REBOOT_CERTIFICATION=PASS
