name: GF assistant response categories (no mutation)
on:
  push:
    branches: [ops/gf-mirror-readonly-status-20261017]
    paths: [.github/workflows/gf-assistant-response-classifier-20261017.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Classify visible assistant answer without logging account data
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 70s
          script: |
            set -euo pipefail
            test "$(systemctl is-active fintual-executor.service)" = active
            test "$(systemctl is-active fintual-gf-mirror-browser.service)" = active
            test "$(systemctl is-active fintual-gf-tx-bootstrap.service || true)" = inactive
            sudo -n -u fintual env PYTHONPATH=/opt/fintual-gf-mirror/integrations/google-finance PYTHONDONTWRITEBYTECODE=1 \
              /opt/fintual-gf-mirror-venv/bin/python - <<'PY'
            import os,json
            from pathlib import Path
            from gf_mirror.cli import _browser
            from gf_mirror.config import load_config
            cfg={}
            for s in Path("/etc/fintual-executor/gf-mirror.env").read_text().splitlines():
                s=s.strip()
                if s.startswith("#") or "=" not in s:continue
                k,v=s.split("=",1)
                if k.strip().isidentifier():cfg[k.strip()]=v.strip().strip("'").strip('"')
            assert not cfg.get("GF_MIRROR_WRITES")
            os.environ.update(cfg)
            c=load_config()
            with _browser(c) as b:
                data=b.page.evaluate(r"""() => {
                  const t=(document.body?.innerText || '');
                  const lower=t.toLowerCase();
                  const expressions=[
                   ['assistant_fallback', /lo siento|i'm sorry|sorry|lamentablemente|disculpa/gi],
                   ['permission_denied', /no tengo acceso|no puedo acceder|not authorized|permisos|autorizaci[oó]n/gi],
                   ['unsupported_action', /no puedo registrar|no puedo realizar|no puedo ejecutar|no tengo la capacidad|no es posible registrar|no puedo hacer|can.t do that/gi],
                   ['network_error', /algo sali[oó] mal|intenta de nuevo|try again|error al procesar|temporarily unavailable|internal error|error de red/gi],
                   ['rate_limited', /demasiadas solicitudes|l[ií]mite de uso|try again later|too many requests|rate limit|cuota/gi],
                   ['missing_transactions', /no encuentro|no aparecen|historial|transacciones anteriores|necesito comprobar/gi],
                   ['insufficient_shares', /acciones suficientes|acciones disponibles|acciones que tienes|no tienes suficientes|insufficient/gi],
                   ['ask_confirmation', /¿?confirmas|por favor confirma|confirmaci[oó]n/gi],
                   ['stuck_loading', /procesando|cargando|generando respuesta|pensando/gi],
                   ['portfolios', /new portfolio|portafolio actualizado|nuevo portafolio/gi]
                  ];
                  const result={};
                  for (const [key,reg] of expressions) {
                    const all=[...lower.matchAll(reg)].map(x=>x.index);
                    result[key]={count:all.length,nearTail:all.some(i=>i>t.length-1600),
                      nearEnd:all.some(i=>i>t.length-700)};
                  }
                  return {total:t.length,categories:result};
                }""")
                print("GF_RESPONSE_CLASSIFICATION="+json.dumps(data,sort_keys=True),flush=True)
            print("GF_CLASSIFIER_NO_ACTION=TRUE",flush=True)
            PY
