name: Fintual G6 real authenticated transient Chrome cold-profile reversible acceptance
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-real-authenticated-cold-profile-20261016.yml]
permissions:
  contents: read
jobs:
  cold-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Briefly quiesce original, real Chrome cold-auth to unarmed HTTPX, automatically restore original
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 165s
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE=fc6803f5c2aa299f7aa4962887c68f65c0c72762
            RELEASE=/opt/fintual-httpx-releases/$SOURCE
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(timeout 8s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            sudo -n test -f "$RELEASE/HTTPX_RUNTIME_READY.json"
            sudo -n test -L /var/lib/fintual-browser/profile/SingletonLock
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$RELEASE/src" PYTHONDONTWRITEBYTECODE=1 timeout 30s \
              "$RELEASE/.venv/bin/python" - <<'PY'
            import sqlite3
            from pathlib import Path
            from fintual_executor.client import FintualClient,get_pending
            con=sqlite3.connect(Path("/var/lib/fintual-executor/state.sqlite3").as_uri()+"?mode=ro",uri=True)
            try:
                con.execute("PRAGMA query_only=ON")
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                assert con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')").fetchone()[0]==0
            finally: con.close()
            with_broker=FintualClient(execution_enabled=False)
            try:
                with_broker.connect()
                p=get_pending(with_broker)
                assert p["stocksPendingAssetMarketBuys"]==[]
                assert p["stocksPendingAssetMarketSells"]==[]
            finally: with_broker.close()
            print("BEFORE_QUIESCE_LOCAL_AND_BROKER_ORDERS_CLEAR=TRUE",flush=True)
            PY
            UNIT="fintual-g6-automatic-recovery-$$"
            RESTART_NEEDED=0
            restore() {
              if test "$RESTART_NEEDED" -eq 1; then
                sudo -n systemctl start fintual-browser.service || true
                sudo -n systemctl start fintual-executor.service || true
                test "$(timeout 12s systemctl is-active fintual-browser.service)" = active || echo ORIGINAL_BROWSER_RESTORATION_FAILED
                test "$(timeout 12s systemctl is-active fintual-executor.service)" = active || echo ORIGINAL_EXECUTOR_RESTORATION_FAILED
              fi
              sudo -n systemctl stop "$UNIT.timer" >/dev/null 2>&1 || true
            }
            trap restore EXIT
            sudo -n systemd-run --quiet --on-active=120s --unit="$UNIT" \
              /bin/sh -c 'systemctl start fintual-browser.service; systemctl start fintual-executor.service'
            echo ORIGINAL_RECOVERY_TIMER_INSTALLED=TRUE
            RESTART_NEEDED=1
            sudo -n timeout 15s systemctl stop fintual-executor.service
            test "$(timeout 8s systemctl is-active fintual-executor.service)" = inactive
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$RELEASE/src" PYTHONDONTWRITEBYTECODE=1 timeout 30s \
              "$RELEASE/.venv/bin/python" - <<'PY'
            import sqlite3
            from pathlib import Path
            from fintual_executor.client import FintualClient,get_pending
            conn=sqlite3.connect(Path("/var/lib/fintual-executor/state.sqlite3").as_uri()+"?mode=ro",uri=True)
            try:
                conn.execute("PRAGMA query_only=ON")
                assert conn.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')").fetchone()[0]==0
            finally: conn.close()
            client=FintualClient(execution_enabled=False)
            try:
                client.connect()
                p=get_pending(client)
                assert p["stocksPendingAssetMarketBuys"]==[]
                assert p["stocksPendingAssetMarketSells"]==[]
            finally: client.close()
            print("QUIESCED_AND_BROKER_AND_LEDGER_STILL_CLEAR=TRUE",flush=True)
            PY
            sudo -n timeout 15s systemctl stop fintual-browser.service
            test "$(timeout 8s systemctl is-active fintual-browser.service)" = inactive
            sudo -n test ! -e /var/lib/fintual-browser/profile/SingletonLock
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              DISPLAY=:99 HOME=/home/fintual PYTHONPATH="$RELEASE/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 67s "$RELEASE/.venv/bin/python" -u - <<'PY'
            import json,sqlite3
            from pathlib import Path
            from fintual_executor.order_session import HttpOrderSessionOwner
            from fintual_executor.transient_auth import bootstrap_transient_profile
            from fintual_executor.client import get_market_info,get_pending
            config=json.loads(Path("/etc/fintual-executor/config.json").read_text())
            with HttpOrderSessionOwner(requested_execution=False,config_execution_enabled=False) as owner:
                bootstrap_transient_profile(
                    owner, profile=Path("/var/lib/fintual-browser/profile"),
                    chrome_binary=Path("/var/lib/fintual-browser/chrome"),
                )
                print("G6_REAL_PERSISTED_PROFILE_AUTHENTICATION=PASS",flush=True)
                handle=owner.borrow(armed=False)
                assert isinstance(get_market_info(handle).get("isMarketOpen"),bool)
                p=get_pending(handle)
                assert p["stocksPendingAssetMarketBuys"]==[] and p["stocksPendingAssetMarketSells"]==[]
                for symbol in config["symbols"]:
                    price,timestamp=handle.current_price(symbol)
                    assert price.is_finite() and price>0 and bool(timestamp)
                print("G6_REAL_HTTPX_READS_AFTER_CHROME_EXIT=PASS",flush=True)
                assert handle.execution_enabled is False
                print("G6_REAL_HTTPX_MUTATIONS_BLOCKED=TRUE",flush=True)
            print("G6_REAL_TRANSIENT_OWNER_CLOSED=TRUE",flush=True)
            PY
            test "$(timeout 8s systemctl is-active fintual-browser.service)" = inactive
            sudo -n test ! -e /var/lib/fintual-browser/profile/SingletonLock
            echo G6_REAL_PROFILE_EXCLUSIVE_LIFECYCLE=PASS
            sudo -n timeout 20s systemctl start fintual-browser.service
            sudo -n timeout 20s systemctl start fintual-executor.service
            test "$(timeout 8s systemctl is-active fintual-browser.service)" = active
            test "$(timeout 8s systemctl is-active fintual-executor.service)" = active
            RESTART_NEEDED=0
            sudo -n systemctl stop "$UNIT.timer"
            trap - EXIT
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G6_ORIGINAL_PRODUCTION_RESTORED=TRUE
            echo G6_NO_REAL_FINANCIAL_MUTATION=TRUE
