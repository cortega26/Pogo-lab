name: Fintual v1 recovery forensics - sanitized read only
# Read-only: no service start/stop, no config/ledger/broker mutation.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Journal start (journalctl syntax)
        required: false
        default: '2026-10-27 20:05:00 UTC'
        type: string
      until:
        description: Journal end (journalctl syntax)
        required: false
        default: '2026-10-27 20:30:00 UTC'
        type: string
permissions:
  contents: read
  issues: write
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Collect sanitized unit, socket, journal and runtime evidence
        uses: appleboy/ssh-action@v1
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: SINCE,UNTIL
          timeout: 12s
          command_timeout: 120s
          capture_stdout: false
          script: |
            set -euo pipefail
            sudo -n env SINCE="$SINCE" UNTIL="$UNTIL" /usr/bin/python3 - <<'PY'
            import datetime, json, os, pwd, re, socket, sqlite3, stat, subprocess
            from pathlib import Path

            def run(*argv, timeout=20):
                try:
                    return subprocess.run(argv, capture_output=True, text=True, timeout=timeout, check=False)
                except (OSError, subprocess.SubprocessError):
                    return None

            def utc(us):
                return datetime.datetime.fromtimestamp(int(us) / 1_000_000,
                    datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")

            unit = "fintual-executor.service"
            show = run("systemctl", "show", unit,
                "-p", "Type", "-p", "ExecStart", "-p", "ExecStartPre",
                "-p", "User", "-p", "Group", "-p", "WorkingDirectory",
                "-p", "EnvironmentFiles", "-p", "Restart", "-p", "RestartSec",
                "-p", "RestartPreventExitStatus", "-p", "Result",
                "-p", "ExecMainStatus", "-p", "NRestarts",
                "-p", "ActiveEnterTimestamp", "-p", "InactiveEnterTimestamp",
                "-p", "ExecMainStartTimestamp", "-p", "ExecMainExitTimestamp")
            info = {}
            if show is not None:
                info = dict(line.split("=", 1) for line in show.stdout.splitlines() if "=" in line)
            for key in ("Type", "User", "Group", "WorkingDirectory", "Restart",
                        "RestartSec", "RestartPreventExitStatus", "Result",
                        "ExecMainStatus", "NRestarts", "ActiveEnterTimestamp",
                        "InactiveEnterTimestamp", "ExecMainStartTimestamp",
                        "ExecMainExitTimestamp"):
                print("RX_UNIT_" + key.upper() + "=" + re.sub(r"[^A-Za-z0-9_.:/ -]", "", info.get(key, ""))[:180])
            print("RX_UNIT_EXECSTART=" + re.sub(r"[^A-Za-z0-9_./ -]", "", info.get("ExecStart", ""))[:400])
            print("RX_UNIT_EXECSTARTPRE_SET=" + str(bool(info.get("ExecStartPre"))))
            print("RX_UNIT_ENV_FILES=" + re.sub(r"[^A-Za-z0-9_./ -]", "", info.get("EnvironmentFiles", ""))[:300])

            for u in ("fintual-executor.service", "fintual-sheet-sync.service",
                      "fintual-browser.service", "fintual-xvfb.service"):
                a = run("systemctl", "is-active", u, timeout=8)
                e = run("systemctl", "is-enabled", u, timeout=8)
                print("RX_SERVICE_" + u.split(".")[0].upper().replace("-", "_") +
                      "_ACTIVE=" + (a.stdout.strip() if a else "UNKNOWN"))
                print("RX_SERVICE_" + u.split(".")[0].upper().replace("-", "_") +
                      "_ENABLED=" + (e.stdout.strip() if e else "UNKNOWN"))

            alias = Path("/opt/fintual-httpx-current")
            print("RX_ALIAS_IS_SYMLINK=" + str(alias.is_symlink()))
            print("RX_ALIAS_TARGET=" + (alias.resolve().name if alias.is_symlink() else "NONE"))
            releases = Path("/opt/fintual-httpx-releases")
            print("RX_RELEASE_DIRS=" + ",".join(sorted(p.name[:40] for p in releases.iterdir() if p.is_dir())) if releases.is_dir() else "RX_RELEASE_DIRS=MISSING")
            if alias.is_symlink():
                ready = alias.resolve() / "HTTPX_RUNTIME_READY.json"
                try:
                    marker = json.loads(ready.read_text())
                    print("RX_MARKER_SOURCE_SHA=" + str(marker.get("source_sha"))[:50])
                    print("RX_MARKER_BLOBS=" + str(marker.get("source_overlay_blobs_verified")))
                    print("RX_MARKER_IMPORTS=" + str(marker.get("runtime_imports_verified")))
                except (OSError, ValueError):
                    print("RX_MARKER=UNREADABLE")
                py = alias.resolve() / ".venv/bin/python"
                v = run(str(py), "-c", "import sys; print(sys.version.split()[0])", timeout=10) if py.is_file() else None
                print("RX_RUNTIME_PYTHON=" + (v.stdout.strip() if v and v.returncode == 0 else "UNAVAILABLE"))

            sock = Path("/var/lib/fintual-executor/cash-ipc/cash.sock")
            try:
                st = sock.lstat(); parent = sock.parent.stat()
                print("RX_SOCKET_EXISTS=true")
                print("RX_SOCKET_TYPE=" + ("SOCKET" if stat.S_ISSOCK(st.st_mode) else "OTHER"))
                print("RX_SOCKET_MODE=" + oct(stat.S_IMODE(st.st_mode)))
                print("RX_SOCKET_PARENT_MODE=" + oct(stat.S_IMODE(parent.st_mode)))
                print("RX_SOCKET_UID_MATCH=" + str(st.st_uid == parent.st_uid))
                print("RX_SOCKET_OWNER=" + pwd.getpwuid(st.st_uid).pw_name)
                print("RX_SOCKET_INODE=" + str(st.st_ino))
                with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as probe:
                    probe.settimeout(2)
                    try:
                        probe.connect(str(sock)); outcome = "CONNECTED"
                    except OSError as exc:
                        outcome = "ERRNO_" + str(exc.errno)
                    except TimeoutError:
                        outcome = "TIMEOUT"
                print("RX_SOCKET_CONNECT=" + outcome)
            except FileNotFoundError:
                print("RX_SOCKET_EXISTS=false")
            lock = sock.parent / ".fintual-session-owner.lock"
            try:
                ls = lock.lstat()
                print("RX_OWNER_LOCK_EXISTS=true")
                print("RX_OWNER_LOCK_MODE=" + oct(stat.S_IMODE(ls.st_mode)))
                print("RX_OWNER_LOCK_LINKS=" + str(ls.st_nlink))
            except FileNotFoundError:
                print("RX_OWNER_LOCK_EXISTS=false")

            ss = run("ss", "-xlpn", timeout=10)
            if ss is not None:
                for line in ss.stdout.splitlines():
                    if "cash.sock" in line:
                        print("RX_SS=" + re.sub(r"\s+", " ", line)[:240])
            found = 0
            for task in Path("/proc").iterdir():
                if not task.name.isdecimal():
                    continue
                try:
                    argv = (task / "cmdline").read_bytes().split(b"\0")
                except (OSError, PermissionError):
                    continue
                if any(b"fintual_executor.runner" in part for part in argv):
                    found += 1
                    clean = " ".join(os.fsdecode(part) for part in argv if part)[:300]
                    print("RX_PROC_PID=" + task.name + " CMD=" + re.sub(r"[^A-Za-z0-9_./= -]", "", clean))
            print("RX_RUNNER_PROCESSES=" + str(found))

            for name in ("config.json", "market-data.env", "httpx-order.env"):
                p = Path("/etc/fintual-executor") / name
                try:
                    s = p.stat()
                    import hashlib
                    print("RX_CONFIG_" + name.replace(".", "_").upper() +
                          "_MODE=" + oct(stat.S_IMODE(s.st_mode)) +
                          "_HASH=" + hashlib.sha256(p.read_bytes()).hexdigest()[:16])
                except OSError:
                    print("RX_CONFIG_" + name.replace(".", "_").upper() + "=MISSING")
            try:
                p = Path("/var/lib/fintual-executor/runner.lock")
                s = p.stat()
                print("RX_RUNNER_LOCK_MODE=" + oct(stat.S_IMODE(s.st_mode)) + "_SIZE=" + str(s.st_size))
            except OSError:
                print("RX_RUNNER_LOCK=MISSING")
            try:
                db = sqlite3.connect("file:/var/lib/fintual-executor/state.sqlite3?mode=ro",
                                     uri=True, timeout=10)
                db.execute("PRAGMA query_only=ON")
                print("RX_LEDGER_INTEGRITY=" + ("OK" if db.execute("PRAGMA integrity_check").fetchone() == ("ok",) else "FAIL"))
                print("RX_LEDGER_FILLS=" + str(db.execute("SELECT COUNT(*) FROM fills").fetchone()[0]))
                print("RX_LEDGER_OPEN=" + str(db.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','ACKNOWLEDGED','PARTIALLY_FILLED','UNKNOWN')").fetchone()[0]))
                print("RX_LEDGER_UNKNOWN=" + str(db.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('UNKNOWN','SUBMITTING')").fetchone()[0]))
                db.close()
            except sqlite3.Error as exc:
                print("RX_LEDGER=ERROR_" + type(exc).__name__)

            since = os.environ.get("SINCE", "2026-10-27 20:05:00 UTC")
            until = os.environ.get("UNTIL", "2026-10-27 20:30:00 UTC")
            print("RX_JOURNAL_WINDOW=" + since.replace(" ", "_") + ".." + until.replace(" ", "_"))
            j = run("journalctl", "-u", unit, "--since", since,
                    "--until", until, "--no-pager", "-o", "json", timeout=30)
            lines = j.stdout.splitlines() if j is not None else []
            print("RX_JOURNAL_ENTRIES=" + str(len(lines)))
            allowed = ("state", "event", "armed", "ok", "source", "provider", "transport",
                       "decision", "signal", "market_open", "open_intents", "error_type",
                       "error_class", "reason", "phase", "status")
            for i, line in enumerate(lines):
                try:
                    obj = json.loads(line)
                except (ValueError, TypeError):
                    continue
                msg = obj.get("MESSAGE", "")
                if isinstance(msg, list):
                    msg = bytes(msg).decode("utf-8", "replace")
                msg = str(msg)
                ts = utc(obj.get("__REALTIME_TIMESTAMP", 0))
                pid = obj.get("_PID", "?")
                try:
                    payload = json.loads(msg)
                except (ValueError, TypeError):
                    payload = None
                if isinstance(payload, dict):
                    facts = " ".join(k + "=" + re.sub(r"[^A-Za-z0-9_.-]", "", str(payload[k]))[:80]
                                     for k in allowed if k in payload)
                    print("RX_J " + ts + " PID=" + str(pid) + " " + facts)
                elif re.fullmatch(r"(?:Started|Starting|Stopping|Stopped|Failed|Deactivated|Consumed) [A-Za-z0-9 ._/-]{1,150}[.]?", msg.strip()):
                    print("RX_J " + ts + " PID=" + str(pid) + " SYSTEMD=" + msg.strip().replace(" ", "_")[:150])
                else:
                    klasses = re.findall(r"\b[A-Z][A-Za-z]*(?:Error|Exception|Required|Violation)\b", msg)
                    print("RX_J " + ts + " PID=" + str(pid) + " UNSTRUCTURED=true CLASSES=" + (",".join(sorted(set(klasses)))[:120] or "NONE"))
            print("RX_READ_ONLY=true")
            PY
