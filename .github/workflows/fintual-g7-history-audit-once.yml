name: Fintual G7 read-only history pagination adversarial suite (one-shot)
on:
  push:
    branches: [ci/fintual-g7-history-audit-20261015]
    paths: [.github/workflows/fintual-g7-history-audit-once.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Test pinned staging code isolated from production and broker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 11m
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            AUDIT_SHA=b51e1f25fb84c9f8f70d5caca4c0df4a1a42ce30
            UV=/home/fintual/.uv-bootstrap/bin/uv
            PY=/opt/fintual-python-runtimes/cpython-3.14.8-abf4db0/venv/bin/python
            KEY=/var/lib/fintual-ci-source-readonly/github_ed25519
            KNOWN=/var/lib/fintual-ci-source-readonly/known_hosts
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$unit")" = active || { echo 'STOP: LIVE_SERVICE_INACTIVE'; exit 11; }
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            STAGE="$(mktemp -d /tmp/fintual-history-audit.XXXXXXXX)"
            trap 'sudo -n rm -rf -- "$STAGE"' EXIT
            sudo -n env GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -i $KEY" \
              git clone --quiet --depth 1 --single-branch --branch feat/g7-paginated-history-audit-20261014 \
              git@github.com:cortega26/fintual-executor.git "$STAGE/repo"
            test "$(sudo -n git -C "$STAGE/repo" rev-parse HEAD)" = "$AUDIT_SHA"
            sudo -n env UV_NO_CONFIG=1 UV_CACHE_DIR="$STAGE/cache" \
              UV_PROJECT_ENVIRONMENT="$STAGE/venv" "$UV" sync \
              --directory "$STAGE/repo" --frozen --extra dev --extra shadow \
              --python "$PY" --quiet
            sudo -n env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$STAGE/repo/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 210s "$STAGE/venv/bin/python" -m pytest -q \
              "$STAGE/repo/tests/test_g8_history.py" \
              "$STAGE/repo/tests/test_reconcile.py" \
              "$STAGE/repo/tests/test_reconcile_history_bounds.py" \
              "$STAGE/repo/tests/test_http_order_ambiguous_recovery.py" \
              "$STAGE/repo/tests/test_g8_observe.py" \
              "$STAGE/repo/tests/test_g8_dryrun.py"
            sudo -n "$STAGE/venv/bin/ruff" check \
              "$STAGE/repo/src/fintual_executor/client.py" \
              "$STAGE/repo/src/fintual_executor/g8_history.py" \
              "$STAGE/repo/tests/test_g8_history.py"
            sudo -n "$STAGE/venv/bin/python" -m compileall -q \
              "$STAGE/repo/src/fintual_executor/client.py" \
              "$STAGE/repo/src/fintual_executor/g8_history.py"
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo 'G7_HISTORY_PAGINATION_OFFLINE_TESTS_PASS=TRUE'
            echo 'ORIGINAL_FINANCIAL_PRODUCTION_UNCHANGED=TRUE'
