name: Fintual G6 controlled stale Chrome singleton recovery real-profile read-only
on:
  push:
    branches: [ci/fintual-g6-ipc-recovery-20261015]
    paths: [.github/workflows/fintual-g6-cold-profile-residual-lock-20261016.yml]
permissions:
  contents: read
jobs:
  cold-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify stale singleton owner absent, clear only orphan symlinks, read broker unarmed, always restore CDP
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 12s
          command_timeout: 240s
          script: |
            set -euo pipefail
            ORIGINAL=abf4db01082c77feef364a8925852a2633afbad2
            SOURCE=fc6803f5c2aa299f7aa4962887c68f65c0c72762
            RELEASE=/opt/fintual-httpx-releases/$SOURCE
            for unit in fintual-executor.service fintual-browser.service fintual-xvfb.service; do
              test "$(timeout 7s systemctl is-active "$unit")" = active
            done
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            test "$(systemctl is-enabled fintual-browser.service)" = enabled
            test "$(sudo -n readlink /opt/fintual-httpx-current || true)" = ""
            sudo -n test -f "$RELEASE/HTTPX_RUNTIME_READY.json"
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              PYTHONPATH="$RELEASE/src" PYTHONDONTWRITEBYTECODE=1 timeout 60s \
              "$RELEASE/.venv/bin/python" - <<'PY'
            import sqlite3
            from pathlib import Path
            from fintual_executor.client import FintualClient,get_pending
            con=sqlite3.connect(Path("/var/lib/fintual-executor/state.sqlite3").as_uri()+"?mode=ro",uri=True)
            try:
                con.execute("PRAGMA query_only=ON")
                assert con.execute("PRAGMA integrity_check").fetchone()==("ok",)
                assert con.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')").fetchone()[0]==0
            finally: con.close()
            client=FintualClient(execution_enabled=False)
            try:
                client.connect()
                pending=get_pending(client)
                assert pending["stocksPendingAssetMarketBuys"]==[]
                assert pending["stocksPendingAssetMarketSells"]==[]
            finally: client.close()
            print("FINAL_COLD_TEST_LIVE_PENDING_LOCAL_AND_BROKER=ZERO",flush=True)
            PY
            UNIT="fintual-g6-lock-resume-$$"
            RECOVERY=0
            restore() {
              if test "$RECOVERY" -eq 1; then
                sudo -n systemctl start fintual-browser.service || true
                sudo -n systemctl start fintual-executor.service || true
                systemctl is-active fintual-browser.service || true
                systemctl is-active fintual-executor.service || true
              fi
              sudo -n systemctl stop "$UNIT.timer" >/dev/null 2>&1 || true
            }
            trap restore EXIT
            sudo -n systemd-run --quiet --on-active=210s --unit="$UNIT" \
              /bin/sh -c 'systemctl start fintual-browser.service; systemctl start fintual-executor.service'
            RECOVERY=1
            sudo -n timeout 15s systemctl stop fintual-executor.service
            test "$(timeout 6s systemctl is-active fintual-executor.service)" = inactive
            # Broker pending BUY/SELL was checked immediately before quiescence.
            # Once the old executor is inactive, no new bot submissions can
            # arise. A second CDP fetch under heavy CPU pressure hung in prior
            # attempts; revalidate the single-writer local ledger instead.
            sudo -n /usr/bin/python3 - <<'PY'
            import sqlite3
            from pathlib import Path
            conn=sqlite3.connect(Path("/var/lib/fintual-executor/state.sqlite3").as_uri()+"?mode=ro",uri=True,timeout=6)
            try:
                conn.execute("PRAGMA query_only=ON")
                assert conn.execute("PRAGMA integrity_check").fetchone()==("ok",)
                assert conn.execute("SELECT COUNT(*) FROM order_intents WHERE state IN ('SIGNALLED','SUBMITTING','UNKNOWN','ACKNOWLEDGED','PARTIALLY_FILLED')").fetchone()[0]==0
            finally: conn.close()
            print("ORIGINAL_STOPPED_AND_LOCAL_LEDGER_STILL_CLEAR=PASS",flush=True)
            PY
            sudo -n timeout 15s systemctl stop fintual-browser.service
            test "$(timeout 6s systemctl is-active fintual-browser.service)" = inactive
            sudo -n /usr/bin/python3 - <<'PY'
            import os,re,stat
            from pathlib import Path
            profile=Path("/var/lib/fintual-browser/profile")
            lock=profile/"SingletonLock"
            assert profile.is_dir() and not profile.is_symlink()
            assert stat.S_IMODE(profile.stat().st_mode)&0o022==0
            # Chrome writes a host-pid symlink. If it remained after the
            # resident service stopped, remove ONLY after proving no
            # owner PID or Chrome process uses the profile.
            proc=Path("/proc")
            for candidate in proc.iterdir():
                if not candidate.name.isdigit():continue
                try: raw=(candidate/"cmdline").read_bytes()
                except (OSError,PermissionError):continue
                argv=raw.split(b"\0")
                if (
                    argv and
                    (b"chrome" in argv[0].lower() or b"chromium" in argv[0].lower())
                    and b"/var/lib/fintual-browser/profile" in raw
                ):
                    raise RuntimeError("REAL_CHROME_PROFILE_STILL_OWNED")
            if os.path.lexists(lock):
                assert stat.S_ISLNK(lock.lstat().st_mode),"REAL_CHROME_LOCK_NOT_SYMLINK"
                target=os.readlink(lock)
                matched=re.fullmatch(r"[^/]+-(\d+)",target)
                assert matched,"REAL_CHROME_LOCK_UNRECOGNIZED_FORMAT"
                assert not (proc/matched.group(1)).exists(),"REAL_CHROME_PID_STILL_EXISTS"
                print("REAL_CHROME_RESIDUAL_LOCK_VERIFIED_STALE=TRUE",flush=True)
                for name in ("SingletonLock","SingletonCookie","SingletonSocket"):
                    p=profile/name
                    if os.path.lexists(p):
                        assert stat.S_ISLNK(p.lstat().st_mode),"REAL_CHROME_SINGLETON_ENTRY_NOT_SYMLINK"
                        p.unlink()
                print("REAL_CHROME_RESIDUAL_SINGLETON_LINKS_CLEANED=TRUE",flush=True)
            else:
                print("REAL_CHROME_PROFILE_UNLOCKED_CLEANLY=TRUE",flush=True)
            assert not os.path.lexists(lock)
            PY
            sudo -n -u fintual env -u FINTUAL_REAL_EXECUTION -u FINTUAL_HTTP_MUTATIONS \
              DISPLAY=:99 HOME=/home/fintual PYTHONPATH="$RELEASE/src" PYTHONDONTWRITEBYTECODE=1 \
              timeout 60s "$RELEASE/.venv/bin/python" -u - <<'PY'
            import json
            from pathlib import Path
            from fintual_executor.order_session import HttpOrderSessionOwner
            from fintual_executor.transient_auth import bootstrap_transient_profile
            from fintual_executor.client import get_market_info,get_pending
            symbols=json.loads(Path("/etc/fintual-executor/config.json").read_text())["symbols"]
            with HttpOrderSessionOwner(requested_execution=False,config_execution_enabled=False) as owner:
                bootstrap_transient_profile(owner,profile=Path("/var/lib/fintual-browser/profile"),
                                            chrome_binary=Path("/var/lib/fintual-browser/chrome"))
                print("G6_REAL_PROFILE_TRANSIENT_BOOTSTRAP=PASS",flush=True)
                h=owner.borrow(armed=False)
                assert isinstance(get_market_info(h).get("isMarketOpen"),bool)
                p=get_pending(h)
                assert p["stocksPendingAssetMarketBuys"]==[] and p["stocksPendingAssetMarketSells"]==[]
                for sym in symbols:
                    price,ts=h.current_price(sym)
                    assert price.is_finite() and price>0 and bool(ts)
                print("G6_REAL_HTTPX_AUTH_AND_PRICES_AFTER_CHROME_CLOSED=PASS",flush=True)
                assert not h.execution_enabled
                print("G6_FINANCIAL_MUTATIONS_DISABLED=TRUE",flush=True)
            print("G6_AUTH_OWNER_CLOSED=TRUE",flush=True)
            PY
            test "$(timeout 6s systemctl is-active fintual-browser.service)" = inactive
            sudo -n test ! -L /var/lib/fintual-browser/profile/SingletonLock
            sudo -n timeout 20s systemctl start fintual-browser.service
            sudo -n timeout 20s systemctl start fintual-executor.service
            test "$(timeout 8s systemctl is-active fintual-browser.service)" = active
            test "$(timeout 8s systemctl is-active fintual-executor.service)" = active
            RECOVERY=0
            sudo -n systemctl stop "$UNIT.timer"
            trap - EXIT
            test "$(sudo -n -u fintual git -C /opt/fintual-executor rev-parse HEAD)" = "$ORIGINAL"
            echo G6_REAL_COLD_AUTH_COMPLETE_ORIGINAL_RESTORED=PASS
